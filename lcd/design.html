          '<span class="tag teal">' + VERSION.ver + '</span>' +
          '<span class="modal-close">' + ICO_CLOSE + '</span>' +
        '</div>' +
        '<div class="modal-body">' +
          '<div class="ver-list">' +
            kv('版本号',    VERSION.ver, 'var(--blue)') +
            kv('构建时间',  VERSION.build) +
            kv('commit id', VERSION.commit, 'var(--mauve)') +
          '</div>' +
          '<div class="ver-notes"><span class="k">发布说明</span>' +
            '<div class="ver-box"></div>' +
          '</div>' +
        '</div>' +
      '</div>' +
    '</div>';
}

/* 屏幕亮度弹窗：一个水平滑块调节，读数实时同步
   默认值见 BRIGHT；由 .foot-btn[data-modal="bright"] 触发 */
const BRIGHT = 68;

function brightModal() {
  return '<div class="modal-mask" data-modal="bright">' +
      '<div class="modal sm">' +
        '<div class="modal-head">' + ICO_SUN +
          '<span class="modal-title">屏幕亮度</span>' +
          '<span class="modal-close">' + ICO_CLOSE + '</span>' +
        '</div>' +
        '<div class="bright-body">' +
          '<input class="slider" type="range" min="10" max="100" step="1" value="' + BRIGHT +
            '" style="--p:' + BRIGHT + '%" aria-label="屏幕亮度">' +
          '<span class="bright-val mono">' + BRIGHT + '%</span>' +
        '</div>' +
      '</div>' +
    '</div>';
}

/* 重启设备二级确认弹窗：危险操作不能一步到位，需二次确认
   由 .foot-btn[data-modal="reboot"] 触发；只有两个按钮，都表示「结束本次确认」 */
function confirmModal() {
  return '<div class="modal-mask" data-modal="reboot">' +
      '<div class="modal confirm">' +
        '<div class="modal-head">' + ICO_POWER +
          '<span class="modal-title">重启设备</span>' +
          '<span class="modal-close">' + ICO_CLOSE + '</span>' +
        '</div>' +
        '<div class="confirm-foot">' +
          '<span class="cbtn danger">确认重启</span>' +
          '<span class="cbtn cancel">取消</span>' +
        '</div>' +
      '</div>' +
    '</div>';
}

/* 模式切换二级确认弹窗：屏幕 01、02、03 页签栏点「直连 / 聚合 / 卫星传输」触发 ——
   换模式要重建数据链路并重新拨号，当前连接会短暂中断，不能一步到位；
   与「重启设备 / 保存&应用」同一套 .modal.confirm，配色与按钮换成模式切换那一档：
   一行两个等大的「确定 / 取消」，确定黄实底、取消灰实底。
   一屏只有这一个实例，提示语里的目标模式名在点开时由 modeConfirm() 填 */
function modeModal() {
  return '<div class="modal-mask" data-modal="mode">' +
      '<div class="modal confirm mode">' +
        '<div class="modal-head">' + ICO_INFO +
          '<span class="modal-title">模式切换</span>' +
          '<span class="modal-close">' + ICO_CLOSE + '</span>' +
        '</div>' +
        '<div class="confirm-tip">确认切换到<b class="tip-to"></b>吗？</div>' +
        '<div class="confirm-foot">' +
          '<span class="cbtn warn">确定</span>' +
          '<span class="cbtn cancel">取消</span>' +
        '</div>' +
      '</div>' +
    '</div>';
}

/* 页脚按钮：图标 + 文案。cls = 附加样式（danger 危险操作 / primary 主操作 / secondary 次操作），
   modal = 点击开合的弹窗名，go = 目标页下标（屏幕号 - 1），back = 退回来源页（屏幕 08 的「返回」）；
   后三个都不传就是纯展示按钮 */
function footBtn(label, icon, cls, modal, go, back) {
  return '<span class="foot-btn' + (cls ? ' ' + cls : '') + '"' +
      (modal ? ' data-modal="' + modal + '"' : '') +
      (go === undefined ? '' : ' data-go="' + go + '"') +
      (back ? ' data-back' : '') + '>' +
      icon + '<span>' + label + '</span></span>';
}

/* 底部功能页脚：左「系统设置 / 版本信息」，右「屏幕亮度 / 重启设备」 → 屏幕 01、02、03 使用
   前三个按钮开弹窗（data-modal），「系统设置」是跳转按钮（data-go = 目标页序号 - 1）；
   末尾再挂一枚模式切换确认弹窗，「直连 / 聚合 / 卫星传输」页签点开的就是它 */
function footBar() {
  return '<div class="foot-bar">' +
      '<div class="foot-group">' +
        footBtn('系统设置', ICO_SETTINGS, '', null, SETTINGS_PAGE) +
        footBtn('版本信息', ICO_INFO, '', 'ver') +
      '</div>' +
      '<div class="foot-group">' +
        footBtn('屏幕亮度', ICO_SUN, '', 'bright') +
        footBtn('重启设备', ICO_POWER, 'danger', 'reboot') +   /* 危险操作：弹二级确认，不直接执行 */
      '</div>' +
    '</div>' + verModal() + brightModal() + confirmModal() + modeModal();
}

/* 二级设置页的功能页脚（屏幕 05 SIM 链路详情 / 屏幕 06 4G基站 / 屏幕 07 5G基站 /
   屏幕 08 系统设置 / 屏幕 09 卫星链路设置共用）：
   两个按钮都靠右下角，左「保存&应用」右「返回」，并用填充色区分主次 ——
   保存是主操作（蓝实底）、返回是次操作（灰实底）。
   和屏幕 01、02 的页脚同一个组件（.foot-bar / .foot-btn），只是按钮少、位置与语义都不同 ——
   返回是跳页（data-go）、回上层即屏幕 04 的链路入口页；保存不跳页、走二级确认弹窗：
   参数要下发到模组并重新拨号才生效，跟「重启设备」一样让用户再确认一次，避免误触。
   back = true 时「返回」不固定回屏幕 04，改成退回进来之前那一屏（走 [data-back]）——
   屏幕 08 是从屏幕 01 / 02 的页脚进来的，来源页不固定，只能这么回 */
function editFoot(back) {
  return '<div class="foot-bar" style="justify-content:flex-end">' +
      '<div class="foot-group">' +
        footBtn('保存&amp;应用', ICO_CHECK, 'primary', 'save') +
        (back ? footBtn('返回', ICO_BACK, 'secondary', null, undefined, true)
              : footBtn('返回', ICO_BACK, 'secondary', null, SIM_PAGE - 1)) +
      '</div>' +
    '</div>' + saveModal();
}

/* 保存&应用二级确认弹窗：屏幕 05、09 页脚的「保存&应用」触发
   结构与重启确认那枚一样（.modal.confirm + 一行两个按钮），只是图标走绿不表危险；
   两个按钮同样都表示「结束本次确认」 */
function saveModal() {
  return '<div class="modal-mask" data-modal="save">' +
      '<div class="modal confirm save">' +
        '<div class="modal-head">' + ICO_CHECK +
          '<span class="modal-title">保存并应用</span>' +
          '<span class="modal-close">' + ICO_CLOSE + '</span>' +
        '</div>' +
        '<div class="confirm-foot">' +
          '<span class="cbtn">保存并应用</span>' +
          '<span class="cbtn cancel">取消</span>' +
        '</div>' +
      '</div>' +
    '</div>';
}

/* 编辑参数弹窗：屏幕 06、07 上点「基站标识」或任意参数卡片弹出
   一屏只有这一个弹窗实例，标题与输入框在点开时按被点的那一项填（见 .edit-hit 的点击处理），
   所以这里只排静态骨架：标题栏（铅笔图标）+ 项名 + 输入框 + 确定 / 取消。
   点「确定」把输入框里的值写回数据并重渲染本屏，「取消 / ✕ / 遮罩」只收起不改数据 */
function editItemModal() {
  return '<div class="modal-mask" data-modal="edit">' +
      '<div class="modal edit">' +
        '<div class="modal-head">' + ICO_PEN +
          '<span class="modal-title">编辑参数</span>' +
          '<span class="modal-close">' + ICO_CLOSE + '</span>' +
        '</div>' +
        '<div class="modal-body">' +
          '<span class="k edit-name">参数</span>' +
          '<input class="edit-inp" type="text" value="" aria-label="参数值">' +
        '</div>' +
        '<div class="confirm-foot">' +
          '<span class="cbtn ok">确定</span>' +
          '<span class="cbtn cancel">取消</span>' +
        '</div>' +
      '</div>' +
    '</div>';
}

/* 屏幕外壳：页眉 + 页签栏 + 内容区 + 底部
   底部三种情况：传 footer 用自定义功能页脚；只传 foot 用提示底栏；都不传则整块不要底部
   页眉整条只有「工程模式 / 运维模式」两个模式按钮，group 传空串就整条不渲染 ——
   屏幕 05 是运维模式下的二级页、屏幕 08 整屏独立，都不给模式切换入口
   （屏幕 08 连通用的页签栏也不要，nav 也传空串；屏幕 05 保留页签栏，用来在各条链路之间切换） */
function shell(o) {
  const ops = o.group === '运维模式';
  const bottom = o.footer ? o.footer
      : (o.foot ? '<div class="bar-bot"><span>' + o.foot + '</span><span>854×480 · 设计稿样例数据</span></div>' : '');
  return (o.group ? '<div class="bar-top">' +
      '<span class="mode-btn' + (ops ? '' : ' on') + '">工程模式</span>' +
      '<span class="mode-btn' + (ops ? ' on ops' : '') + '">运维模式</span>' +
    '</div>' : '') +
    (o.nav ? '<div class="bar-nav">' + o.nav + '</div>' : '') +
    '<div class="body">' + o.body + '</div>' + bottom;
}

/* 基站状态卡片（4G / 5G 各一张，上下排列）→ 屏幕 01、02、03 使用
   只显示两项：物理小区ID（cardPci）与当前连接的用户个数（cardUe），两者都按 4 位数字控件的宽度预留；
   整卡底色随在线状态切换：在线淡绿（.on）/ 离线淡红（.off） */
function btsCard(b) {
  const pci = b.cardPci, ue = b.cardUe, on = b.online;
  return '<div class="bs-card ' + (on ? 'on' : 'off') + '">' +
      '<div class="bs-head"><span class="bs-name">' + b.label + '</span>' +
        '<span class="bs-state ' + (on ? 'on' : 'off') + '">' +
          '<i class="dot' + (on ? '' : ' bad') + '"></i>' + (on ? '在线' : '离线') +
        '</span></div>' +
      '<div class="bs-meta">' +
        '<div class="bs-kv"><span class="k">物理小区ID</span><span class="bs-id">' + pci + '</span></div>' +
        '<div class="bs-kv"><span class="k">连接用户数</span><span class="bs-num">' + ue + '</span></div>' +
      '</div>' +
    '</div>';
}

/* 链路状态面板 → 屏幕 01、02 左侧共用
   list 即要列出的链路：屏幕 01 传 DIRECT_SIMS（直连只有 SIM4 / SIM5 两条），
   屏幕 02 传 SIMS（聚合 5 条全列）
   单位一律提到表头（信号强度/dBm、实时带宽/Mbps、时延/ms），数值列只留数字，左右两屏口径一致；
   fixed = true（屏幕 02）时数值走固定位宽：带宽 000.00 / 时延 000 / 信号 -000，
   不足位宽处补白并右对齐，使小数点与个位在各行之间锁死 */
function simPanel(fixed, list) {
  const dec = fixed ? 2 : 1;                                  /* 屏幕 02 固定两位小数，屏幕 01 维持原样 */
  const fw = (txt, n) => fixed ? '<em class="fix-fw f' + n + '">' + txt + '</em>' : txt;
  /* 实时带宽的两个数字一律走 6ch 定宽占位（屏幕 01、02 一致）：
     ↑ / ↓ 的箭头与数字的相对位置不随数字位数左右跳动，两行之间也对得齐 */
  const fwRate = txt => '<em class="fix-fw f6">' + txt + '</em>';
  const rows = list.map(s => {
    const st = SIM_STATE[s.state];
    return '<div class="sim-row">' +
      '<span class="sim-name">' + s.name + '</span>' +
      '<span class="sim-op">' +
        (OP_LOGO[s.op] ? '<img class="op-logo" src="' + OP_LOGO[s.op] + '" alt="">' : '') +
        s.op + '</span>' +
      '<span class="sim-state ' + st.cls + '"><i class="dot"></i>' + s.state + '</span>' +
      '<span class="sim-sig">' + barsHtml(st.sig ? signalBars(s.signal) : 0, st.sig ? sigTone(s.signal) : '') +
        '<span class="sim-dbm">' + fw(st.sig ? s.signal : '--', 4) + '</span></span>' +
      '<span class="sim-rate">' +
        '<span class="up"><i class="arw">↑</i> <span class="' + (st.data ? 'up' : 'idle') + '">' + fwRate(st.data ? fmt(s.up, dec) : '--') + '</span></span>' +
        '<span class="down"><i class="arw">↓</i> <span class="' + (st.data ? 'down' : 'idle') + '">' + fwRate(st.data ? fmt(s.down, dec) : '--') + '</span></span>' +
      '</span>' +
      '<span class="sim-ping' + (st.data ? '' : ' idle') + '">' + fw(st.data ? fmt(s.ping, 0) : '--', 3) + '</span>' +
    '</div>';
  }).join('');

  return '<section class="panel' + (fixed ? ' sim-agg' : '') + '" style="flex:1">' +
      '<div class="panel-title"><span>链路状态</span></div>' +
      '<div class="sim-head">' +
        '<span>链路</span><span>运营商</span><span>在线状态</span>' +
        '<span>信号强度/dBm</span><span>实时带宽/Mbps</span><span>时延/ms</span>' +
      '</div>' +
      '<div class="sim-list">' + rows + '</div>' +
    '</section>';
}

/* 基站状态面板（4G / 5G 上下两张卡片）→ 屏幕 01、02 右侧 / 屏幕 03 右栏共用 */
function btsPanel() {
  return '<section class="panel" style="flex:1">' +
      '<div class="panel-title"><span>基站状态</span></div>' +
      btsCard(BTS4) +
      btsCard(BTS5) +
    '</section>';
}

/* ============================================================
   四、九个页面（每个函数就是界面上的一个屏幕，序号即页面序号）
   ============================================================ */

/* ========== 屏幕 01 · 工程模式 · 直连模式（首页默认） → renderDirect() ==========
   左：链路状态——直连只认 SIM4 / SIM5 两张卡，故只列这两条链路，
       每行显示 运营商 / 在线状态 / 信号强度 / 实时带宽 / 时延
       （带宽与时延的单位统一写在表头，数值列只留数字）
   右：基站状态——上下两张卡片，分别为 4G 基站（在线·淡绿）与 5G 基站（离线·淡红）
   底：功能页脚——左「系统设置 / 版本信息」，右「屏幕亮度 / 重启设备」（替代提示底栏）
   ============================================================================== */
function renderDirect() {
  const body =
    '<div class="row" style="flex:1">' +
      '<div class="col" style="flex:0 0 552px">' + simPanel(false, DIRECT_SIMS) + '</div>' +
      '<div class="col" style="flex:1">' + btsPanel() + '</div>' +
    '</div>';
  return shell({ group: '工程模式', nav: engNav('直连模式'), body: body, footer: footBar() });
}

/* ========== 屏幕 02 · 工程模式 · 聚合模式 → renderAgg() ==========
   与屏幕 01 直连模式同构：左「链路状态」+ 右「基站状态」+ 功能页脚，
   仅在其上方增加一条「聚合链路状态」卡片：连接状态 / 实时上下行速率 / 时延 / 聚合链路数量。
   ============================================================================== */
function renderAgg() {
  const on = SIMS.filter(s => s.state === '在线');
  const aggOn = on.length > 0;                 // 聚合链路：只要还有一条在线即为在线
  const sumUp = on.reduce((s, x) => s + x.up, 0);
  const sumDown = on.reduce((s, x) => s + x.down, 0);
  const avgPing = on.length ? on.reduce((s, x) => s + x.ping, 0) / on.length : 0;

  /* 数值按固定位宽输出：速率 000.00、时延 000。
     不足位宽处补白并右对齐，Mbps / ms 的起点便不随数字位数左右跳动，做法与链路状态表一致 */
  const fw = (txt, n) => '<em class="fix-fw f' + n + '">' + txt + '</em>';

  const aggBar =
    '<div class="row" style="flex:0 0 96px">' +
      '<section class="panel row-panel agg-bar" style="flex:1">' +
        '<div class="half"><span class="k">聚合链路状态</span>' +
          '<div class="kpi agg-state">' +
            '<span class="st ' + (aggOn ? 'on' : 'off') + '">' + (aggOn ? '在线' : '离线') + '</span>' +
          '</div></div>' +
        '<div class="half"><span class="k">实时上行速率</span>' +
          '<div class="kpi"><span class="num" style="color:var(--blue)">' + fw(sumUp.toFixed(2), 6) +
            '</span><span class="u">Mbps</span></div></div>' +
        '<div class="half"><span class="k">实时下行速率</span>' +
          '<div class="kpi"><span class="num" style="color:var(--yellow)">' + fw(sumDown.toFixed(2), 6) +
            '</span><span class="u">Mbps</span></div></div>' +
        '<div class="half"><span class="k">时延</span>' +
          '<div class="kpi"><span class="num" style="color:var(--mauve)">' + fw(avgPing.toFixed(0), 3) +
            '</span><span class="u">ms</span></div></div>' +
        '<div class="half"><span class="k">聚合链路数量</span>' +
          '<div class="kpi"><span class="num" style="color:var(--green)">' + on.length +
            '<span class="of">/' + SIMS.length + '</span></span><span class="u">在线</span></div></div>' +
      '</section>' +
    '</div>';

  const body = aggBar +
    '<div class="row" style="flex:1">' +
      '<div class="col" style="flex:0 0 552px">' + simPanel(true, SIMS) + '</div>' +
      '<div class="col" style="flex:1">' + btsPanel() + '</div>' +
    '</div>';

  return shell({ group: '工程模式', nav: engNav('聚合模式'), body: body, footer: footBar() });
}

/* ========== 屏幕 03 · 工程模式 · 卫星传输 → renderSat() ==========
   左（288px）：卫星状态面板，顶部一枚卫星示意图（替代原环形仪表），
               下方依次是「链路状态」（同一时刻只显示一种：无卫星链路 / 在线 / 离线，
               值域按最长文案预留宽度）、信噪比读数，
               以及卫星参数（卫星标识 / 波束 / 仰角 / 方位角 / 频段）
   中（剩余宽度）：上行速率 / 下行速率 / 链路时延 / 链路抖动 四张等分指标卡，
               横排：左侧与数值同色的圆形图标，右侧名称与「数值 + 单位」两行，无趋势柱
   右（288px）：基站状态面板（4G / 5G 上下两张卡，与屏幕 01、02 同一套 .bs-card）
   底部：与屏幕 01、02 同款功能页脚（系统设置 / 版本信息 / 屏幕亮度 / 重启设备）
   ============================================================================== */
function renderSat() {
  /* 四张卡的图标：复用全局 ico()（24×24 viewBox、1.8 线宽），显示尺寸 30px，颜色取自 .m-ico 上的行内 accent
     上/下行  圆圈 + 朝上（下）箭头
     链路时延  圆圈 + 时针与分针
     链路抖动  圆圈 + 一段心电波形（"类似"心电图：平线 - 尖峰 - 回落 - 平线） */
  const ICO_UP    = ico('<circle cx="12" cy="12" r="9"/><path d="M12 16.6V7.8M8.7 11.1 12 7.7l3.3 3.4"/>');
  const ICO_DOWN  = ico('<circle cx="12" cy="12" r="9"/><path d="M12 7.4v8.8M8.7 12.9 12 16.3l3.3-3.4"/>');
  const ICO_CLOCK = ico('<circle cx="12" cy="12" r="9"/><path d="M12 7.4V12l3.3 2"/>');
  const ICO_PULSE = ico('<circle cx="12" cy="12" r="9"/><path d="M6.4 12h2l1.2-2.6 1.6 5 1.2-3.4.9 1.6h2.3"/>');

  /* 左栏顶部的卫星示意图：取 Tabler Icons 的 satellite（outline，MIT 许可）原样搬入 ——
     中央一根 45° 倾斜的圆角长条星体，右上、左下各挂一片菱形太阳能板，
     朝向右下伸出一小段天线短杆，外侧再补内（r=2.5）外（r=6）两道同心信号弧，表示正对地面站通信；
     纯描边无填充，颜色继承 .sat-fig 的 color（teal）。
     viewBox 收紧到图形外框（原 0 0 24 24 的墨迹只占 3~21，四周全是留白）：
     改成 2.5 2.5 19 19 后放大倍率由 4 提到 5.05，实绘从 72×72 变成 91×91px，
     线宽同步由 0.9 降到 0.75，让屏幕上的实际线宽落在 3.8px 左右，
     与原来那张示意图的观感粗细持平，不会比页面里其他图标明显更重 */
  const SAT_FIG =
    '<svg viewBox="2.5 2.5 19 19" fill="none" stroke="currentColor" stroke-width="0.75" ' +
      'stroke-linecap="round" stroke-linejoin="round" preserveAspectRatio="xMidYMid meet">' +
      '<path d="M3.707 6.293l2.586-2.586a1 1 0 0 1 1.414 0l5.586 5.586a1 1 0 0 1 0 1.414l-2.586 2.586a1 1 0 0 1-1.414 0l-5.586-5.586a1 1 0 0 1 0-1.414"/>' +  /* 星体（45° 倾斜的圆角长条） */
      '<path d="M6 10l-3 3 3 3 3-3"/>' +                                    /* 左下方太阳能板（菱形） */
      '<path d="M10 6l3-3 3 3-3 3"/>' +                                     /* 右上方太阳能板（菱形） */
      '<path d="M12 12l1.5 1.5"/>' +                                        /* 天线短杆 */
      '<path d="M14.5 17a2.5 2.5 0 0 0 2.5-2.5"/>' +                        /* 内侧信号弧 */
      '<path d="M15 21a6 6 0 0 0 6-6"/>' +                                  /* 外侧信号弧 */
    '</svg>';

  /* 中栏四张指标卡同构：左侧圆形图标 + 右侧「名称 / 数值 + 单位」，图标与数值同色 */
  const metric = (title, svg, num, unit, color) =>
    '<section class="panel m-card" style="flex:1">' +
      '<span class="m-ico" style="color:' + color + '">' + svg + '</span>' +
      '<div class="m-txt">' +
        '<span class="m-name">' + title + '</span>' +
        '<div class="kpi"><span class="num" style="color:' + color + '">' + num + '</span><span class="u">' + unit + '</span></div>' +
      '</div>' +
    '</section>';
  const body =
    '<div class="row" style="flex:1">' +
      '<div class="col" style="flex:0 0 288px">' +
        '<section class="panel sat-panel" style="flex:1">' +
          '<div class="panel-title"><span>卫星状态</span></div>' +
          '<div class="sat-fig">' + SAT_FIG + '</div>' +
          /* 链路状态同一时刻只显示一种（无卫星链路 / 在线 / 离线）：徽标底色即状态语义色，
             宽度随文案自适应，三种状态各自的控件宽度都能用尺子分别量出来；点一下换下一种。
             class 里 state-slot 必须排在 v 前面 —— rulerName() 取首个命中名称表的 class，
             若 v 在前会被标成通用的「值」，排在前面才显示为「链路状态徽标」 */
          '<div class="kv"><span class="k">链路状态</span>' +
            '<span class="state-slot v ' + LINK_STATES[linkIdx].cls + '">' + LINK_STATES[linkIdx].text + '</span></div>' +
          kv('信噪比', SAT.cn0 + ' dBHz') +
          kv('卫星标识', 'SAT-KU-03') +
          kv('波束', '亚太6D · 东波束') +
          kv('仰角', '45.2°') +
          kv('方位角', '182.4°') +
          kv('频段', 'Ku · 12.5GHz') +
        '</section>' +
      '</div>' +
      '<div class="col" style="flex:1">' +
        metric('上行速率', ICO_UP,    fmt(SAT.up),     'Mbps', 'var(--blue)') +
        metric('下行速率', ICO_DOWN,  fmt(SAT.down),   'Mbps', 'var(--yellow)') +
        metric('链路时延（RTT）', ICO_CLOCK, fmt(SAT.ping, 0),   'ms', 'var(--mauve)') +
        metric('链路抖动', ICO_PULSE, fmt(SAT.jitter, 0), 'ms', 'var(--green)') +
      '</div>' +
      '<div class="col" style="flex:0 0 288px">' + btsPanel() + '</div>' +
    '</div>';
  return shell({ group: '工程模式', nav: engNav('卫星传输'), body: body, footer: footBar() });
}

/* ========== 屏幕 04 · 运维模式 · 首页（设置入口） → renderOpsHome() ==========
   运维模式第一屏，只做入口：不放页签栏（顶部只留「工程模式 / 运维模式」模式切换页眉），
   也不放底部栏，高度全留给入口卡。
   内容区上下两张面板，上面「链路设置」列出 6 条可设置的链路（SIM1~SIM5 + 卫星链路），
   下面「基站设置」列出 2 个可设置的基站。外层网格是固定的（链路 3 列 × 2 行、基站 2 列），
   卡内排布两种卡都走同一套左右分栏：
     链路卡 = 左栏「链路图标 + 链路标识」，
              右栏竖排两行 —— 上面在线状态、下面运营商（卫星链路没有运营商，右栏只有状态徽标）；
              在线状态：SIM 用屏幕 01 / 02 那套 .sim-state，
                        卫星用屏幕 03 的三态 .state-slot
     基站卡 = 左栏「基站图标 + 基站名」，
              右栏竖排三行 —— 在线状态 .bts-state、物理小区ID / 连接用户数两行 .set-kv；
              4G / 5G 靠图标形状区分（波束弧数不同），状态与数值取自 BTS4 / BTS5
   免得点进二级页之前分不清正在设置哪条链路、也看不出它是通的还是断的。
   点卡片进各自的详情页：5 张 SIM 卡都进屏幕 05（同一个模板，卡上的 data-sim 决定
   进去后先看哪条链路），两个基站分别进屏幕 06 / 07，卫星链路进屏幕 09（卫星链路设置）；
   6 张链路卡都挂 data-go，只有 SIM 卡另挂 data-sim（卫星那条 sim 为 null，不挂）。
   卡片数据 / 跳转关系见「一、样例数据 → OPS_HOME_LINKS / OPS_HOME_BTS」。
   ============================================================================== */
function renderOpsHome() {
  const card = it =>
    '<div class="set-card link" data-go="' + it.go + '"' +
      (it.sim === null ? '' : ' data-sim="' + it.sim + '"') + '>' +
      '<span class="set-l">' +
        '<span class="set-ico ' + it.ico + '">' + (it.ico === 'sim' ? ICO_SIM : ICO_SAT) + '</span>' +
        '<span class="set-t1">' + it.t1 + '</span>' +
      '</span>' +
      '<span class="set-r">' +
        (it.st
          ? '<span class="sim-state ' + it.st.cls + '"><i class="dot"></i>' + it.st.text + '</span>'
          : '<span class="state-slot ' + it.slot.cls + '">' + it.slot.text + '</span>') +
        (it.op ? '<span class="set-t2 sim-op">' +
                   (OP_LOGO[it.op] ? '<img class="op-logo" src="' + OP_LOGO[it.op] + '" alt="">' : '') + it.op +
                 '</span>' : '') +
      '</span>' +
      (it.go === null ? '' : '<span class="set-go">' + ICO_CHEVRON + '</span>') +
    '</div>';

  const btsCard = it =>
    '<div class="set-card bts"' + (it.go === null ? '' : ' data-go="' + it.go + '"') + '>' +
      '<span class="set-l">' +
        '<span class="set-ico ' + it.ico + '">' + (it.ico === 'bts4' ? ICO_BTS4 : ICO_BTS5) + '</span>' +
        '<span class="set-t1">' + it.t1 + '</span>' +
      '</span>' +
      '<span class="set-r">' +
        '<span class="bts-state ' + (it.online ? 'on' : 'off') + '">' +
          '<i class="dot"></i>' + (it.online ? '在线' : '离线') +
        '</span>' +
        '<span class="set-kv"><span class="k">物理小区ID</span><span class="v">' + it.pci + '</span></span>' +
        '<span class="set-kv"><span class="k">连接用户数</span><span class="v">' + it.ue + '</span></span>' +
      '</span>' +
      (it.go === null ? '' : '<span class="set-go">' + ICO_CHEVRON + '</span>') +
    '</div>';

  const body =
    '<section class="panel" style="flex:0 0 250px">' +
      '<div class="panel-title"><span>链路设置</span></div>' +
      '<div class="set-grid links">' + OPS_HOME_LINKS.map(card).join('') + '</div>' +
    '</section>' +
    '<section class="panel" style="flex:1">' +
      '<div class="panel-title"><span>基站设置</span></div>' +
      '<div class="set-grid bts">' + OPS_HOME_BTS.map(btsCard).join('') + '</div>' +
    '</section>';

  return shell({ group: '运维模式', body: body });   /* 不放底部栏，高度全留给两张入口面板 */
}

/* ========== 屏幕 05 · 运维模式 · SIM 链路详情 → simPage() ==========
   5 条 SIM 链路的二级页长得一模一样、只是数据不同，所以只画这一屏、不按链路分成多屏。
   看的是哪条链路记在 opsSel（OPS 下标），页面函数只做「取当前链路 + 交给下面的模板渲染」，
   真正的排版在 renderOperator() 里；两处入口都会先定好 opsSel：
     · 屏幕 04 的 SIM 卡 → 卡上的 data-sim（在 OPS_HOME_LINKS 里按 SIM 序号给好）
     · 本屏页签栏左半「SIM链路」→ data-sim，点了就地重渲染本屏，不换屏
   OPS 的第 i 条就是 SIM(i+1)：在线的那条数据最全，拨号中 / 离线 / 未插卡 / 已禁用的
   相邻小区依次变少或为空，两张锁小区卡也就跟着从「已锁定」变成未锁定。
   ================================================================= */
let opsSel = 0;

function simPage() {
  return renderOperator(OPS[opsSel]);
}

/* 屏幕 05「相邻小区」两栏没有读数时，按链路状态说明原因（三种状态各一句）；
   状态取值见「一、样例数据 → OPS」，其余状态用兜底文案 */
const NB_EMPTY = {
  '离线':   '无相邻小区信息（当前链路已离线）',
  '未插卡': '无相邻小区信息（未检测到 SIM 卡）',
  '已禁用': '无相邻小区信息（该链路已禁用）'
};

/* 屏幕 05 的排版模板：op = 一条链路的数据（改数据见「一、样例数据 → OPS」）。
   本屏是「SIM 链路的设置页」，上半屏三张设置卡、下半屏并排两栏相邻小区：
     左上 · SIM 参数设置 —— 链路开关 / 入网方式 / APN / 鉴权方式 / 用户名 / 密码
     右上 · 锁LTE小区、锁5G小区 —— 4G、5G 各一张，各自锁自己制式下的那个小区
     下半 · LTE相邻小区信息、NR-5G相邻小区信息 —— 各是一块「固定表头 + 可手动滚动的文本」
            （nbPanel），左右并排占满下半屏
   在线状态与信号强度不在这屏出现：前者在页签栏的状态点上，后者在屏幕 04 的入口卡上，
   本屏只管设置；也不放页脚（底部提示栏那一条），把高度全让给相邻小区 */
function renderOperator(op) {
  /* 左上「SIM 参数设置」：第一行链路开关（这条链路整体启用 / 禁用），
     入网方式 / 鉴权方式走分段选择器（把可选值全摆出来），
     APN / 用户名 / 密码走 inp()（值 + 行尾一支铅笔 = 屏上点开软键盘），密码打码；
     三排按钮都是「能点的开关」，各自带上写的字段名（见 seg()），点了就地切换 */
  const pwd = '•'.repeat(op.pwd.length);
  const setCard =
    '<section class="panel" style="flex:0 0 306px;gap:6px">' +
      '<div class="panel-title"><span>SIM 参数设置</span></div>' +
      '<div class="field"><span class="k">链路开关</span>' +
        seg([['启用', !op.disabled], ['禁用', op.disabled]], 'disabled') + '</div>' +
      '<div class="field"><span class="k">入网方式</span>' +
        seg(NET_MODES.map(t => [t, t === op.net]), 'net') + '</div>' +
      '<div class="field"><span class="k">APN</span>' + inp(op.apn) + '</div>' +
      '<div class="field"><span class="k">鉴权方式</span>' +
        seg(AUTH_MODES.map(t => [t, t === op.auth]), 'auth') + '</div>' +
      '<div class="field"><span class="k">用户名</span>' + inp(op.user) + '</div>' +
      '<div class="field"><span class="k">密码</span>' + inp(pwd) + '</div>' +
    '</section>';

  /* 右上两张锁小区卡：4G / 5G 各一张，锁的是相邻小区里对应制式下 lock = true 的那一个，
     没锁就整卡显示 '--'。卡头右边那行小字说明锁上以后的行为（原来放「已锁定」标签的位置，
     锁没锁上直接看下面的「锁定开关」）。两张卡要填的参数按制式给：
       LTE = 锁定开关 / PCID(十进制) / 频点 / 频段
       5G  = 锁定开关 / PCID(十进制) / 频点 / 频段 / 子载波间隔（子载波间隔只有 NR 有）
     锁定开关写的字段就是这条链路的 lte / nr 那组小区（lockLte / lockNr）：
     开启 = 锁上该制式里信号最好的那个小区，关闭 = 把该制式的锁清掉 */
  const lockCard = (title, hint, c, fields, key) =>
    '<section class="panel" style="flex:1;gap:6px">' +
      '<div class="panel-title"><span>' + title + '</span>' +
        '<span class="cell-hint">' + hint + '</span></div>' +
      '<div class="field"><span class="k">锁定开关</span>' +
        seg([['开启', !!c], ['关闭', !c]], key) + '</div>' +
      '<div class="field"><span class="k">PCID(十进制)</span>' +
        '<span class="mono">' + (c ? c.pci : '--') + '</span></div>' +
      fields.map(f => '<div class="field"><span class="k">' + f[0] + '</span>' +
        '<span class="mono">' + (c ? c[f[1]] : '--') + '</span></div>').join('') +
    '</section>';

  /* 下半屏并排两栏相邻小区（左 LTE、右 NR-5G），列见 NB_TABLES；
     两栏都没有读数（离线 / 未插卡 / 已禁用）时各自走空态，文案按状态给 */
  const nbEmpty = NB_EMPTY[op.state] || '无相邻小区信息';
  const nbRow = NB_TABLES.map(t => nbPanel(t, op[t.key], nbEmpty)).join('');

  /* 上半屏那行 198px 是按左边「SIM 参数设置」（6 行，最高的那张）定死的，
     剩下的都留给下半屏的相邻小区，本屏不放页脚，底栏那 24px 也一并给了它 */
  const body =
    '<div class="row" style="flex:0 0 198px">' + setCard +
      lockCard('锁LTE小区', '锁定后仅驻留该 4G 小区', op.lte.find(n => n.lock),
               [['频点', 'freq'], ['频段', 'band']], 'lockLte') +
      lockCard('锁5G小区',  '锁定后仅驻留该 5G 小区', op.nr.find(n => n.lock),
               [['频点', 'freq'], ['频段', 'band'], ['子载波间隔', 'scs']], 'lockNr') +
    '</div>' +
    '<div class="row" style="flex:1">' + nbRow + '</div>';

  return shell({
    group: '',                 /* 二级页不给模式切换入口，页眉整条不要 */
    nav: opsNav(op.name),
    footer: editFoot(),        /* 底部换成页脚：左「保存&应用」右「返回」 */
    body: body
  });
}

/* ========== 屏幕 09 · 运维模式 · 卫星链路设置 → satSettingsPage() ==========
   屏幕 04「卫星链路」入口卡的落点（那一屏的 6 张链路卡里，只有卫星这张原来点了没反应）。
   精简版：只有一张「卫星参数设置」卡，4 项可编辑参数 ——
     链路开关（启用 / 禁用）、卫星系统、频段、卫星标识（文本输入框）。
   卡片铺满内容区（只让开底部页脚那一条），卡内 4 行参数单列竖排、整列左对齐 ——
   标签列固定 80px 宽（四个标签都在 4 个字以内，统一宽度后左边缘自然对齐），
   控件紧跟在标签列后面（8px 间隙），控件左边缘也因此对齐成一列；
   .field 默认是 label 贴左、控件贴右的 space-between，这里改成 flex-start 才收得拢；
   每行高固定 56px（行内控件 22px 高，上下各留 17px），不再让 4 行去均分整张卡的高度 ——
   卡高 420px 均分下来每行要 89.5px，行与行之间空得太大，参数看着散；
   缩到 56px 后行距回到正常表单的密度，卡片下方多出来的空档留白。
   链路开关的语义与屏幕 05 的链路开关一致：禁用 = 这条链路不拨号（屏幕 03 上按「无卫星链路」看）。
   本屏是二级页：不给模式切换页眉，也不带页签栏（卫星只有一条链路，没有可就地切换的兄弟页），
   底部与屏幕 05 同款功能页脚（editFoot）：左「保存&应用」（二级确认）右「返回」（回屏幕 04）。
   只读读数（信噪比 / 上行 / 下行 / 时延 / 抖动）不在这屏，仍在屏幕 03「卫星传输」上。
   可编辑项的样例值见「一、样例数据 → SAT_SET / SAT_SYSTEMS / SAT_BANDS」。
   ========================================================================== */
function satSettingsPage() {
  const s = SAT_SET;
  const field = (k, ctrl) =>
    '<div class="field" style="flex:0 0 56px;justify-content:flex-start">' +
      '<span class="k" style="width:80px">' + k + '</span>' + ctrl + '</div>';
  const setCard =
    '<section class="panel" style="flex:1;gap:6px">' +
      '<div class="panel-title"><span>卫星参数设置</span></div>' +
      field('链路开关', seg([['启用', !s.disabled], ['禁用', s.disabled]], 'disabled', 'sat')) +
      field('卫星系统', seg(SAT_SYSTEMS.map(t => [t, t === s.system]), 'system', 'sat')) +
      field('频段',     seg(SAT_BANDS.map(t => [t, t === s.band]), 'band', 'sat')) +
      field('卫星标识', inp(s.id)) +
    '</section>';

  return shell({
    group: '',                 /* 二级页不给模式切换入口，页眉整条不要 */
    footer: editFoot(),        /* 底部：左「保存&应用」右「返回」 */
    body: '<div class="row" style="flex:1">' + setCard + '</div>'
  });
}

/* ========== 屏幕 06~07 · 运维模式 · 基站设置（共用本模板） ==========
   SCREENS[5] → renderBase(BTS4)  屏幕 06 4G基站
   SCREENS[6] → renderBase(BTS5)  屏幕 07 5G基站
   两屏结构相同，差异只来自传入的 b 数据（改数据见「一、样例数据 → BTS4 / BTS5」）。

   整屏都是「可设置项」，改法按参数的形态分两种：
     左 · 基站标识 —— 24px 等宽大字 + 行尾一支铅笔，点它弹编辑弹窗改这串标识；
          下面一行「小区状态」是能点的开关（激活 / 禁用，点哪项切哪项，写回 b.status）
     右 · 小区参数 —— 六（5G 是七）张参数卡片，绝大多数是「数值 + 单位 + 铅笔」，
          点卡片弹编辑弹窗；「工作模式」只有 FDD / TDD 两种，排成两个按钮、点了直接切。
          本屏按「保留卡片网格」的写法只加铅笔 / 按钮与点击热区，不改成一格一行的字段行
     左栏下半的「UE 个数 + 负载条 + 容量说明」是唯一保留的只读监控（不弹窗、不可点）：
       连接数是测出来的、不是参数，故不做成开关；参数本身（最大接入数）不在这屏
     底部换成与屏幕 05 完全一致的功能页脚 editFoot()：左「保存&应用」右「返回」（回屏幕 04）
   ================================================================== */
function renderBase(b) {
  const body =
    '<div class="row" style="flex:1">' +
      '<section class="panel" style="flex:0 0 320px">' +
        '<div class="panel-title"><span>' + b.idName + '</span></div>' +
        /* 标识整块可点：data-e = 写回哪份数据（BTS_KEYS 的 key）、data-p = 改哪个字段 */
        '<div class="big-id edit-hit" data-e="' + b.key + '" data-p="id">' +
          b.id + '<span class="pen">' + ICO_PEN + '</span></div>' +
        '<div class="field"><span class="k">小区状态</span>' +
          seg([['激活', b.status === '激活'], ['禁用', b.status !== '激活', 'bad']],
              'status', b.key) + '</div>' +
        /* 分隔线以下（UE 那一组只读读数）贴着小区状态那行往下排，
           不往卡片底部撑：这组是监控读数，靠上更顺手，余下的空白留在卡片下方 */
        '<div class="hr"></div>' +
        '<span class="k muted" style="font-size:11px">UE 个数</span>' +
        '<div class="kpi"><span class="num" style="color:var(--green)">' + b.ue + '</span><span class="u">个</span></div>' +
        meter(b.ue / b.ueMax, 'var(--green)') +
        '<div class="cell-hint">小区容量 ' + b.ueMax + ' · 负载 ' + (b.ue / b.ueMax * 100).toFixed(0) + '%</div>' +
      '</section>' +
      '<section class="panel" style="flex:1">' +
        /* 卡头不再挂基站名标签：本屏就是 4G / 5G 基站的设置页，页签栏与标识里都已写明 */
        '<div class="panel-title"><span>小区参数</span></div>' +
        '<div class="cells">' + b.cells.map((c, i) => cell(c, b.key, i)).join('') + '</div>' +
      '</section>' +
    '</div>';

  /* 页眉整条不要（进入本屏后不再给「工程模式 / 运维模式」入口，与屏幕 05、09 一致）；
     底部除了页脚，还带出本屏的编辑参数弹窗 */
  return shell({
    group: '',
    nav: opsNav(b.label),
    body: body,
    footer: editFoot() + editItemModal()
  });
}

/* ========== 屏幕 08 · 系统设置 → renderSettings() ==========
   入口：屏幕 01、02 页脚的「系统设置」按钮（data-go 跳转，不弹窗）。
   整屏独立：没有页眉的模式切换、没有工程模式页签栏，底部是屏幕 05 同款功能页脚
   （editFoot(true)：左「保存&应用」右「返回」，尺寸、位置、配色都与屏幕 05 一致，
   只有「返回」的目标不同 —— 本屏是从屏幕 01 / 02 进来的、来源页不固定，
   所以那枚按钮走 [data-back] 退回进来之前那一屏，见「八、跳转调试台」的派发）。
   两项设置合并在一张卡里，一行一项，左边项名、右边控件，行间一条分隔线：
     管理平台地址 —— IP 大字（等宽、蓝色）+ 行尾铅笔，整块可点，弹编辑弹窗改这串地址
     状态上报频率 —— 四档选择器（5s / 15s / 30s / 60s，默认 15s）
   两行等分卡片高度（.sys-row），所以卡片铺满内容区、每项在行内竖直居中；
   样例值见「一、样例数据 → SYS_SET / REPORT_STEPS」。
   ============================================================ */
function renderSettings() {
  const s = SYS_SET;
  /* 一行设置：左边项名（固定宽度，两行左对齐）、右边控件 */
  const field = (k, ctrl) =>
    '<div class="sys-row">' +
      '<span class="k">' + k + '</span>' +
      '<div class="sys-ctl">' + ctrl + '</div>' +
    '</div>';
  const body =
    '<section class="panel" style="flex:1">' +
      '<div class="panel-title"><span>系统设置</span></div>' +
      field('管理平台地址',
        '<div class="big-id edit-hit" data-e="sys" data-p="ip">' + s.ip +
          '<span class="pen">' + ICO_PEN + '</span></div>') +
      '<div class="hr"></div>' +
      field('状态上报频率',
        seg(REPORT_STEPS.map(n => [n + 's', n === s.report]), 'report', 'sys')) +
    '</section>';
  /* 页眉整条不要（进本屏后不再给模式切换入口，与屏幕 05、06、07、09 一致）；
     footer = 屏幕 05 同款功能页脚（返回改走 data-back）+ 本屏的编辑参数弹窗 */
  return shell({ group: '', body: body, footer: editFoot(true) + editItemModal() });
}

/* ============================================================
   五、页面清单（9 屏）
   数组第 N 项 = 页面第 N 屏，渲染顺序即界面上的纵向排列顺序。
   ============================================================ */
const SCREENS = [
  /* 屏幕 01 */ { g: '工程模式', n: '直连模式（首页默认）', h: renderDirect },
  /* 屏幕 02 */ { g: '工程模式', n: '聚合模式',             h: renderAgg },
  /* 屏幕 03 */ { g: '工程模式', n: '卫星传输',             h: renderSat },
  /* 屏幕 04 */ { g: '运维模式', n: '首页默认 · 设置入口',  h: renderOpsHome },
  /* 屏幕 05 */ { g: '运维模式', n: 'SIM 链路详情',         h: simPage },
  /* 屏幕 06 */ { g: '运维模式', n: '4G基站',               h: () => renderBase(BTS4) },
  /* 屏幕 07 */ { g: '运维模式', n: '5G基站',               h: () => renderBase(BTS5) },
  /* 屏幕 08 */ { g: '系统设置', n: '平台与上报',           h: renderSettings },
  /* 屏幕 09 */ { g: '运维模式', n: '卫星链路设置',         h: satSettingsPage }
];
/* 屏幕 05 / 09 的下标必须与上面的 SIM_PAGE / SAT_PAGE 一致（屏幕号 - 1） */

/* 「系统设置」页在 SCREENS 中的下标 = 屏幕号 - 1；屏幕 01、02 页脚按钮据此跳转。
   这里不能再写 SCREENS.length - 1：屏幕 09 卫星链路设置追加在它后面，系统设置已不是末屏 */
const SETTINGS_PAGE = 7;

/* 顶部页签：一屏一个按钮，点哪个就把「跳转调试台」那块活屏切到哪一屏
   （页签文案与高亮由 buildTabs() 维护，点这里与点右侧「页面清单」是同一个动作） */
function buildTabs() {
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = SCREENS.map((s, i) =>
    '<button class="ttab' + (s.g === '运维模式' ? ' ops' : '') + '" data-go="' + i + '">' +
      '<i>' + (i + 1) + '</i>' + s.n + '</button>').join('');
  tabs.addEventListener('click', e => {
    const btn = e.target.closest('.ttab');
    if (btn) dbgGo(+btn.dataset.go, '顶部页签');
  });
}

/* 高亮与当前活屏一致的那个页签（每次换屏时由 dbgGo() 调用） */
function markTab(i) {
  document.querySelectorAll('#tabs .ttab').forEach(b => b.classList.toggle('active', +b.dataset.go === i));
}

/* ============================================================
   六、屏内的就地交互（跳转走「九、跳转调试台」那一套）
   这里是「不换屏、只改本屏」的几处：页签换数据、开关换选项、编辑参数弹窗、
   弹窗开合与 Esc 收起。都挂在 document 上，因为屏只有一个（调试台那块活屏）。
   ============================================================ */

/* 屏幕 03「链路状态」徽标：点击按 LINK_STATES 的顺序循环切换
   （无卫星链路 → 在线 → 离线 → 无卫星链路），便于在设计串口屏时逐态量尺寸。
   就地改文案与配色类、不重建页面，所以滚动位置不会跳；
   换个页面再切回来时由 renderSat() 重新按 linkIdx 渲染，状态不会丢 */
document.addEventListener('click', e => {
  if (!e.target.closest('.state-slot')) return;
  linkIdx = (linkIdx + 1) % LINK_STATES.length;
  const s = LINK_STATES[linkIdx];
  /* class 顺序要与 renderSat() 里保持一致（state-slot 在 v 前，尺子的命名才准确） */
  document.querySelectorAll('.state-slot').forEach(el => {
    el.className = 'state-slot v ' + s.cls;
    el.textContent = s.text;
  });
});

/* 就地重渲染本屏（屏幕 05 SIM 链路详情 / 屏幕 06、07 基站 / 屏幕 09 卫星链路设置共用）：
   只在活屏正显示这一屏时才重建它的内容，数据各用自己那一份
   （屏幕 05 → OPS[opsSel]、屏幕 09 → SAT_SET、屏幕 06、07 → BTS4 / BTS5）。
   换的只是 .screen 内部，弹窗与滚动位置都不动 */
function refreshPage(page, html) {
  if (dbgCur === page) dbgScreen.innerHTML = html();
}

/* 屏幕 05 / 06 / 07 / 09 上那几个「开关」：分段选择器
   （屏幕 05 = 链路开关 / 入网方式 / 鉴权方式 / 锁定开关，
     屏幕 06、07 = 小区状态 + 参数卡片里的工作模式，
     屏幕 09 = 链路开关 / 卫星系统 / 频段）
   点哪一项就切到哪一项，写回哪份数据看 .seg 的 data-t（不传 = 屏幕 05 的 OPS[opsSel]，
   'sat' = 屏幕 09 的 SAT_SET，'bts4' / 'bts5' = 屏幕 06 / 07 的 BTS4 / BTS5），
   写完都就地重渲染本屏 —— 屏幕 05 还连带刷新锁小区卡的 PCID / 频点 / 频段那几行。
   锁定开关没有独立字段，它就是「该制式下有没有锁住的小区」：
   关闭 = 把这组小区的锁都清掉、开启 = 锁上信号最好的那个（列表为空时没得锁，保持关闭）。
   屏幕 06、07 参数卡片里那些「数值 + 铅笔」的卡片本身不是选择器（点了弹输入框），
   所以那种卡片只描了铅笔、没有 data-f */
document.addEventListener('click', e => {
  const opt = e.target.closest('.seg[data-f] > span');
  if (!opt) return;
  const segEl = opt.parentElement;
  const field = segEl.dataset.f;
  const value = opt.dataset.v;

  /* 屏幕 09：卫星链路设置的三排开关，直接写 SAT_SET */
  if (segEl.dataset.t === 'sat') {
    if (field === 'disabled') SAT_SET.disabled = value === '禁用';
    else SAT_SET[field] = value;                     /* system / band */
    refreshPage(SAT_PAGE, satSettingsPage);
    return;
  }

  /* 屏幕 08：状态上报频率，四档选择器（值是 '15s' 这样的档位文案，写回时取整数秒） */
  if (segEl.dataset.t === 'sys') {
    SYS_SET.report = parseInt(value, 10);
    refreshPage(SETTINGS_PAGE, renderSettings);
    return;
  }

  /* 屏幕 06 / 07：左侧「小区状态」开关（激活 / 禁用）改的是顶层字段 status；
     参数卡片里的「工作模式」开关（FDD / TDD）改的是 b.cells 里那一项的值（data-i 指第几项）。
     写回后都重渲染本屏 */
  const bts = BTS_KEYS[segEl.dataset.t];
  if (bts) {
    if (segEl.dataset.i === undefined) bts.d[field] = value;
    else bts.d.cells[+segEl.dataset.i][1] = value;
    refreshPage(bts.page, () => renderBase(bts.d));
    return;
  }

  const op = OPS[opsSel];

  if (field === 'disabled') op.disabled = value === '禁用';
  else if (field === 'net') op.net = value;
  else if (field === 'auth') op.auth = value;
  else {
    const list = field === 'lockLte' ? op.lte : op.nr;
    if (value === '关闭') list.forEach(n => n.lock = false);
    else if (list.length && !list.some(n => n.lock)) list[0].lock = true;
    else return;                       /* 已经开着 / 没有可锁的小区：不重渲染 */
  }
  refreshPage(SIM_PAGE, simPage);
});

/* 点「可编辑项」弹输入框的那些目标（屏幕 06 / 07 的基站设置、屏幕 08 的系统设置）：
   key = .edit-hit 的 data-e，p = data-p，i = data-i（只有参数卡片用得上，指第几项）。
   统一解析成 { name, value, set, page, render } —— 项名、当前值、写回、哪一屏、怎么重渲染，
   打开与确定两处各调一次，于是三种来源（基站标识 / 参数卡片 / 平台地址）共用同一套弹窗逻辑 */
function editTarget(key, p, i) {
  /* 屏幕 08：整屏只有「管理平台地址」一处可编辑项 */
  if (key === 'sys') {
    return {
      name: '管理平台地址', value: SYS_SET.ip,
      set: v => { SYS_SET.ip = v; },
      page: SETTINGS_PAGE, render: renderSettings
    };
  }
  const b = BTS_KEYS[key];
  if (!b) return null;
  const isCell = p === 'cells';                    /* 参数卡片：只改数值、不动单位 */
  return {
    name:  isCell ? b.d.cells[i][0] : b.d.idName,
    value: isCell ? b.d.cells[i][1] : b.d.id,
    set: v => { if (isCell) b.d.cells[i][1] = v; else b.d.id = v; },
    page: b.page, render: () => renderBase(b.d)
  };
}

/* 屏幕 06 / 07 / 08 的「编辑参数」：点设置项弹输入框，确定后写回数据
   ① 打开：点的是 .edit-hit（基站标识那块大字 / 任意一张参数卡片 / 屏幕 08 的平台地址）时，
      把弹窗的项名与输入框按这一项填好 —— 目标存在弹窗自己的 dataset 上，
      所以同一屏只需要一个弹窗实例（editItemModal() 里那份静态骨架）。
   ② 确定：按 editTarget() 解析出的 set() 写回数据，再重渲染那一屏。
      「取消 / ✕ / 点遮罩」由上面的通用遮罩处理直接收起，这里不拦，故不改数据。 */
document.addEventListener('click', e => {
  const hit = e.target.closest('.edit-hit');
  if (hit) {
    const screen = hit.closest('.screen');
    const mask = screen && screen.querySelector('.modal-mask[data-modal="edit"]');
    const t = mask && editTarget(hit.dataset.e, hit.dataset.p, +hit.dataset.i);
    if (!t) return;
    mask.querySelector('.edit-name').textContent = t.name;
    mask.querySelector('.edit-inp').value = t.value;
    mask.dataset.e = hit.dataset.e;
    mask.dataset.p = hit.dataset.p;
    if (hit.dataset.i === undefined) delete mask.dataset.i; else mask.dataset.i = hit.dataset.i;
    mask.classList.add('on');
    mask.querySelector('.edit-inp').focus();
    return;
  }

  const ok = e.target.closest('.modal-mask[data-modal="edit"] .cbtn.ok');
  if (!ok) return;
  const mask = ok.closest('.modal-mask');
  const v = mask.querySelector('.edit-inp').value.trim();
  const t = v && editTarget(mask.dataset.e, mask.dataset.p, +mask.dataset.i);
  if (!t) return;                           /* 数据没了或填了空值：不改 */
  t.set(v);
  refreshPage(t.page, t.render);
});

/* 亮度滑块：拖动时同步已选段填充（--p）与百分比读数 */
document.addEventListener('input', e => {
  if (!e.target.classList.contains('slider')) return;
  const s = e.target;
  s.style.setProperty('--p', s.value + '%');
  s.parentElement.querySelector('.bright-val').textContent = s.value + '%';
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') document.querySelectorAll('.modal-mask.on').forEach(m => m.classList.remove('on'));
});

   鼠标停在屏内任意控件上，就把它的真实尺寸与位置标出来（换算回 854×480 的设计像素，
   不受页面缩放影响），照抄到陶晶驰 USART HMI 的控件属性里即可。
   分段选择器里的每个选项按钮算独立控件，悬浮时标的是按钮自身（比如「自动」46 × 22），

const tip = document.getElementById('rulerTip');
let rulerOn = true;                       /* 默认开启：悬浮即显示坐标与尺寸 */
const clearHl = () => document.querySelectorAll('.ruler-hl').forEach(x => x.classList.remove('ruler-hl'));

/* 组合图标：内部小块没有单独意义，统一标注整体。
   分段选择器 .seg 特意不列在这里 —— 屏上每个选项就是一个独立按钮，
   要能逐个量出按钮自身的尺寸（见「七、尺寸标注」） */
const RULER_GROUPS = '.bars, .meter, .inp, .rollview, svg';

/* 标注对象：优先鼠标下的最小元素（文本 / 状态点 / 图标），否则回溯到最近的语义容器 */
function rulerTarget(el, scr) {
  if (!el || el === scr) return scr;
  if (el.tagName.toLowerCase() === 'svg') return el;   /* 图标本体 */
  const grp = el.closest(RULER_GROUPS);
  if (grp) return grp;                                 /* 组合图标内部 → 回到整体 */
  if (el.children.length === 0) return el;             /* 无子元素的文本 / 小块 → 逐个标注 */
  return el.closest(RULER_SEL) || el;
}

/* 元素命名：优先查名称表，其次 id，再次元素自身文本，最后标签.类名 */
function rulerName(el) {
  if (el.tagName.toLowerCase() === 'svg') return '图标';
  const cls = (el.getAttribute('class') || '').split(' ').filter(Boolean);
  for (let i = 0; i < cls.length; i++) if (RULER_NAMES[cls[i]]) return RULER_NAMES[cls[i]];
  if (el.id) return '#' + el.id;
  const txt = el.children.length === 0 ? el.textContent.trim() : '';
  if (txt) return '“' + (txt.length > 16 ? txt.slice(0, 16) + '…' : txt) + '”';
  return el.tagName.toLowerCase() + (cls[0] ? '.' + cls[0] : '');
}

document.addEventListener('mouseover', e => {
  if (!rulerOn) return;
  const scr = e.target.closest('.screen');
  if (!scr) { clearHl(); tip.hidden = true; return; }

  const t = rulerTarget(e.target, scr);
  clearHl();
  t.classList.add('ruler-hl');

  /* 换算成 854×480 设计稿坐标：缩放系数按屏的实测宽度反推，
     活屏按窗口宽自适应（--ds），这样量出来的始终是设计像素而不是屏幕像素 */
  const sr = scr.getBoundingClientRect(), tr = t.getBoundingClientRect();
  const k = sr.width / 854 || 1;
  const x = Math.round((tr.left - sr.left) / k);
  const y = Math.round((tr.top  - sr.top ) / k);
  const w = Math.round(tr.width  / k);
  const h = Math.round(tr.height / k);
  const font = t.children.length === 0 ? ' · 字号 ' + getComputedStyle(t).fontSize : '';

  tip.innerHTML = '<b>' + rulerName(t) + '</b> · 尺寸 ' + w + ' × ' + h +
                  '<br><span class="pos">位置 x ' + x + ' · y ' + y +
                  ' · 范围 ' + x + '~' + (x + w) + ' , ' + y + '~' + (y + h) + font + '</span>';
  tip.hidden = false;
});

document.addEventListener('mousemove', e => {
  if (tip.hidden) return;
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let x = e.clientX + 14, y = e.clientY + 16;
  if (x + w > window.innerWidth - 8) x = e.clientX - w - 14;
  if (y + h > window.innerHeight - 8) y = e.clientY - h - 16;
  tip.style.left = x + 'px';
  tip.style.top = y + 'px';
});

document.getElementById('toggleRuler').onclick = function () {
  rulerOn = !rulerOn;
  clearHl();
  tip.hidden = true;
  this.textContent = rulerOn ? '隐藏尺寸' : '显示尺寸';
  this.style.background = rulerOn ? 'var(--yellow)' : '';
  this.style.color = rulerOn ? '#11111b' : '';
};

/* ============================================================
   八、跳转调试台：把 9 屏装进一块 854×480 活屏，逐屏走一遍真实跳转
     （顶部页签与右侧「页面清单」都能直达任意一屏，「跳转记录」按顺序记下每一步）
     屏内可点四类目标（跳转关系与设计稿本身一致，不额外编造）：
       页眉模式按钮  工程模式 → 屏幕 01（直连模式）、运维模式 → 屏幕 04（设置入口）；
                      已在聚合 / 卫星传输上时点「工程模式」属于换模式，先弹二级确认
       入口卡 .set-card  屏幕 04 的设置入口 → 5 张 SIM 卡进屏幕 05（先按卡上的 data-sim
                      定好屏幕 05 显示哪条链路）、2 张基站卡进屏幕 06 / 07
       页签栏 .tab   带 data-mode 的是「直连 / 聚合 / 卫星传输」三种工作模式：
                      点了不直接换屏，先弹二级确认（modeConfirm → modeModal），
                      点「确定」才跳、点「取消 / ✕ / 遮罩」停在原模式；带 data-sim 的是
                      「SIM链路」页签：只换屏幕 05 显示的那条链路，
                      已在屏幕 05 上就就地重渲染，从基站页点过来才整屏跳到屏幕 05；
                      带 data-go 的是「基站」页签与页脚按钮，跳到对应页
                      （基站 → 屏幕 06 / 07、屏幕 01 / 02 页脚的「系统设置」→ 屏幕 08）
       页脚功能按钮  有 data-modal 的打开对应弹窗（点遮罩 / 关闭按钮 / 确认按钮收起），
                      有 data-back 的退回来源页（屏幕 08 的「返回 / 确定」）
     右侧「页面清单」可直达任意页，「跳转记录」按发生顺序记下每一步
   ============================================================ */
const dbgScreen = document.getElementById('dbgScreen');
const dbgNow    = document.getElementById('dbgNow');
const dbgList   = document.getElementById('dbgList');
const dbgLogEl  = document.getElementById('dbgLog');
let dbgCur = -1, dbgSeq = 0;
let dbgSettingsFrom = 0;                 /* 活屏里进入系统设置页前的来源页序号，「返回 / 确定」据此退回 */

/* 活屏可直达的页面 = 设计稿的 9 屏（顶部页签与右侧清单共用这份清单） */
const dbgPages = SCREENS.map(s => ({ g: s.g, n: s.n, h: s.h }));

const dbgNo   = i => String(i + 1).padStart(2, '0');
const dbgName = i => dbgNo(i) + ' · ' + dbgPages[i].g + ' · ' + dbgPages[i].n;

/* 记一行：跳转走蓝色，弹窗开合走紫色 */
function dbgLog(text, modal) {
  const ph = dbgLogEl.querySelector('.empty');
  if (ph) ph.remove();
  dbgSeq++;
  const row = document.createElement('div');
  row.className = 'r';
  row.innerHTML = '<span class="n">' + String(dbgSeq).padStart(2, '0') + '</span>' +
                  '<span class="' + (modal ? 'w' : 'a') + '">' + text + '</span>';
  dbgLogEl.appendChild(row);
  dbgLogEl.scrollTop = dbgLogEl.scrollHeight;
}

/* 跳到第 i 屏：整屏重渲染（弹窗随之复位），同步顶部页签、右侧清单与顶部读数 */
function dbgGo(i, why) {
  if (i < 0 || i >= dbgPages.length || i === dbgCur) return;
  const from = dbgCur;
  dbgCur = i;
  dbgScreen.innerHTML = dbgPages[i].h();
  dbgNow.textContent = dbgName(i);
  markTab(i);
  dbgList.querySelectorAll('.dbg-item').forEach(b => b.classList.toggle('on', +b.dataset.go === i));
  dbgLog((from < 0 ? '起' : dbgNo(from)) + ' → ' + dbgNo(i) + '　' + why);
}

dbgList.innerHTML = dbgPages.map((s, i) =>
  '<button class="dbg-item" data-go="' + i + '"><i>' + dbgNo(i) + '</i>' +
  '<span class="g' + (s.g === '运维模式' ? ' ops' : '') + '">' + s.g + '</span>' + s.n + '</button>').join('');

dbgLogEl.innerHTML = '<span class="empty">还没有跳转记录</span>';

/* 模式切换的二级确认：把目标页与目标模式名写进弹窗再打开（提示语就一行
   「确认切换到 xx 模式吗？」，所以只填一个名字；页签「卫星传输」不带「模式」两字，
   这里补上，免得读成「卫星传输模式」的缺字或「直连模式模式」的重字）。
   目标页存在遮罩的 data-go 上，点「确定」时才真跳（见下面的派发）。
   返回 false 表示这一屏没挂那枚弹窗，调用处退回直接跳转 */
function modeConfirm(go, to, why) {
  const mask = dbgScreen.querySelector('.modal-mask[data-modal="mode"]');
  if (!mask) return false;
  mask.dataset.go = go;
  mask.querySelector('.tip-to').textContent = /模式$/.test(to) ? to : to + '模式';
  mask.classList.add('on');
  dbgLog(dbgNo(dbgCur) + '　' + why + '打开弹窗', true);
  return true;
}

/* 活屏内的跳转与弹窗统一在这里派发 */
document.querySelector('.dbg').addEventListener('click', e => {
  const item = e.target.closest('.dbg-item');                  /* 右侧页面清单：直达 */
  if (item) { dbgGo(+item.dataset.go, '页面清单'); return; }

  const mode = e.target.closest('.mode-btn');                  /* 页眉模式按钮：各回各自首屏 */
  if (mode) {
    const t = mode.textContent.trim();
    /* 页眉的「工程模式」落在直连模式（第 01 屏）：已经在聚合 / 卫星传输（第 02 / 03 屏）上时，
       这同样是一次模式切换，也要先确认；本来就在直连模式上则只是回首页，不拦 */
    if (t === '工程模式' && dbgCur > 0 && dbgCur < 3) {
      if (modeConfirm(0, '直连模式', '页眉「工程模式」')) return;
    }
    dbgGo(t === '运维模式' ? 3 : 0, '页眉「' + t + '」');
    return;
  }

  /* 工程模式页签栏「直连 / 聚合 / 卫星传输」：换模式先弹二级确认，点「确定」才真换屏 */
  const mTab = e.target.closest('.tab[data-mode]');
  if (mTab) {
    const go = +mTab.dataset.go;
    if (go === dbgCur) return;                       /* 点的就是当前模式：不确认也不跳 */
    const to = mTab.textContent.trim();
    if (modeConfirm(go, to, '页签「' + to + '」')) return;
    dbgGo(go, '页签「' + to + '」');                 /* 兜底：本屏没挂那枚弹窗就直接跳 */
    return;
  }

  /* 页签栏左半「SIM链路」：4 家运营商是屏幕 05 这一屏的四种取值，换的是数据不是屏 */
  const simTab = e.target.closest('.tab[data-sim]');
  if (simTab) {
    opsSel = +simTab.dataset.sim;
    const why = '页签「' + simTab.textContent.trim() + '」';
    if (dbgCur === SIM_PAGE) {
      /* 已经在屏幕 05 上：就地重渲染，跳转记录只加一条「切换链路」，不当成换页 */
      dbgScreen.innerHTML = simPage();
      dbgLog(dbgNo(SIM_PAGE) + '　' + why + '切换链路');
    } else {
      dbgGo(SIM_PAGE, why);        /* 从屏幕 06 / 07 的基站页点过来：整屏跳到屏幕 05 */
    }
    return;
  }

  const tab = e.target.closest('.tab');                        /* 页签栏右半「基站状态」→ 屏幕 06 / 07 */
  if (tab) { dbgGo(+tab.dataset.go, '页签「' + tab.textContent.trim() + '」'); return; }

  /* 屏幕 04 入口卡 → 二级页（SIM 卡进 05、基站卡进 06 / 07） */
  const setCard = e.target.closest('.set-card[data-go]');
  if (setCard) {
    if (setCard.dataset.sim !== undefined) opsSel = +setCard.dataset.sim;
    dbgGo(+setCard.dataset.go, '入口卡「' + setCard.querySelector('.set-t1').textContent + '」');
    return;
  }

  const fbtn = e.target.closest('.foot-btn[data-modal]');      /* 页脚功能按钮：开合弹窗 */
  if (fbtn) {
    const mask = fbtn.closest('.screen')
      .querySelector('.modal-mask[data-modal="' + fbtn.dataset.modal + '"]');
    if (mask) {
      mask.classList.toggle('on');
      dbgLog(dbgNo(dbgCur) + '　页脚「' + fbtn.textContent.trim() + '」' +
             (mask.classList.contains('on') ? '打开弹窗' : '收起弹窗'), true);
    }
    return;
  }

  const gbtn = e.target.closest('.foot-btn[data-go]');         /* 页脚跳转按钮：进系统设置页 */
  if (gbtn) {
    /* 只有进「系统设置」才记来源页（屏幕 08 的「返回 / 确定」要退回进来之前那一屏）；
       屏幕 05 页脚的「返回」也是 data-go，别让它把来源页顶掉 */
    if (+gbtn.dataset.go === SETTINGS_PAGE) dbgSettingsFrom = Math.max(0, dbgCur);
    dbgGo(+gbtn.dataset.go, '页脚「' + gbtn.textContent.trim() + '」');
    return;
  }

  const bbtn = e.target.closest('[data-back]');                /* 设置页按钮：返回 / 确定 → 退回来源页 */
  if (bbtn) { dbgGo(dbgSettingsFrom, '「' + bbtn.textContent.trim() + '」'); return; }

  /* 模式切换弹窗：点「确定」才真换模式；「取消 / ✕ / 点遮罩」由下面的通用遮罩处理收起，
     停在原模式不动 */
  const mOk = e.target.closest('.modal-mask[data-modal="mode"] .cbtn:not(.cancel)');
  if (mOk) {
    const mask = mOk.closest('.modal-mask');
    const go = +mask.dataset.go;
    mask.classList.remove('on');
    dbgGo(go, '确认切换模式');
    return;
  }

  const mask = e.target.closest('.modal-mask');                /* 弹窗内：收起 */
  if (!mask) return;
  if (e.target.closest('.modal-close') || e.target.closest('.cbtn') || e.target === mask) {
    mask.classList.remove('on');
    dbgLog(dbgNo(dbgCur) + '　弹窗「' + mask.querySelector('.modal-title').textContent + '」关闭', true);
  }
});

document.getElementById('dbgHome').onclick  = () => dbgGo(0, '回首页');
document.getElementById('dbgClear').onclick = () => {
  dbgLogEl.innerHTML = '<span class="empty">还没有跳转记录</span>';
  dbgSeq = 0;
};

/* 活屏缩放：窗口装得下就 1:1，装不下按比例缩（下限 0.45） */
function fitDbg() {
  const fixed = 240 + 18 + 88;      /* 侧栏 + 间距 + 左右内边距 */
  const ds = Math.min(1, Math.max(.45, (document.documentElement.clientWidth - fixed) / 854));
  document.documentElement.style.setProperty('--ds', ds);
}
fitDbg();
window.addEventListener('resize', fitDbg);

/* 启动：铺顶部页签 → 活屏落到第 01 屏 */
buildTabs();
dbgGo(0, '初始加载');
</script>
