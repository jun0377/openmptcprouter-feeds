<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中油测井显控看板 · 854x480 设计稿</title>
<style>
  /* ============================================================
     源码导航 · 屏幕序号速查（共 9 屏，顶部页签逐屏切换）
       屏幕 01  工程模式 · 直连模式（首页默认）
       屏幕 02  工程模式 · 聚合模式
       屏幕 03  工程模式 · 卫星传输（左：卫星示意图 + 链路状态 / 信噪比 / 卫星参数，
                 中：上/下行速率 + 链路时延 + 链路抖动，右：基站状态；底部与 01、02 同款功能页脚）
       屏幕 04  运维模式 · 首页默认 · 设置入口（无页签栏：内容区上「链路设置」6 条链路
                 SIM1~SIM5 + 卫星链路，下「基站设置」4G / 5G 基站，点卡片进二级页）
       屏幕 05  运维模式 · SIM 链路详情（一屏通吃：04 上 5 张 SIM 卡都进这一屏，
                 页内靠页签栏在 SIM1~SIM5 之间就地切换，不再一条链路画一屏）
       屏幕 06  运维模式 · 4G基站（基站设置页：标识与小区状态可改、参数卡片可改）
       屏幕 07  运维模式 · 5G基站（同上，共用一个模板、数据不同）
       屏幕 08  系统设置（独立整屏：无页眉模式切换、无页签栏，
                 内容区两张设置卡左右并排 —— 左「管理平台地址」IP 大字可点着改、
                 右「状态上报频率」四档选择器默认 15s；底部操作区「返回 / 确定」）
       屏幕 09  运维模式 · 卫星链路设置（04 上「卫星链路」卡的落点：精简版只放
                 链路开关 / 卫星系统 / 频段 / 卫星标识 四项可编辑参数，单列竖排、
                 标签与控件各对齐成一列，卡片铺满内容区只让开底部页脚）

     CSS 分段与屏幕的对应（下面每段注释末尾也标了「→ 屏幕 xx」）：
       页面外壳：内容区 …… 全部 9 屏；页眉（.bar-top，整条只有工程 / 运维两个模式按钮）
                     屏幕 01~04（屏幕 05~07、09 是运维模式下的二级页、屏幕 08 整屏独立，
                     都不给模式切换入口）；
                     页签栏（.bar-nav）屏幕 01~03、05~07（屏幕 04 是入口页，不放页签栏）；
                     底部栏：屏幕 01、02、03、05、06、07、08、09 用功能页脚，屏幕 04 整块不要底部
       屏幕 01、02、03 专用：基站状态卡片（.bs-card，底色随在线状态淡绿 / 淡红）+ 功能页脚（.foot-bar / .foot-btn）；
                     屏幕 01、02 另有链路状态列表（.sim-*）
       屏幕 05、06、07、08、09 专用：功能页脚（.foot-bar / .foot-btn）—— 二级设置页共用 editFoot()：
                     两个按钮都靠右下角，左「保存&应用」右「返回」，
                     填充色区分主次：保存蓝实底（.foot-btn.primary）、返回灰实底（.foot-btn.secondary）；
                     05、06、07、09 的「返回」跳回屏幕 04，屏幕 08 的「返回」退回来源页（data-back）
       屏幕 03 专用：指标卡（.m-card / .m-ico / .m-txt / .m-name，横排：图标 + 名称 + 数值，图标与数值同色）
       屏幕 04 专用：设置入口卡（.set-grid / .set-card / .set-l / .set-r / .set-ico / .set-t1 / .set-t2 / .set-go，
                     上「链路设置」3 列 × 2 行、下「基站设置」2 列，整卡即触摸热区；
                     两种卡都是左右分栏 —— 链路卡左「链路图标 + 标识」、右竖排「在线状态 + 运营商」；
                     基站卡左「基站图标 + 基站名」、右竖排三行「在线状态 .bts-state + 物理小区ID / 连接用户数 .set-kv」）
       屏幕 08 专用：设置卡里的设置行（.sys-row 项名 + .sys-ctl 控件，两行等分卡高）
       弹窗（.modal / .modal-mask）…… 屏幕 01、02、03，由页脚按钮与模式页签触发：
                     「版本信息」→ 版本号 / 构建时间 / commit id / 发布说明
                     「屏幕亮度」→ .modal.sm 内一个水平滑块 + 百分比读数
                     「重启设备」→ .modal.confirm 二级确认（取消 / 确认重启）
                     模式页签（直连 / 聚合 / 卫星传输）→ .modal.confirm.mode 二级确认
                     （确定 / 取消 + 一行「确认切换到 xx 模式吗？」提示 .confirm-tip，见 modeModal）
                     …… 屏幕 05、06、07、09 页脚的「保存&应用」复用同一套 .modal.confirm（取消 / 保存并应用）
                     …… 屏幕 06、07 点设置项弹出 .modal.edit（项名 + 输入框 + 确定 / 取消，见 editItemModal）
       通用控件：
         卫星示意图 .sat-fig …… 屏幕 03 左栏（替代原环形仪表）
         大数值 .kpi …… 屏幕 02、03、06、07
         键值列表 .kv …… 屏幕 03 与版本信息弹窗
         信号格 .bars …… 屏幕 01、02
         条形仪表 .meter …… 屏幕 05~07
         分段选择器 .seg …… 屏幕 05~07、09；链路状态徽标 .state-slot …… 屏幕 03（点击循环切换三态）
         在线状态点 .dot / .bs-state、.sim-state（在线 / 拨号中 / 离线 / 未插卡 / 已禁用）…… 屏幕 01、02
         页签里的链路状态点 .tab .sd（同一套五色，卫星那条取 .state-slot 三色）…… 屏幕 05~07 页签栏
       速率面板（.row-panel / .half）…… 屏幕 02
       聚合链路状态条（.agg-bar，五列：首列连接状态 + 4 个 KPI）…… 屏幕 02
       可编辑值框（.inp）…… 屏幕 05、09（两屏的参数设置卡）；
                     行尾那支铅笔（.pen）还单独用在屏幕 06、07 的基站标识与参数卡片上
       屏幕 05（SIM 链路详情，设置页）专用：相邻小区两栏：固定表头 + 手动滚动的文本（.roll-head / .rollview / .empty）
       基站参数字卡片（.cells / .cell）…… 屏幕 06、07
     ============================================================ */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg:     #1e1e2e;
    --scr:    #11111b;
    --panel:  #181825;
    --panel2: #1e1e2e;
    --line:   #313244;
    --line2:  #45475a;
    --txt:    #ffffff;
    --txt2:   #cdd6f4;
    --muted:  #a6adc8;               /* 三级文字亮度整体上提一档，提升小屏可视性 */

    --blue:   #89b4fa;
    --green:  #a6e3a1;
    --yellow: #f9e2af;
    --red:    #f38ba8;
    --peach:  #fab387;
    --mauve:  #cba6f7;
    --teal:   #94e2d5;

    --ds: 1;                         /* 活屏（跳转调试台那块 854×480）的缩放，由 fitDbg() 按窗口宽自适应 */
  }

  body {
    background: var(--bg);
    color: var(--txt);
    min-height: 100vh;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex;
    flex-direction: column;
  }

  /* ======================= 顶部工具栏 ======================= */
  .toolbar {
    position: sticky;
    top: 0;
    z-index: 50;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 18px;
    background: rgba(30, 30, 46, .94);
    border-bottom: 1px solid var(--line);
    flex-wrap: wrap;
  }
  .t-title { font-size: 13px; font-weight: 600; white-space: nowrap; }
  .t-title em { font-style: normal; color: var(--muted); font-weight: 400; }

  .tabs { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; justify-content: center; }
  .ttab {
    font-size: 11px;
    padding: 4px 9px;
    border-radius: 4px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--txt2);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 5px;
    white-space: nowrap;
  }
  .ttab i { font-style: normal; font-family: monospace; font-size: 10px; color: var(--muted); }
  .ttab:hover { border-color: var(--line2); color: var(--txt); }
  .ttab.ops { border-color: #2f4a48; }
  .ttab.active { background: var(--blue); border-color: var(--blue); color: #11111b; font-weight: 600; }
  .ttab.active i { color: #11111b; }

  .tools { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .tools button {
    background: var(--line);
    color: var(--txt);
    border: 1px solid var(--line2);
    border-radius: 4px;
    padding: 3px 10px;
    font-size: 12px;
    cursor: pointer;
  }
  .tools button:hover { background: var(--line2); }

  /* ======================= 屏幕本体：854 x 480 ======================= */
  .screen {
    width: 854px;
    height: 480px;
    background: var(--scr);
    background-image:
      radial-gradient(circle at 18% 0%, rgba(137, 180, 250, .07), transparent 55%),
      radial-gradient(circle at 88% 100%, rgba(148, 226, 213, .05), transparent 55%);
    transform-origin: top left;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ---- 页眉：右上角模式切换，独立占一行 → 屏幕 01~07 ---- */
  .bar-top {
    flex: 0 0 36px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
    padding: 0 12px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
  }
  .mode-btn {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .5px;
    color: var(--txt2);
    background: var(--panel2);
    border: 1px solid var(--line2);
    border-radius: 4px;
    padding: 4px 14px;
  }
  .mode-btn.on        { color: #11111b; background: var(--blue); border-color: var(--blue); }
  .mode-btn.on.ops    { background: var(--teal); border-color: var(--teal); }

  /* ---- 在线状态点 → 屏幕 01（SIM 行）、屏幕 02（链路卡） ---- */
  .dot { display: block; width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 6px rgba(166, 227, 161, .85); }
  .dot.bad { background: var(--red); box-shadow: 0 0 6px rgba(243, 139, 168, .85); }

  /* ---- 页签栏 → 屏幕 01~03、05~07 ---- */
  .bar-nav {
    flex: 0 0 46px;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 12px;
    background: #16161f;
    border-bottom: 1px solid var(--scr);
  }
  .nav-label { font-size: 11px; color: var(--muted); }
  .nav-sep { width: 1px; height: 18px; background: var(--line2); margin: 0 6px; }
  .tab {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    padding: 4px 12px;
    border-radius: 5px;
    border: 1px solid var(--line);
    background: var(--panel2);
    color: var(--txt2);
    white-space: nowrap;
  }
  .tab.on { color: #11111b; background: var(--blue); border-color: var(--blue); font-weight: 600; }
  /* 页签里链路标识前的状态点 → 屏幕 05~07 页签栏
     配色与屏幕 01 / 02 的在线状态点同一套（在线绿 / 拨号中黄 / 离线红 / 未插卡灰 / 已禁用桃）；
     「卫星链路」那一枚取屏幕 03 的三态徽标配色（无卫星链路红 / 在线绿 / 离线黄）。
     这几条写在 .tab.on .sd 前面：选中页签是蓝底，点要反成深色才看得见 */
  .tab .sd { width: 6px; height: 6px; border-radius: 50%; background: var(--green); }
  .tab .sd.off, .tab .sd.st-none { background: var(--red); }
  .tab .sd.dial, .tab .sd.st-off { background: var(--yellow); }
  .tab .sd.nosim { background: var(--line2); }
  .tab .sd.disabled { background: var(--peach); }
  .tab.on .sd { background: #11111b; }

  /* ---- 内容区 → 屏幕 01~09 ---- */
  .body { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; padding: 12px; }
  .row { display: flex; gap: 12px; min-height: 0; }
  .col { display: flex; flex-direction: column; gap: 12px; min-width: 0; }

  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-width: 0;
    min-height: 0;
  }
  .panel-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    font-weight: 600;
    color: #ffffff;
    letter-spacing: .4px;
  }
  .tag { font-size: 10px; color: var(--muted); border: 1px solid var(--line); border-radius: 3px; padding: 1px 6px; }
  .tag.blue  { color: var(--blue);   border-color: rgba(137, 180, 250, .4); }
  .tag.yellow{ color: var(--yellow); border-color: rgba(249, 226, 175, .4); }
  .tag.teal  { color: var(--teal);   border-color: rgba(148, 226, 213, .4); }

  .field { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; }
  .field .k { color: var(--muted); }
  .hr { height: 1px; background: var(--line); }

  /* ---- 设置入口卡 → 屏幕 04（运维模式首页）----
     屏幕 04 只做入口：内容区上下两张面板，各用 .set-grid 铺卡片
     （.links = 3 列 × 2 行放 6 条链路，.bts = 2 列放 2 个基站），
     卡片按 1fr 均分面板剩余高度 —— 串口屏上整卡就是触摸热区，比小按钮好按。
     两种卡都走同一套左右分栏（.set-card.link / .set-card.bts 共用一组排布）：
       链路卡 = 左栏 .set-l 是「链路图标 + 链路标识」，
         右栏 .set-r 竖排两行：上面在线状态、下面运营商
         （在线状态：SIM 用屏幕 01 / 02 那套 .sim-state，卫星用屏幕 03 的三态 .state-slot；
           运营商：.set-t2 + .sim-op + .op-logo，与屏幕 01 / 02 链路列表共用同一份素材；
           卫星没有运营商，右栏只有状态徽标一行）
       基站卡 = 左栏 .set-l 是「基站图标 + 基站名」，
         右栏 .set-r 竖排三行 —— 在线状态 .bts-state、物理小区ID / 连接用户数两行
         （各为 .set-kv「标签 + 等宽数值」，与屏幕 01~03 基站卡 .bs-* 同一套信息层级；
           数值取自 BTS4 / BTS5 的 cardPci / cardUe，4G、5G 图标靠波束弧数区分）
     .set-go 是卡内的右下角箭头，只有挂了 data-go 的卡才渲染，
     详情页还没建的入口不带箭头，避免出现「看着能点、点下去没反应」 */
  .set-grid { flex: 1; min-height: 0; display: grid; gap: 8px; }
  .set-grid.links { grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 1fr); }
  .set-grid.bts   { grid-template-columns: repeat(2, 1fr); }
  .set-card {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    min-width: 0;
    min-height: 0;
    background: var(--panel2);
    border: 1px solid var(--line);
    border-radius: 6px;
  }
  .set-card[data-go] { cursor: pointer; }
  .set-card[data-go]:hover { border-color: var(--blue); }
  /* 左右分栏后，左右两栏各自成组；右栏整体贴卡片右内边距对齐，
     多行的右边缘齐平（右对齐），读起来是一列完整的「状态 + 各指标」 */
  .set-card.link,
  .set-card.bts {
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 0 14px;
  }
  .set-l { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .set-r { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  /* 入口图标按入口类型配色：SIM 卡链路蓝、卫星链路青（与屏幕 03 的示意图同色）、基站紫 */
  .set-ico { display: block; flex: none; width: 18px; height: 18px; }
  .set-ico svg { display: block; width: 100%; height: 100%; }
  .set-ico.sim { color: var(--blue); }
  .set-ico.sat { color: var(--teal); }
  /* 两枚基站图标共用一种紫色：4G / 5G 的区别在图形（波束弧数）上，颜色只标「这是基站」这一层，
     与 SIM 蓝、卫星青一起构成「颜色 = 入口类型、形状 = 同类里的细分」这套规则。
     基站图标比链路图标大得多（18 → 54，三倍）：基站卡左栏只有图标和基站名，放大后波束弧在屏上数得清 */
  .set-ico.bts4,
  .set-ico.bts5 { width: 54px; height: 54px; color: var(--mauve); }
  .set-t1 { font-family: monospace; font-size: 17px; font-weight: 700; color: var(--txt); letter-spacing: .5px; }
  .set-t2 { font-size: 11px; color: var(--muted); }
  /* 基站卡的在线 / 离线：语义与屏幕 01 的 .sim-state 相同，只是名字换成基站的，
     默认离线（红）、在线（绿 + 呼吸辉光），尺寸对齐链路卡那一行，04 上两种卡的状态行等高 */
  .bts-state { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--muted); }
  .bts-state .dot { width: 6px; height: 6px; background: var(--red); box-shadow: none; }
  .bts-state.on  { color: var(--green); }
  .bts-state.on .dot { background: var(--green); box-shadow: 0 0 6px rgba(166, 227, 161, .85); }
  .bts-state.off { color: var(--red); }
  /* 基站卡右栏的物理小区ID / 连接用户数：标签 muted 小字 + 等宽数值，
     整行贴右边缘，与上面的在线状态右对齐成一列 */
  .set-kv { display: flex; align-items: baseline; gap: 5px; }
  .set-kv .k { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .set-kv .v { font-family: monospace; font-size: 12px; font-weight: 700; color: var(--txt2); }
  /* 卫星链路卡的状态徽标：配色直接套屏幕 03「链路状态」的三态（.state-slot.st-*），
     只有内边距要另给 —— 屏幕 03 那份内边距写在 .kv .v.state-slot 上，卡片里的徽标不在 .kv 内。
     徽标沿用同一个 class，所以它和屏幕 03 那枚归同一个点击循环管（点哪一枚都是三态一起切），
     卡片上的状态与屏幕 03 始终一致，也方便在设计串口屏时把三态宽度都量出来 */
  .set-card .state-slot {
    display: inline-block; padding: 1px 8px; border-radius: 5px;
    font-size: 11px; font-weight: 600; color: #11111b;
  }
  .set-go { position: absolute; right: 9px; bottom: 8px; width: 13px; height: 13px; color: var(--line2); }
  .set-go svg { display: block; width: 100%; height: 100%; }
  .set-card[data-go]:hover .set-go { color: var(--blue); }

  /* ---- 卫星示意图 → 屏幕 03 左栏（替代原环形仪表） ----
     用的是 Tabler Icons 的 satellite（outline）图形本身，纯描边无填充，
     描边走 currentColor，颜色由本类的 color（teal）决定；
     用 flex:1 吃掉左栏剩余高度，svg 靠 preserveAspectRatio 等比缩放，不会撑破面板 */
  .sat-fig { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; color: var(--teal); }
  .sat-fig svg { display: block; width: 100%; height: 100%; }

  /* 左栏纵向预算：本栏要挤下 8 个块（面板标题 / 示意图 / 链路状态 / 信噪比 + 5 条卫星参数），
     而栏高只有 338px。为了让示意图拿到足够高度，这里把面板 gap 与键值行内边距各收紧一档；
     用 .sat-panel 限定，不影响屏幕 01、02 以及版本信息弹窗里共用的 .kv */
  .sat-panel { gap: 6px; padding: 8px 12px; }
  .sat-panel .kv { padding: 3px 0; }

  /* ---- 信号格 → 屏幕 01、02、05 ---- */
  .bars { display: flex; align-items: flex-end; gap: 2px; height: 22px; position: relative; }
  .bars i { display: block; width: 5px; border-radius: 1px; background: var(--line); }
  .bars i:nth-child(1) { height: 6px; }
  .bars i:nth-child(2) { height: 9px; }
  .bars i:nth-child(3) { height: 12px; }
  .bars i:nth-child(4) { height: 15px; }
  .bars i:nth-child(5) { height: 18px; }
  .bars i.on { background: var(--green); }
  .bars.warn i.on { background: var(--yellow); }
  .bars.bad  i.on { background: var(--red); }
  /* 无信号（0 格）：灰格表示强度归零，左上角再叠一个红色 ✕ 表示链路不可用 */
  .bars .bars-x { position: absolute; left: -2px; top: 6px; width: 9px; height: 9px; color: var(--red); }

  /* ---- 大数值 → 屏幕 02、03、06、07 ---- */
  .kpi { display: flex; align-items: baseline; gap: 6px; }
  .kpi .num { font-family: monospace; font-size: 36px; font-weight: 700; line-height: 1.05; color: var(--green); }
  .kpi .u { font-size: 11px; color: var(--muted); }
  .kpi .of { font-size: 18px; color: var(--muted); }

  /* ---- 指标卡（图标 + 名称 + 数值） → 屏幕 03 中栏四张指标卡 ----
     卡片走横排：左侧一枚圆形图标当徽章，右侧名称与数值上下两行。
     图标是内联 SVG（全局 ico()，24×24 viewBox），描边走 currentColor，颜色由卡上的行内 accent 色决定
     （与该卡数值同色），名称单独锁白，不跟着 accent 染色；四张卡图标同尺寸同线宽，保持成组观感。
     本屏底部是功能页脚（与屏幕 01、02 等高），栏高约 338px，四张卡均分后每张约 75px；
     卡片纵向内边距收到 7px，让「名称 + 数值」两行正好落在卡内；
     图标放大到 30px 仍低于右侧两行文字的高度，不会把卡片撑高，也不需要压缩 36px 的大数值字号 */
  .m-card { flex-direction: row; align-items: center; gap: 10px; padding: 7px 12px; }
  .m-ico { flex: none; width: 30px; height: 30px; display: block; }
  .m-ico svg { display: block; width: 100%; height: 100%; }
  .m-txt { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .m-name { font-size: 12px; font-weight: 600; color: var(--txt); letter-spacing: .4px; }

  /* ---- 键值列表 → 屏幕 03 ---- */
  .kv { display: flex; align-items: center; justify-content: space-between; font-size: 12px; padding: 5px 0; border-bottom: 1px dashed rgba(69, 71, 90, .45); }
  .kv:last-child { border-bottom: none; }
  .kv .k { color: var(--muted); }
  .kv .v { font-family: monospace; color: var(--txt); }

  /* ---- 链路状态徽标 → 屏幕 03「链路状态」行的值域 ----
     同一时刻只显示一种状态（无卫星链路 / 在线 / 离线），不用分段选择器：
     徽标底色即该状态的语义色（无卫星链路红 / 在线绿 / 离线黄），
     文字统一改用深色 #11111b（与 .seg 选中态同一做法）压住亮底。
     不设 width、不设 line-height：底色紧贴文字（左右各 6px 内边距），
     高度沿用 .kv 原本的行盒，因此这一行的高度与改造前完全一致，左栏示意图不会被挤小；
     代价是徽标宽度随文案变化 —— 正好可用尺子分别量出三种状态的真实控件宽度。
     点击徽标循环切换三种状态（含默认态），见末尾「链路状态切换」。
     选择器带上 .kv .v 前缀是为了压过上面的 .kv .v 文字色（同为类选择器时后者优先） */
  .kv .v.state-slot { display: inline-block; padding: 0 6px; border-radius: 5px; font-weight: 600; color: #11111b; cursor: pointer; user-select: none; }
  .state-slot.st-none { background: var(--red); }
  .state-slot.st-on   { background: var(--green); }
  .state-slot.st-off  { background: var(--yellow); }

  /* ---- 分段选择器 → 屏幕 05~07。屏幕 05 上这几排是能点的开关（.seg 上带 data-f），
     所以给个手型；屏幕 06、07 的只是标尺，不可点，保持默认指针 */
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 5px; overflow: hidden; }
  .seg > span { font-size: 11px; line-height: 20px; padding: 0 12px; color: var(--muted); background: var(--panel2); }
  .seg > span.on { color: #11111b; background: var(--green); font-weight: 600; }
  .seg > span.on.bad { background: var(--red); }
  .seg[data-f] > span { cursor: pointer; }

  /* ---- 可编辑值框 → 屏幕 05「SIM 参数设置」卡的三行 ----
     屏上是「文本控件 + 点击弹键盘」，设计稿画成一张小值框：等宽的值 + 行尾一支铅笔；
     值框自带底色与描边（.field 是两端对齐，所以它整块贴右边缘）。
     行高比旁边的分段选择器矮一档（16px + 上下 1px 描边 = 18px，选择器是 22px）：
     卡片所在行的高度是定死的（屏幕 05 上下两行要平分内容区），
     「标题 + 3 个选择器 + 3 个值框」正好落在卡内，六行都不会顶到卡片下边框 */
  .inp { display: inline-flex; align-items: center; gap: 6px; padding: 0 7px;
         background: var(--panel2); border: 1px solid var(--line2); border-radius: 5px; }
  .inp .v { font-family: monospace; font-size: 12px; line-height: 16px; color: var(--txt); }

  /* 铅笔 = 「这一项能改」的提示图标 —— 屏幕 05 / 09 的可编辑值框行尾一支，
     屏幕 06 / 07 的基站标识与每个参数小卡片（.cell）上也各点一支，同一枚图标同一套配色 */
  .inp .pen, .cell .pen, .big-id .pen { flex: none; width: 11px; height: 11px; color: var(--muted); }
  .inp .pen svg, .cell .pen svg, .big-id .pen svg { display: block; width: 100%; height: 100%; }
  .big-id .pen { width: 13px; height: 13px; }   /* 标识字大一号（24px），笔跟着大一档 */

  /* ---- 条形仪表 → 屏幕 05~07 ---- */
  .meter { display: block; width: 100%; height: 7px; border-radius: 4px; background: var(--line); overflow: hidden; }
  .meter i { display: block; height: 100%; border-radius: 4px; }

  /* ---- 相邻小区两栏（固定表头 + 手动滚动的文本） → 屏幕 05 下半屏 ----
     屏上每一栏就是一个滑动文本控件：表头固定，下面是同一段等宽文字，手指拖动才滚
     （下半屏并排两块，左边 LTE、右边 NR-5G）。
     设计稿照抄这个结构 —— 表头与每一行都是同一套等宽网格（cellLine 补空格对齐），
     字号行高也一致，两行必定对得上；.rollview 是滚动视窗，行数多于一屏时
     出滚动条（设计稿上就是滚轮 / 触摸拖动），不自动滚，所以内容只有一份、没有动画。
     滚动条特意画细（4px），与屏上滑动文本控件那条窄滚动条一个观感 */
  .roll-head { margin: 0; font-family: monospace; font-size: 12px; line-height: 17px; color: var(--txt2);
               padding-bottom: 4px; border-bottom: 1px solid var(--line); white-space: pre; }
  .rollview { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: thin;
              scrollbar-color: var(--line2) transparent; }
  .rollview pre { margin: 0; font-family: monospace; font-size: 12px; line-height: 17px; color: var(--txt2); white-space: pre; }
  .rollview::-webkit-scrollbar { width: 4px; }
  .rollview::-webkit-scrollbar-track { background: transparent; }
  .rollview::-webkit-scrollbar-thumb { background: var(--line2); border-radius: 2px; }

  .empty { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--muted); }

  /* ---- 速率面板 + 聚合总览（.row-panel / .half） → 屏幕 02 ---- */
  .row-panel { flex-direction: row; align-items: center; gap: 0; }
  .half { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 6px; padding: 0 12px; border-left: 1px solid var(--line); }
  .half:first-child { border-left: none; padding-left: 0; }
  .half > .k { font-size: 11px; color: var(--muted); }

  /* ---- 聚合链路状态条（连接状态 / 实时上下行速率 / 时延 / 链路数） → 屏幕 02 ----
     五列同构：上 = .k 标签，下 = 值行；
     首列值行 = 聚合连接状态正文（在线 / 离线），与其余四列数值同样靠左起排，用状态色 */
  .agg-bar {
    background-image: linear-gradient(90deg, rgba(137, 180, 250, .12), rgba(148, 226, 213, .05) 58%, transparent);
  }
  .agg-bar .kpi .num { font-size: 30px; }
  .agg-bar .agg-state {
    justify-content: flex-start;         /* 状态正文靠左，与四列数值同一起点 */
    align-items: flex-end;               /* 贴值行底边 */
    min-height: 31.5px;                  /* = .num 30px × 1.05，令五列标题落在同一行 */
  }
  .agg-bar .agg-state .st { font-size: 24px; line-height: 1; }
  .agg-bar .agg-state .st.on  { color: var(--green); }
  .agg-bar .agg-state .st.off { color: var(--red); }

  /* ---- 基站参数字卡片 → 屏幕 06、07 ---- */
  .big-id { display: flex; align-items: center; gap: 8px;
            font-family: monospace; font-size: 24px; font-weight: 700; color: var(--blue); letter-spacing: 1px; }
  .cells { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .cell {
    background: var(--panel2);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 6px 10px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 3px;
    min-height: 0;
  }
  .cell .k { font-size: 11px; color: var(--muted); }
  /* 值这一行排成横向 flex：等宽数值 +（单位 <small>）+ 行尾一支铅笔 —— 屏幕 06、07 的
     每个参数都是可设置项，铅笔跟可编辑值框用的是同一枚图标 */
  .cell .v { display: flex; align-items: center;
             font-family: monospace; font-size: 19px; font-weight: 700; color: var(--txt); }
  .cell .v .pen { margin-left: 6px; }
  .cell .v small { font-size: 11px; font-weight: 400; color: var(--muted); margin-left: 4px; }
  /* 卡片里的选择器（屏幕 06、07 的「工作模式」FDD / TDD）：
     卡片是竖排 flex，.seg 作为它的子项会被拉满整格宽；而 .seg 里的按钮是按文字宽度排的，
     两个按钮只占左侧一小段，右边那截空在 .seg 的边框里 —— 看着就像多了一个空白按钮。
     故让按钮等分整格宽度（文字居中），整行都是可按的按钮，既没有空档也好点 */
  .cell .seg > span { flex: 1; text-align: center; }
  /* 卡内 / 卡头小字：屏幕 06、07 用来写容量说明，屏幕 05 锁小区卡用来写锁定后的行为
     （放在卡头右侧，标题是加粗的，这里压回常规字重） */
  .cell-hint { font-size: 11px; font-weight: 400; color: var(--muted); }

  /* ---- 链路状态列表 → 屏幕 01（直连 · SIM4/SIM5 两条）、屏幕 02（聚合 · 5 条） ---- */
  .sim-head, .sim-row {
    display: grid;
    grid-template-columns: 56px 72px 58px 100px 1fr 50px;
    gap: 8px;
    align-items: center;
  }
  .sim-head { font-size: 11px; color: var(--txt2); padding-bottom: 5px; border-bottom: 1px solid var(--line); }
  /* 表头与值行同用一套栅格，故纵向天然对齐；「信号强度」「实时带宽」两列的内容
     都是由多个元素拼成的组合（信号格 + 信号值、↑ + ↓），故标题居中于该列，
     下方内容整体居中，标题正落在组合内容的正中 */
  .sim-head > span:nth-child(4),
  .sim-head > span:nth-child(5) { text-align: center; }
  .sim-head > span:last-child { text-align: right; }
  .sim-list { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .sim-row { flex: 1; font-size: 12px; border-bottom: 1px solid rgba(49, 50, 68, .55); }
  .sim-row:last-child { border-bottom: none; }
  /* 直连模式（屏幕 01）只有 SIM4 / SIM5 两条链路，行不做撑高：
     行高与聚合模式（屏幕 02 的 5 行均分结果，31px）保持一致，余下空间留空 */
  .panel:not(.sim-agg) .sim-row { flex: none; height: 31px; }
  .sim-name { font-family: monospace; font-size: 13px; font-weight: 700; color: var(--txt); }
  /* 运营商列 = 官方 logo + 运营商名称
     图形一律放进 14×14 的方框内等比缩放（contain）：中国移动 / 中国电信的图形接近正方形、
     中国联通的「中国结」本身更扁宽（约 4:3），若统一按高 14px 放会把联通的图标撑得比另两家
     大一圈、名称也被推后 5px。改用统一的方框后，三家图形的视觉份量与名称的起始位置都对齐了 */
  .sim-op { display: flex; align-items: center; gap: 5px; color: var(--txt2); }
  .sim-op .op-logo { display: block; flex: none; width: 14px; height: 14px; object-fit: contain; }
  /* 在线状态五种：在线（绿）/ 拨号中（黄，链路正在建立）/ 离线（红）/ 未插卡（灰，卡槽为空）/
     已禁用（橙，链路被停用，非故障，不加呼吸辉光） */
  .sim-state { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--muted); }
  .sim-state .dot { width: 6px; height: 6px; background: var(--red); box-shadow: none; }   /* 离线：红点 */
  .sim-state.on { color: var(--green); }
  .sim-state.on .dot { background: var(--green); box-shadow: 0 0 6px rgba(166, 227, 161, .85); }
  .sim-state.dial { color: var(--yellow); }
  .sim-state.dial .dot { background: var(--yellow); box-shadow: 0 0 6px rgba(249, 226, 175, .85); }
  .sim-state.nosim .dot { background: var(--line2); }
  .sim-state.disabled { color: var(--peach); }
  .sim-state.disabled .dot { background: var(--peach); }
  .sim-sig { display: flex; justify-content: center; align-items: center; gap: 7px; }
  .sim-dbm { font-family: monospace; font-size: 11px; color: var(--txt2); }
  .sim-rate { display: flex; justify-content: center; gap: 10px; font-family: monospace; font-size: 12px; font-weight: 600; }
  /* 方向箭头恒为彩色（↑ blue / ↓ yellow），只有数值在无流量时转灰（.idle）：
     箭头与流量无关，做成静态素材即可 —— 串口屏上「上行箭头 / 下行箭头」各一张图，
     不必再为「有流量 / 无流量」各出一张 */
  .sim-rate .up   { color: var(--blue); }
  .sim-rate .down { color: var(--yellow); }
  .sim-rate .idle { color: var(--line2); }
  .sim-rate .arw  { font-style: normal; }
  .sim-ping { font-family: monospace; font-size: 12px; color: var(--mauve); text-align: right; }
  .sim-ping.idle { color: var(--line2); }

  /* 屏幕 02 专属：数值位宽固定 —— 「实时带宽 / 时延」的单位已提到表头（/Mbps、/ms），
     数值列只留数字，小数点与个位在 5 行之间落在同一条竖线上，不再随位数左右跳动。
     位宽固定后带宽列偏宽（屏幕 01 的实时带宽同样走 6ch 定宽，见 simPanel()），
     故把横向空间重新分配：链路 / 运营商 / 在线状态 / 信号强度四列放宽，
     带宽列收窄到刚好容下 ↑/↓ 两个数值 */
  .sim-agg .sim-head, .sim-agg .sim-row {
    grid-template-columns: 48px 72px 60px 94px 1fr 50px;
    gap: 8px;
  }
  /* 前导空格 + 右对齐，位宽不足处留白；单位已一律提到表头，故右侧不再留后缀间隙 */
  .fix-fw { display: inline-block; font-style: normal; text-align: right; }
  .fix-fw.f3 { min-width: 3ch; }
  .fix-fw.f4 { min-width: 4ch; }
  .fix-fw.f6 { min-width: 6ch; }

  /* ---- 基站状态卡片（上下两张） → 屏幕 01、02、03 ---- */
  .bs-card {
    flex: 1;
    min-height: 0;
    background: var(--panel2);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 8px 10px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 10px;
  }
  /* 卡片底色随基站在线状态整体切换：在线淡绿、离线淡红，边框同步偏色 */
  .bs-card.on  { background: rgba(166, 227, 161, .10); border-color: rgba(166, 227, 161, .40); }
  .bs-card.off { background: rgba(243, 139, 168, .10); border-color: rgba(243, 139, 168, .40); }
  .bs-head { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .bs-name { font-size: 13px; font-weight: 700; color: var(--txt); }
  .bs-meta { display: flex; align-items: baseline; gap: 16px; }
  .bs-meta > .bs-kv { flex: 1; min-width: 0; }
  .bs-kv { display: flex; align-items: baseline; justify-content: space-between; gap: 4px; }
  /* 标签不许折行：单个指标列只有 101px，「物理小区ID」在 5G 卡（4 位数字值）会差几个像素
     被挤成两行；这里锁死单行，并靠缩小与数值之间的最小间距腾出余量。
     数值是右对齐的定宽占位，多余空间仍会由 space-between 补到标签与数值之间，视觉间距不变 */
  .bs-kv .k { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .bs-id  { font-family: monospace; font-size: 18px; font-weight: 700; color: var(--blue);  letter-spacing: .5px; }
  .bs-num { font-family: monospace; font-size: 18px; font-weight: 700; color: var(--green); }
  /* 基站卡的在线 / 离线：比链路行里的状态字略放大一档，卡片里的状态更好认
     （只覆盖 .bs-state 内的圆点，链路行的 .sim-state .dot 不受影响） */
  .bs-state { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
  .bs-state .dot { width: 9px; height: 9px; }
  .bs-state.on  { color: var(--green); }
  .bs-state.off { color: var(--red); }

  /* ---- 底部提示栏 → 屏幕 04~07 ---- */
  .bar-bot {
    flex: 0 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 12px;
    background: var(--panel);
    border-top: 1px solid var(--line);
    font-size: 11px;
    color: var(--muted);
  }

  /* ---- 系统设置的设置行 → 屏幕 08（系统设置） ----
     两项设置合并在一张卡里，一行一项、行间一条分隔线（.hr）：
     行内左边是项名（固定 96px，两行左对齐）、右边是控件（.sys-ctl，贴左排）。
     两行等分卡片剩余高度（flex:1），所以卡片铺满内容区、每项在行内竖直居中 ——
     本屏只有两项设置，若按内容高度排会缩成窄窄一条，留白全堆在卡片下方 */
  .sys-row {
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 0 4px;
  }
  .sys-row .k { flex: none; width: 96px; font-size: 13px; color: var(--muted); }
  .sys-ctl { flex: 1; min-width: 0; display: flex; align-items: center; }
  .sys-ctl .seg > span { min-width: 52px; text-align: center; }   /* 四档按钮等宽，档位文字居中 */

  /* ---- 底部功能页脚（左 2 + 右 2 图标按钮，替代底栏） → 屏幕 01、02 ---- */
  .foot-bar {
    flex: 0 0 36px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 12px;
    background: var(--panel);
    border-top: 1px solid var(--line);
  }
  .foot-group { display: flex; align-items: center; gap: 8px; }
  .foot-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    height: 26px;
    padding: 0 12px;
    border: 1px solid var(--line2);
    border-radius: 5px;
    background: var(--panel2);
    color: var(--muted);                 /* 与 pics/button 下按钮素材的文字色一致，不随正文提亮 */
    font-size: 12px;
    cursor: pointer;                     /* 「版本信息」可点击弹出弹窗 */
  }
  .foot-btn svg { width: 14px; height: 14px; flex: none; }
  .foot-btn.danger { color: var(--red); border-color: rgba(243, 139, 168, .45); }
  /* 屏幕 05 页脚那对按钮用填充色区分主次：主操作（保存&应用）蓝实底、
     次操作（返回）中性灰实底 —— 与屏幕 08「确定 / 返回」那对同一套配色，
     实底按钮在串口屏上直接导出成整块按钮素材即可 */
  .foot-btn.primary   { background: var(--blue); border-color: var(--blue); color: #11111b; font-weight: 600; }
  .foot-btn.secondary { background: var(--line); color: var(--txt2); }

  /* ---- 弹窗（.modal / .modal-mask） → 屏幕 01、02 ---- */
  /*      版本信息：点击页脚「版本信息」弹出（宽度 410）
          屏幕亮度：点击页脚「屏幕亮度」弹出（.modal.sm 宽度 300，内含水平滑块）
          重启确认：点击页脚「重启设备」弹出（.modal.confirm 宽度 340，二级确认）
          模式切换：点页签栏「直连 / 聚合 / 卫星传输」弹出（.modal.confirm.mode 宽度 372，二级确认）
          编辑参数：屏幕 06、07 点设置项弹出（.modal.edit 宽度 360，项名 + 输入框 + 确定 / 取消） */
  .modal-mask {
    position: absolute;
    inset: 0;
    z-index: 20;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(17, 17, 27, .68);
  }
  .modal-mask.on { display: flex; }
  .modal {
    width: 410px;
    background: var(--panel);
    border: 1px solid var(--line2);
    border-radius: 10px;
    box-shadow: 0 18px 46px rgba(0, 0, 0, .6);
    overflow: hidden;
  }
  .modal-head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 12px;
    background: var(--panel2);
    border-bottom: 1px solid var(--line);
  }
  .modal-head svg { width: 14px; height: 14px; flex: none; color: var(--blue); }
  .modal-title { font-size: 13px; font-weight: 600; color: var(--txt); letter-spacing: .4px; }
  .modal-close {
    margin-left: auto;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 18px;
    height: 18px;
    border-radius: 4px;
    background: rgba(243, 139, 168, .22);          /* 半透明红底：把「关闭」从常规控件里区分出来 */
    color: var(--red);
    cursor: pointer;
  }
  .modal-close:hover { background: rgba(243, 139, 168, .38); }
  .modal-close svg { width: 12px; height: 12px; color: currentColor; }
  .modal-body { padding: 6px 12px 12px; display: flex; flex-direction: column; }
  .ver-list { display: flex; flex-direction: column; }
  .ver-notes { margin-top: 6px; padding-top: 8px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 5px; }
  .ver-notes > .k { font-size: 11px; color: var(--muted); }
  /* 发布说明由上位机按运行版本下发，屏上是一个文本控件，故设计稿里不排真实条目：
     只画一个与原来四条说明等高的空文本框，边框标出文本控件的落位与大小，内部留空 */
  .ver-box { height: 72px; border: 1px solid var(--line2); border-radius: 5px; }

  /* 屏幕亮度弹窗：一个水平滑块 + 百分比读数 → 屏幕 01、02 */
  .modal.sm { width: 300px; }
  .bright-body { display: flex; align-items: center; gap: 10px; padding: 15px 12px 16px; }
  .slider {
    -webkit-appearance: none;
    appearance: none;
    flex: 1;
    height: 14px;
    background: transparent;
    cursor: pointer;
  }
  /* 轨道：已选段（--p 由拖动时的 JS 同步）用蓝色填充，未选段为分隔线色 */
  .slider::-webkit-slider-runnable-track {
    height: 4px;
    border-radius: 2px;
    background: linear-gradient(90deg, var(--blue) 0 var(--p), var(--line) var(--p) 100%);
  }
  .slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 12px;
    height: 12px;
    margin-top: -4px;                       /* (4 - 12) / 2：把滑块压回轨道中线 */
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 0 2px var(--blue), 0 1px 3px rgba(0, 0, 0, .55);
  }
  .slider::-moz-range-track { height: 4px; border-radius: 2px; background: var(--line); }
  .slider::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--blue); }
  .slider::-moz-range-thumb {
    width: 12px;
    height: 12px;
    border: 0;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 0 2px var(--blue), 0 1px 3px rgba(0, 0, 0, .55);
  }
  .bright-val { flex: none; width: 36px; text-align: right; font-size: 13px; color: var(--txt); }

  /* 二级确认弹窗 → 屏幕 01、02 的「重启设备」与屏幕 05 的「保存&应用」
     只有一行按钮，无提示文案；左「确认」右「取消」，两个按钮在弹窗内水平居中，
     「取消」比确认按钮略大，提供一个更顺手的退出位 */
  .modal.confirm { width: 340px; }
  .modal.confirm .modal-head svg { color: var(--red); }      /* 危险操作：标题栏图标走红 */
  .modal.confirm.save .modal-head svg { color: var(--green); }  /* 保存并应用不表危险：图标走绿 */
  /* 模式切换二级确认 → 屏幕 01、02、03 页签栏的「直连 / 聚合 / 卫星传输」：
     换模式要重建数据链路并重新拨号，当前连接会短暂中断，先让用户确认一次。
     提示语只有一行「确认切换到 xx 模式吗？」，xx 在点开时填，见 modeConfirm()；
     一行两个按钮「确定 / 取消」大小一致，靠填充色分主次 ——
     确定黄实底（.cbtn.warn）、取消灰实底（.cbtn.cancel，与页脚的 .foot-btn.secondary 同色） */
  .modal.confirm.mode { width: 340px; }
  .modal.confirm.mode .modal-head svg { color: var(--yellow); }
  .confirm-tip { padding: 8px 14px 0; text-align: center; font-size: 13px; line-height: 19px; color: var(--txt2); }
  .confirm-tip b { color: var(--txt); font-weight: 600; }
  .modal.confirm.mode .cbtn { height: 32px; padding: 0 30px; font-size: 13px; }   /* 两个按钮同尺寸 */
  .cbtn.warn { background: var(--yellow); border-color: var(--yellow); color: #11111b; font-weight: 600; }
  .cbtn.warn:hover { background: #f3d68e; border-color: #f3d68e; color: #11111b; }
  .modal.confirm.mode .cbtn.cancel { background: var(--line); border-color: var(--line); color: var(--txt2); }
  .modal.confirm.mode .cbtn.cancel:hover { background: var(--line2); border-color: var(--line2); color: var(--txt); }
  .confirm-foot { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 16px 12px 14px; }
  .cbtn {
    display: flex;
    align-items: center;
    height: 26px;
    padding: 0 14px;
    border: 1px solid var(--line2);
    border-radius: 5px;
    background: var(--panel2);
    color: var(--txt2);
    font-size: 12px;
    cursor: pointer;
  }
  .cbtn:hover { border-color: var(--muted); color: var(--txt); }
  .cbtn.cancel { height: 32px; padding: 0 30px; font-size: 13px; }   /* 比「确认重启」宽高都大一档 */
  .cbtn.danger { border-color: rgba(243, 139, 168, .5); background: rgba(243, 139, 168, .16); color: var(--red); font-weight: 600; }
  .cbtn.danger:hover { background: rgba(243, 139, 168, .28); }

  /* 编辑参数弹窗 → 屏幕 06、07（点设置项弹出）：项名 + 一个输入框 + 确定 / 取消
     输入框按等宽字体排，宽度撑满弹窗，跟串口屏上文本输入控件的落位一致 */
  .modal.edit { width: 360px; }
  .modal.edit .modal-head svg { color: var(--mauve); }       /* 编辑用紫色铅笔，与卡片上的笔呼应 */
  .edit-name { font-size: 11px; color: var(--muted); margin-bottom: 5px; }
  .edit-inp {
    height: 30px;
    padding: 0 9px;
    font-family: monospace;
    font-size: 13px;
    color: var(--txt);
    background: var(--panel2);
    border: 1px solid var(--line2);
    border-radius: 5px;
  }
  .edit-inp:focus { outline: none; border-color: var(--blue); }
  .cbtn.ok { border-color: rgba(137, 180, 250, .5); background: rgba(137, 180, 250, .16); color: var(--blue); font-weight: 600; }
  .cbtn.ok:hover { background: rgba(137, 180, 250, .3); }

  /* 点了会弹编辑弹窗的设置项（屏幕 06、07 的基站标识，以及「数值 + 铅笔」的参数卡片） */
  .edit-hit { cursor: pointer; }
  .edit-hit:hover { border-color: var(--line2); }

  /* ---- 文本 / 颜色工具类 → 全部 9 屏通用 ---- */
  .mono { font-family: monospace; }
  .muted { color: var(--muted); }
  .good { color: var(--green); }
  .warn { color: var(--yellow); }
  .bad  { color: var(--red); }
  .up   { color: var(--blue); }
  .down { color: var(--yellow); }

  /* ======================= 尺寸标注（悬停查看） ======================= */
  .ruler-hl { outline: 1px dashed var(--yellow) !important; outline-offset: -1px; }
  .ruler-tip {
    position: fixed;
    z-index: 999;
    font-family: monospace;
    font-size: 11px;
    line-height: 15px;
    color: #11111b;
    background: var(--yellow);
    border-radius: 4px;
    padding: 4px 8px;
    white-space: nowrap;
    pointer-events: none;
    box-shadow: 0 3px 10px rgba(0, 0, 0, .45);
  }
  .ruler-tip b { font-weight: 700; }
  .ruler-tip .pos { opacity: .75; }
  .ruler-tip[hidden] { display: none; }

  /* ======================= 跳转调试台（评审用外壳，不属于设计稿内容） =======================
     页面主干就这一块：一块 854×480 的活屏 + 右侧「页面清单 / 跳转记录」；
     活屏里复用 .screen 本体，因此样式、弹窗、尺寸标注悬停与设计稿完全一致 */
  .dbg { flex: 1; display: flex; flex-direction: column; padding: 16px 0 22px;
         background: rgba(24, 24, 37, .5); }
  .dbg-head { display: flex; align-items: center; gap: 9px; padding: 0 44px 13px; flex-wrap: wrap; }
  .dbg-title { font-size: 13px; font-weight: 600; color: var(--txt); }
  .dbg-badge { font-size: 10px; font-weight: 600; color: #11111b; background: var(--yellow); border-radius: 3px; padding: 1px 6px; }
  .dbg-now { font-family: monospace; font-size: 12px; color: var(--blue); }
  .dbg-tip { margin-left: auto; font-size: 11px; color: var(--muted); }

  .dbg-body { flex: 1; display: flex; align-items: center; justify-content: center; gap: 18px; padding: 0 44px; }
  .dbg-stage {
    flex: 0 0 auto;
    width: calc(854px * var(--ds));
    height: calc(480px * var(--ds));
    overflow: hidden;
    border-radius: 7px;
    box-shadow: 0 10px 28px rgba(0, 0, 0, .45);
    background: var(--scr);
  }
  .dbg-stage .screen { transform: scale(var(--ds)); }   /* 活屏的缩放（按窗口宽自适应） */

  .dbg-side { flex: 0 0 240px; width: 240px; display: flex; flex-direction: column; gap: 6px; }
  .dbg-side-head { display: flex; align-items: center; gap: 8px; padding: 3px 0; font-size: 11px; font-weight: 600; color: var(--txt2); }
  .dbg-side-head button {
    margin-left: auto;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 4px;
    border: 1px solid var(--line2);
    background: var(--panel);
    color: var(--txt2);
    cursor: pointer;
  }
  .dbg-side-head button:hover { background: var(--line); color: var(--txt); }

  .dbg-list { display: flex; flex-direction: column; gap: 3px; }
  .dbg-item {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 4px 8px;
    border-radius: 4px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--txt2);
    font-size: 11px;
    text-align: left;
    cursor: pointer;
  }
  .dbg-item i { font-style: normal; font-family: monospace; font-size: 10px; color: var(--muted); }
  .dbg-item .g { font-size: 9px; border-radius: 2px; padding: 0 4px; background: var(--line2); color: var(--txt2); }
  .dbg-item .g.ops { background: #2f4a48; }
  .dbg-item:hover { border-color: var(--line2); color: var(--txt); }
  .dbg-item.on { background: var(--blue); border-color: var(--blue); color: #11111b; font-weight: 600; }
  .dbg-item.on i { color: #11111b; }
  .dbg-item.on .g { background: rgba(17, 17, 27, .2); color: #11111b; }

  .dbg-log {
    height: 170px;
    overflow: auto;
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: 7px 9px;
    border: 1px solid var(--line);
    border-radius: 5px;
    background: var(--panel);
    font-family: monospace;
    font-size: 11px;
    line-height: 16px;
    color: var(--txt2);
  }
  .dbg-log .r { display: flex; gap: 7px; }
  .dbg-log .n { color: var(--muted); }
  .dbg-log .a { color: var(--blue); }
  .dbg-log .w { color: var(--mauve); }
  .dbg-log .empty { color: var(--muted); font-family: inherit; }
</style>
</head>
<body>

  <!-- 评审用外壳（不属于设计稿内容）：顶部工具栏（含 9 个页签）+ 一块 854×480 活屏 -->
  <header class="toolbar">
    <span class="t-title">中油测井显控看板 <em>· 854×480</em></span>
    <span class="tabs" id="tabs"></span>
    <span class="tools">
      <button id="toggleRuler" style="background:var(--yellow);color:#11111b">隐藏尺寸</button>
    </span>
  </header>

  <!-- 跳转调试台（评审用外壳，不属于设计稿内容）：把 9 屏装进一块可点击的 854×480 活屏，
       验证页眉模式切换 / 页签跳转 / 页脚弹窗与跳转；内容由末尾「八、跳转调试台」的 JS 渲染 -->
  <section class="dbg">
    <div class="dbg-head">
      <span class="dbg-title">跳转调试台</span>
      <span class="dbg-badge">评审用</span>
      <span class="dbg-now" id="dbgNow"></span>
      <span class="dbg-tip">点屏内页眉的模式按钮 / 页签 / 页脚按钮即可跳转，右侧「跳转记录」按顺序记下每一步</span>
    </div>
    <div class="dbg-body">
      <div class="dbg-stage"><div class="screen" id="dbgScreen"></div></div>
      <aside class="dbg-side">
        <div class="dbg-side-head"><span>页面清单</span><button id="dbgHome">回首页</button></div>
        <div class="dbg-list" id="dbgList"></div>
        <div class="dbg-side-head"><span>跳转记录</span><button id="dbgClear">清空</button></div>
        <div class="dbg-log" id="dbgLog"></div>
      </aside>
    </div>
  </section>

  <div id="rulerTip" class="ruler-tip" hidden></div>

<script>
/* ============================================================
   源码导航 · 九个页面的源码位置
     页面序号与函数的对应关系（每个函数 = 一个屏幕的完整 HTML）：
       屏幕 01  renderDirect()            …… 四、九个页面 → 「屏幕 01」
       屏幕 02  renderAgg()               …… 四、九个页面 → 「屏幕 02」
       屏幕 03  renderSat()               …… 四、九个页面 → 「屏幕 03」
       屏幕 04  renderOpsHome()           …… 运维模式首页：只做设置入口，无页签栏、无底部栏；
                                              两种卡内都是左右分栏 = 左「图标 + 名称」/
                                              右竖排「在线状态（SIM 用 .sim-state、卫星用 .state-slot、
                                              基站用 .bts-state）+ 各自的第二、三行」（链路第二行是
                                              运营商 logo + 名称，基站是物理小区ID / 连接用户数）；
                                              基站 4G / 5G 图标见 ICO_BTS4 / ICO_BTS5，
                                              这两枚在入口卡上按 54px 走（链路图标的 18px 三倍）；
                                              入口数据见「一、样例数据 → OPS_HOME_LINKS / OPS_HOME_BTS」
       屏幕 05  simPage()                 …… 共用模板 renderOperator()，只有这一屏：
                                              一屏通吃 5 条 SIM 链路，页签栏点哪条就把本屏
                                              重渲染成哪条（opsSel），数据源见「一、样例数据 → OPS」；
                                              页签文案固定 SIM1~SIM5 + 一条卫星链路，
                                              页签上那颗状态点跟着各自的在线状态配色；
                                              本屏是设置页，上半屏三张卡 = 左上 SIM 参数设置
                                              （链路开关 / 入网方式 / APN / 鉴权方式 / 用户名 / 密码）、
                                              右上 锁LTE小区 + 锁5G小区，
                                              下半屏并排两栏 = LTE相邻小区信息 + NR-5G相邻小区信息
                                              （各是一块 固定表头 + 手动滚动的文本）；
                                              离线 / 未插卡 / 已禁用三条走空态。
                                              本屏没有页眉（二级页不给模式切换入口），
                                              底部换成功能页脚 editFoot()：左「保存&应用」右「返回」；
                                              本屏的分段选择器（链路开关 / 入网方式 / 鉴权方式 /
                                              锁定开关）是能点的：点哪项就切到哪项，
                                              改的是 OPS[opsSel] 上的字段并就地重渲染本屏
       屏幕 06  renderBase(BTS4)          …… 基站设置页，共用模板 renderBase()，屏幕 06、07：
       屏幕 07  renderBase(BTS5)              页眉整条不要（与 05、09 一致），底部同屏幕 05 的
                                              editFoot()；左「基站标识（点它弹出编辑弹窗）+
                                              小区状态开关 + 只读的 UE 个数 / 负载条」，右
                                              「小区参数」六（5G 七）张卡片，点卡片同样弹出
                                              编辑弹窗（editItemModal()）；数据源见
                                              「一、样例数据 → BTS4 / BTS5」
       屏幕 08  renderSettings()           …… 系统设置（屏幕 01、02 页脚「系统设置」按钮的落点）：
                                              两项设置合并在一张「系统设置」卡里 ——
                                              「管理平台地址」（IP 大字 + 铅笔，点它弹编辑弹窗）、
                                              「状态上报频率」（四档选择器，默认 15s），
                                              两行等分卡高、行间一条分隔线；
                                              底部与屏幕 05 同款功能页脚 editFoot(true)
                                              （「返回」走 data-back 退回来源页），

/* 运维模式：5 条 SIM 链路 → 屏幕 05「SIM 链路详情」的五种取值
   （屏幕 05 一屏通吃，页签栏点哪条就把本屏渲染成哪条，见 OPS[opsSel]）
   第 i 条就是 SIM(i+1)，顺序与在线状态都严格跟着「工程模式 → SIMS」走，
   页签文案也只写 SIM1~SIM5、不写运营商名 —— 用户插的是哪家的卡页面无从得知。
   本屏只做设置，不放速率 / 时延 / 信号读数（那些在屏幕 01 / 02 的链路状态表里），
   所以每条链路只留本屏用得着的字段：
     state    = 在线状态（在线 / 拨号中 / 离线 / 未插卡 / 已禁用这五种之一）：
                页签上那颗状态点按它查 SIM_STATE 配色，相邻小区的空态文案也按它给
     disabled = 链路开关，即「是否禁用该链路」，本屏 SIM 参数设置卡的第一行；
                只有 SIM5 为 true（state 就是已禁用）；SIM4 未插卡只是插槽里没卡，
                链路本身没被禁用，所以仍是 false
     net      = 入网方式（自动 / SA / NSA / LTE 四选一）
     auth     = 鉴权方式（无鉴权 / 自动 / PAP / CHAP）
     apn / user / pwd = 「SIM 参数设置」卡里三个可编辑项的样例值（pwd 渲染时打码）
     lte / nr = 相邻小区，按制式分成两组，正好对应下半屏并排的那两栏（左 LTE、右 NR-5G）。

   data = 是否已有速率与时延读数（只有「在线」链路测得到） */

  '拨号中': { cls: 'dial',     sig: true,  data: false },
  '离线':   { cls: 'off',      sig: true,  data: false },
  '未插卡': { cls: 'nosim',    sig: false, data: false },

};

/* 工程模式：卫星链路 → 屏幕 03

const SAT = { cn0: 42, up: 1.2, down: 4.5, ping: 201, jitter: 30 };

/* 运维模式：屏幕 09「卫星链路设置」的四项可编辑样例值（精简版，只这四项）
   disabled 与屏幕 05 的「链路开关」同义：true = 这条链路被禁用（不拨号，按「无卫星链路」看）；
   system / band 是两排分段选择器的取值（选项见下面两个常量），id 是文本输入框里的卫星标识；
   id / band 取的就是屏幕 03「卫星传输」上的那两个样例值，两屏对照着看能对上 */
const SAT_SET = { disabled: false, system: '亚太6D', band: 'Ku', id: 'SAT-KU-03' };
const SAT_SYSTEMS = ['天通一号', '北斗三号', '亚太6D', 'Inmarsat'];
const SAT_BANDS   = ['L', 'S', 'Ku', 'Ka'];

/* 屏幕 08「系统设置」的两项设置（改这两项 → 跳到「四、九个页面 → 屏幕 08」）：
     ip     = 管理平台地址，状态数据上报到这个 IP；点地址那块大字弹编辑弹窗改它
     report = 状态上报频率，单位秒，默认 15s 上报一次；
              页面上摆成 REPORT_STEPS 四档的分段选择器，选中哪档就写回这个字段 */
const SYS_SET = { ip: '192.168.10.100', report: 15 };

/* 上报频率的可选档位（秒）：默认值 15 就在列表里，页面上高亮的那一档即当前值 */
const REPORT_STEPS = [5, 15, 30, 60];

/* 屏幕 03「链路状态」的三种取值：数组顺序即点击徽标时的切换顺序，
   默认停在下标 0（无卫星链路）。cls 只决定徽标底色，
   无卫星链路→红、在线→绿、离线→黄；文字色与内边距统一由 .kv .v.state-slot 控制 */
const LINK_STATES = [
  { text: '无卫星链路', cls: 'st-none' },
  { text: '在线',       cls: 'st-on'   },
  { text: '离线',       cls: 'st-off'  }
];
let linkIdx = 0;

/* 基站状态：BTS4 → 屏幕 06（兼作屏幕 01 / 02 的 4G 基站卡）；BTS5 → 屏幕 07（兼作 5G 基站卡）
   key 是屏幕 06 / 07 上那排「小区状态」开关写回数据的标识（见 BTS_KEYS），也是 .seg 的 data-t；
   status 是小区状态开关的取值（激活 / 禁用），跟 online 不是一回事：
   一个小区可以「激活」但「离线」（BTS5 就是），所以两个字段各改各的，改开关不动 online；
   online 决定卡片底色与状态文案（在线淡绿 / 离线淡红），设计稿按「4G 在线、5G 离线」举例
   cardPci / cardUe 只给屏幕 01 / 02 的基站卡片用，都按 4 位数字控件的宽度预留：
   物理小区 ID 最长 4 位且只有 5G 会到 4 位，故 5G 卡取 1002；连接用户数一律按 4 位，前导补 0；
   屏幕 06 / 07 的参数表仍取 cells[0][1] 与 ue / ueMax 里的原示例值。

   cells 每项 = [参数名, 当前值, 单位（可省）, 选项表（可省）]：

   工作频段只排频段号（B3 / n78），不写中心频率 —— 频点那一项已经有 MHz 量级的读数了；
   工作模式只有 FDD / TDD 两种，故排成两个按钮而不是输入框。
   参数卡片一律一格一张、右边不留空位：5G 有 7 项，最后一行就只有「发射功率」一张（右侧空着） */

/* 屏幕 05（SIM 链路详情）在「五、页面清单」SCREENS 里的下标，也就是屏幕号 05 减 1。
   屏幕 04 的 5 张 SIM 卡指向这一屏，常量放这里免得两处各写一个 4 */
const SIM_PAGE = 4;

/* 屏幕 09（卫星链路设置）在 SCREENS 里的下标，也就是屏幕号 09 减 1。
   屏幕 04 的「卫星链路」入口卡指向这一屏，常量放这里免得两处各写一个 8 */
const SAT_PAGE = 8;

/* 屏幕 06 / 07（4G基站 / 5G基站）在 SCREENS 里的下标，也就是屏幕号减 1，
   排在屏幕 05 后面两屏 */
const BTS4_PAGE = SIM_PAGE + 1;   /* 屏幕 06 */
const BTS5_PAGE = SIM_PAGE + 2;   /* 屏幕 07 */

/* 屏幕 06 / 07 上那排「小区状态」开关写回哪里：key（BTS4.key / BTS5.key）
   → d = 要写的基站数据、page = 这一屏在 SCREENS 里的下标（写完就地重渲染哪一屏），
   与屏幕 05 / 09 的分段选择器是同一套机制（.seg 的 data-t） */
const BTS_KEYS = {
  bts4: { d: BTS4, page: BTS4_PAGE },
  bts5: { d: BTS5, page: BTS5_PAGE }
};

/* 运维模式首页（屏幕 04）的两组设置入口 → 一条链路 / 一个基站各一张卡
   链路：SIM1~SIM5 直接取上面 SIMS 的「链路标识 + 运营商 + 在线状态」，
        ico 决定卡首行画哪枚图标（ico:'sim' → SIM 卡图标、ico:'sat' → 小号卫星图标），
        st 是状态行的配色与文案（配色查 SIM_STATE，文案取 SIMS 的 state 原值）；
        末尾再追加一条卫星链路 —— 卫星既没有 SIM 号也没有运营商，卡上不排运营商行，
        状态改用屏幕 03「链路状态」的三态徽标（slot，默认停在下标 0 = 无卫星链路）；
   基站：取 BTS4 / BTS5 的「基站名 + 基站标识」，基站不分链路状态，不带 ico / st / slot。
   go  = 点击后进入的二级页序号 - 1；
   sim = 进去后屏幕 05 默认显示哪条链路（OPS 下标），只有链路卡有这一项。
   5 张 SIM 卡都进屏幕 05（同一个模板，只是喂的数据不同），SIM(i+1) 就对应 OPS 的第 i 条
   （两边同名同序，直接拿数组下标当 OPS 下标，不必再按运营商名去猜是哪条链路）。
   末尾那张卫星链路卡进屏幕 09（卫星链路设置），它没有 SIM 号、也不走 OPS，
   所以 sim 留 null = 卡上不挂 data-sim（屏幕 05 才按它选链路） */
const OPS_HOME_LINKS = SIMS.map((s, i) => ({
    ico: 'sim', t1: s.name, op: s.op,
    st: { cls: SIM_STATE[s.state].cls, text: s.state },
    go: SIM_PAGE, sim: i
  })).concat([{
    ico: 'sat', t1: '卫星链路', slot: LINK_STATES[linkIdx], go: SAT_PAGE, sim: null
  }]);

/* 基站条目：ico = 卡片左侧的基站图标（bts4 / bts5，形状即 4G / 5G 的区别），
   online / pci / ue 直接取自 BTS4 / BTS5 的 online / cardPci / cardUe，
   与屏幕 01~03 的基站卡同源，不另存一份数字；
   4G / 5G 的详情页是分开的两屏，所以两个基站各挂一个 go */
const OPS_HOME_BTS = [
  { ico: 'bts4', t1: BTS4.label, online: BTS4.online, pci: BTS4.cardPci, ue: BTS4.cardUe, go: SIM_PAGE + 1 },  /* 4G基站 → 屏幕 06 */
  { ico: 'bts5', t1: BTS5.label, online: BTS5.online, pci: BTS5.cardPci, ue: BTS5.cardUe, go: SIM_PAGE + 2 }   /* 5G基站 → 屏幕 07 */
];

/* 版本信息弹窗 → 屏幕 01、02 页脚「版本信息」按钮的弹窗内容
   版本号用「V00.00.00」这种定宽占位串，屏上按它的宽度摆文本控件；
   构建时间 / commit id 为样例值，发布说明在屏上是文本框、设计稿里只留空框 */
const VERSION = {
  ver:    'V00.00.00',
  build:  '2026-09-16 14:32:08',
  commit: '9f3c1d7'
};

/* ============================================================
   二、工具函数
   ============================================================ */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fmt = (v, d = 1) => (v === null || v === undefined) ? '--' : v.toFixed(d);

/* 信号强度 -105 ~ -60 dBm 折算成 0 ~ 5 格信号格 */
const signalBars = d => d >= -60 ? 5 : d >= -70 ? 4 : d >= -80 ? 3 : d >= -90 ? 2 : d >= -100 ? 1 : 0;
const sigTone  = d => d >= -70 ? '' : d >= -85 ? 'warn' : 'bad';

/* 信号格 → 屏幕 01、02；0 格（无信号）时右上角叠一个红色 ✕ */
function barsHtml(n, tone) {
  let h = '<span class="bars ' + (tone || '') + '">';
  for (let i = 1; i <= 5; i++) h += '<i class="' + (i <= n ? 'on' : '') + '"></i>';
  if (!n) h += '<svg class="bars-x" viewBox="0 0 10 10" fill="none" stroke="currentColor" ' +
    'stroke-width="1.8" stroke-linecap="round"><path d="M1.7 1.7 8.3 8.3M8.3 1.7 1.7 8.3"/></svg>';
  return h + '</span>';
}

/* 键值行 → 屏幕 03 */
const kv = (k, v) => '<div class="kv"><span class="k">' + k + '</span><span class="v">' + v + '</span></div>';

/* 分段选择器：[[文案, 是否选中, 色调]] → 屏幕 05~07、09
   能点的选择器要多传一个 field：
   它就是被这一排按钮写的那个字段名（disabled / net / auth / lockLte / lockNr / system / band），
   会落到 .seg 的 data-f 上，每一项的文案落到自己的 data-v 上；
   第三项 t 指这份数据存在哪（'sat' → 屏幕 09 的 SAT_SET，'bts4' / 'bts5' → 屏幕 06 / 07 的
   BTS4 / BTS5，不传 → 屏幕 05 的 OPS[opsSel]），落到 data-t 上；
   第四项 i 只给「参数卡片里的那个选择器」用（屏幕 06、07 的「工作模式」）：
   它写的是 b.cells 里第 i 项的值、不是顶层字段，落到 data-i 上；
   屏幕 06、07 的只读标尺（.cells 之外的 seg）只传文案，不传 field */
const seg = (opts, field, t, i) =>
  '<span class="seg"' + (field ? ' data-f="' + field + '"' + (t ? ' data-t="' + t + '"' : '') +
      (i === undefined ? '' : ' data-i="' + i + '"') : '') + '>' +
  opts.map(o => '<span' + (field ? ' data-v="' + o[0] + '"' : '') +
    ' class="' + (o[1] ? 'on ' + (o[2] || '') : '') + '">' + o[0] + '</span>').join('') + '</span>';

/* 条形仪表 → 屏幕 05~07 */
const meter = (pct, color) =>
  '<span class="meter"><i style="width:' + (clamp(pct, 0, 1) * 100).toFixed(0) + '%;background:' + color + '"></i></span>';

/* 参数字卡片 → 屏幕 06、07
   每张卡片 = 参数名（.k）+ 值（.v）+ 改造口，值分两种排法：
     ① 默认「数值 + 单位（单位小一号）+ 行尾一支铅笔」：点整张卡片弹出编辑弹窗，
        靠 data-e / data-p / data-i 三个值（key = BTS4.key / BTS5.key、i = b.cells 的下标）
        让弹窗知道改哪一项；
     ② 数据里给了第 4 项（选项表）时改用分段选择器：如「工作模式」只有 FDD / TDD 两种，
        排成两个按钮、点哪项切哪项，不弹输入框 —— 此时卡片不再是 .edit-hit，
        点按钮走分段选择器那条路（.seg 的 data-i 指回 b.cells 的第几项）
   参数卡片一格一张、不跨列排版，所以卡片本身不带列宽相关的类 */
const cell = (c, key, i) => {
  const opts = c[3];
  const ctrl = opts
    ? seg(opts.map(t => [t, t === c[1]]), 'cells', key, i)
    : '<span class="v">' + c[1] + (c[2] ? '<small>' + c[2] + '</small>' : '') +
        '<span class="pen">' + ICO_PEN + '</span></span>';
  return '<div class="cell' + (opts ? '' : ' edit-hit') + '"' +
      ' data-e="' + key + '" data-p="cells" data-i="' + i + '">' +
    '<span class="k">' + c[0] + '</span>' + ctrl + '</div>';
};

/* 可编辑值框 → 屏幕 05「SIM 参数设置」卡的 APN / 用户名 / 密码三行
   屏上是「文本控件 + 点击弹键盘」，设计稿画成一张小值框：等宽数值 + 行尾一支铅笔，
   值与笔都贴右边缘（.field 是两端对齐），一眼能看出这三行是可以改的 */
const inp = v => '<span class="inp"><span class="v">' + v + '</span>' +
  '<span class="pen">' + ICO_PEN + '</span></span>';

/* 屏幕 05「SIM 参数设置」卡里两个分段选择器的取值 —— 把可选值全摆出来，
   选中项由链路数据决定（net → 入网方式、auth → 鉴权方式，见「一、样例数据 → OPS」） */
const NET_MODES  = ['自动', 'SA', 'NSA', 'LTE'];
const AUTH_MODES = ['无鉴权', '自动', 'PAP', 'CHAP'];

/* 相邻小区 → 屏幕 05 下半屏那两块「固定表头 + 手动滚动的文本」
   屏上每一块是一个滑动文本控件：该制式的全部小区写成一段等宽文字，手指拖动才滚、不自动滚；
   列与列之间只能靠空格撑，所以这里按显示宽度补空格 ——
   实测这套等宽字体 ASCII 每字符 6px、中文 12px，正好是 1 格与 2 格；
   表头与每一行都走同一套网格才对得齐，每列宽都够放下对应的表头
   （最宽的「PCI(十进制)」占 11 格 < 该列的 16 格），不必另做绝对定位。
   末列宽度只用于补齐、显示时由 trimEnd 去掉行尾空格 */
const cellWidth = s => [...String(s)].reduce((n, c) => n + (c.charCodeAt(0) > 0x2e7f ? 2 : 1), 0);
const cellPad = (s, w) => s + ' '.repeat(Math.max(0, w - cellWidth(s)));
const cellLine = (vals, cols) => vals.map((v, i) => cellPad(String(v), cols[i])).join('').trimEnd();

/* 屏幕 05 下半屏并排的两栏相邻小区，左边 LTE、右边 NR-5G：
   两栏的列不一样（LTE 末尾是接收信号强度 RSSI、NR 末尾是信噪比 SINR），
   所以表头、列宽、每行怎么取值都各自配一套（数据见「一、样例数据 → OPS」的 lte / nr）；
   两栏列宽取得一样，左右并排时列与列正好对齐，看着是一张表被切成了两半。
   单位一律写在表头里（RSRP/dBm、RSRQ/dB、RSSI/dBm、SINR/dB），数据行只留数字 ——
   这样每行的数值短，列与列之间才空得出来。
   列宽按「该列最宽的那一项（表头或数据）+ 4~5 格空档」定：
   面板内容宽 383px、ASCII 每格 6px，一行约 63 格可用，
   下面 5 列合计 58 格，右侧还留出余量（NR 那栏带竖向滚动条，可用宽少 10px） */
const NB_COLS = [10, 16, 13, 11, 8];
const NB_TABLES = [
  { key: 'lte', title: 'LTE相邻小区信息',
    head: ['ARFCN', 'PCI(十进制)', 'RSRP/dBm', 'RSRQ/dB', 'RSSI/dBm'],
    row: n => [n.arfcn, n.pci, n.rsrp, n.rsrq, n.rssi] },
  { key: 'nr',  title: 'NR-5G相邻小区信息',
    head: ['ARFCN', 'PCI(十进制)', 'RSRP/dBm', 'RSRQ/dB', 'SINR/dB'],
    row: n => [n.arfcn, n.pci, n.rsrp, n.rsrq, n.sinr] }
];

/* 一块相邻小区面板：标题（右边挂「共 N 个」）+ 固定表头 + 手动滚动的文本；
   这组小区没有读数（离线 / 未插卡 / 已禁用）时走空态，文案按链路状态给 */
function nbPanel(t, list, emptyText) {
  return '<section class="panel" style="flex:1">' +
      '<div class="panel-title"><span>' + t.title + '</span>' +
        '<span class="tag">共 ' + list.length + ' 个</span></div>' +
      (list.length
        ? '<pre class="roll-head">' + cellLine(t.head, NB_COLS) + '</pre>' +
          /* 行数多于一屏时由 .rollview 自己出滚动条（设计稿上是滚轮 / 触摸拖动，
             与串口屏上手指拖动滑动文本控件同构）；不自动滚，所以内容只写一份、不挂动画 */
          '<div class="rollview"><pre>' +
            list.map(n => cellLine(t.row(n), NB_COLS)).join('\n') +
          '</pre></div>'
        : '<div class="empty">' + emptyText + '</div>') +
    '</section>';
}

/* ============================================================
   三、页面骨架（9 屏共用的外壳与公共组件）
   ============================================================ */
/* 工程模式页签栏 → 屏幕 01、02、03
   data-go = 目标页序号 - 1，供开头的「跳转调试台」点击跳转；
   data-mode 标出这是三种工作模式之间的切换：点了先弹二级确认（modeModal），
   确认后才真跳 —— 换模式要重配模组并重新拨号，不能让一次误触就把链路打断 */
function engNav(active) {
  return ['直连模式', '聚合模式', '卫星传输'].map((t, i) =>
      '<span class="tab' + (t === active ? ' on' : '') + '" data-go="' + i + '" data-mode="1">' + t + '</span>').join('');
}

/* 运维模式页签栏 → 屏幕 05~07（屏幕 04 是入口页，不放页签栏）；
   左「SIM链路」摆的是屏幕 05 这一屏的五种取值 + 一条卫星链路：前五条不带 data-go，
   只挂 data-sim = OPS 下标，点它就地把本屏渲染成那条链路，不换屏；
   页签文案固定写 SIM1~SIM5 —— 卡是哪家运营商的页面无从得知，不写运营商名；
   标识前面那颗状态点按 SIM_STATE[state].cls 配色（在线绿 / 拨号中黄 / 离线红 /
   未插卡灰 / 已禁用桃），与屏幕 01 / 02 的在线状态点同一套语义；
   末尾「卫星链路」不在这五种取值里（卫星没有 SIM 号、也不走 OPS），
   而是另有独立的一屏，所以挂 data-go = 屏幕 09（卫星链路设置）；
   它的状态点取屏幕 03 的三态徽标配色；
   右「基站」的 4G / 5G 各有独立的一屏，照旧 data-go = 目标页序号 - 1（屏幕 06、07） */
function opsNav(active) {
  const links = OPS.map((o, i) =>
    '<span class="tab' + (o.name === active ? ' on' : '') + '" data-sim="' + i + '">' +
      '<i class="sd ' + SIM_STATE[o.state].cls + '"></i>' + o.name + '</span>').join('') +
    '<span class="tab' + ('卫星链路' === active ? ' on' : '') + '" data-go="' + SAT_PAGE + '">' +
      '<i class="sd ' + LINK_STATES[linkIdx].cls + '"></i>卫星链路</span>';
  const bts = ['4G基站', '5G基站'].map((t, i) =>
    '<span class="tab' + (t === active ? ' on' : '') + '" data-go="' + (SIM_PAGE + 1 + i) + '">' + t + '</span>').join('');
  return '<span class="nav-label">SIM链路</span>' + links +
         '<span class="nav-sep"></span><span class="nav-label">基站</span>' + bts;
}
