<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中油测井显控看板 · 854x480 设计稿</title>
<style>
  /* ============================================================
     源码导航 · 屏幕序号速查（共 14 屏 = 9 屏设计稿 + 5 屏预留空白，单列纵向展示）
       屏幕 01  工程模式 · 直连模式（首页默认）
       屏幕 02  工程模式 · 聚合模式
       屏幕 03  工程模式 · 卫星传输
       屏幕 04  运维模式 · 首页默认 · 中国移动1
       屏幕 05  运维模式 · 中国移动2
       屏幕 06  运维模式 · 中国电信
       屏幕 07  运维模式 · 中国联通（离线）
       屏幕 08  运维模式 · 4G基站
       屏幕 09  运维模式 · 5G基站
       屏幕 10~14  预留空白区域（无标题、无内容，由 build() 生成）

     CSS 分段与屏幕的对应（下面每段注释末尾也标了「→ 屏幕 xx」）：
       页面外壳：页眉 / 页签栏 / 内容区 / 底栏 …… 全部 9 屏
       屏幕 01、02 专用：链路状态列表（.sim-*）+ 基站状态卡片（.bs-card，底色随在线状态淡绿 / 淡红）+ 功能页脚（.foot-bar / .foot-btn）
                     屏幕 01、02 用功能页脚替代底栏，其余 7 屏仍为提示底栏
       弹窗（.modal / .modal-mask）…… 屏幕 01、02，由页脚按钮触发：
                      「版本信息」→ 版本号 / 构建时间 / commit id / 发布说明
                      「屏幕亮度」→ .modal.sm 内一个水平滑块 + 百分比读数
                      「重启设备」→ .modal.confirm 二级确认（取消 / 确认重启）
       通用控件：
         环形仪表 .gauge-wrap …… 屏幕 03、04~07
         大数值 .kpi …… 屏幕 02、03、08、09，以及 04~07 的速率面板
         速率趋势 .trend / 键值列表 .kv …… 屏幕 03
         信号格 .bars …… 屏幕 01、02、04~07
         条形仪表 .meter …… 屏幕 04~09
         分段选择器 .seg …… 屏幕 03、04~09
         在线状态点 .dot / .bs-state、.sim-state（在线 / 拨号中 / 离线 / 未插卡 / 已禁用）…… 屏幕 01、02
       速率面板（.row-panel / .half）…… 屏幕 02、04~07
       聚合链路状态条（.agg-bar，五列：首列连接状态 + 4 个 KPI）…… 屏幕 02
       指标 + 邻区信息表（.metric / .thead / .trow / .lock / .empty）…… 屏幕 04~07
       基站参数字卡片（.cells / .cell）…… 屏幕 08、09
     ============================================================ */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg:     #1e1e2e;
    --scr:    #11111b;
    --panel:  #181825;
    --panel2: #1e1e2e;
    --line:   #313244;
    --line2:  #45475a;
    --txt:    #ffffff;
    --txt2:   #cdd6f4;
    --muted:  #a6adc8;               /* 三级文字亮度整体上提一档，提升小屏可视性 */

    --blue:   #89b4fa;
    --green:  #a6e3a1;
    --yellow: #f9e2af;
    --red:    #f38ba8;
    --peach:  #fab387;
    --mauve:  #cba6f7;
    --teal:   #94e2d5;

    --s: .42;                        /* 单屏缩放比例 */
    --cw: calc(854px * var(--s));
    --ch: calc(480px * var(--s));
  }

  body {
    background: var(--bg);
    color: var(--txt);
    min-height: 100vh;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex;
    flex-direction: column;
  }

  /* ======================= 顶部工具栏 ======================= */
  .toolbar {
    position: sticky;
    top: 0;
    z-index: 50;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 18px;
    background: rgba(30, 30, 46, .94);
    border-bottom: 1px solid var(--line);
    flex-wrap: wrap;
  }
  .t-title { font-size: 13px; font-weight: 600; white-space: nowrap; }
  .t-title em { font-style: normal; color: var(--muted); font-weight: 400; }

  .tabs { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; justify-content: center; }
  .ttab {
    font-size: 11px;
    padding: 4px 9px;
    border-radius: 4px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--txt2);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 5px;
    white-space: nowrap;
  }
  .ttab i { font-style: normal; font-family: monospace; font-size: 10px; color: var(--muted); }
  .ttab:hover { border-color: var(--line2); color: var(--txt); }
  .ttab.ops { border-color: #2f4a48; }
  .ttab.active { background: var(--blue); border-color: var(--blue); color: #11111b; font-weight: 600; }
  .ttab.active i { color: #11111b; }

  .tools { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .tools button {
    background: var(--line);
    color: var(--txt);
    border: 1px solid var(--line2);
    border-radius: 4px;
    padding: 3px 10px;
    font-size: 12px;
    cursor: pointer;
  }
  .tools button:hover { background: var(--line2); }
  .tools span { font-size: 12px; font-family: monospace; color: var(--txt2); min-width: 38px; text-align: center; }

  /* ======================= 平铺舞台 ======================= */
  .stage { flex: 1; overflow: auto; padding: 22px 22px 60px; }
  .grid {
    display: grid;
    grid-template-columns: var(--cw);   /* 单列纵向排列 */
    gap: 40px;                          /* 屏与屏之间的间隔 */
    margin: 0 auto;
    width: max-content;
  }

  .frame { display: flex; flex-direction: column; gap: 7px; }
  .frame-head { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--txt2); }
  .frame-head .idx { font-family: monospace; color: var(--muted); }
  .frame-head .fgroup { font-size: 10px; font-weight: 600; color: #11111b; background: var(--blue); border-radius: 3px; padding: 1px 6px; }
  .frame-head .fgroup.ops { background: var(--teal); }
  .frame-head .fname { font-weight: 600; color: var(--txt); }
  .frame-head .fsize { margin-left: auto; font-family: monospace; font-size: 11px; color: var(--muted); }

  .viewport {
    width: var(--cw);
    height: var(--ch);
    overflow: hidden;
    border-radius: 7px;
    box-shadow: 0 10px 28px rgba(0, 0, 0, .45);
    background: var(--scr);
  }
  .frame.flash .viewport { animation: flash .9s ease-out; }
  @keyframes flash {
    0%   { box-shadow: 0 0 0 0 rgba(137, 180, 250, .95); }
    100% { box-shadow: 0 0 0 14px rgba(137, 180, 250, 0); }
  }

  /* ======================= 屏幕本体：854 x 480 ======================= */
  .screen {
    width: 854px;
    height: 480px;
    background: var(--scr);
    background-image:
      radial-gradient(circle at 18% 0%, rgba(137, 180, 250, .07), transparent 55%),
      radial-gradient(circle at 88% 100%, rgba(148, 226, 213, .05), transparent 55%);
    transform: scale(var(--s));
    transform-origin: top left;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ---- 页眉：右上角模式切换，独立占一行 → 屏幕 01~09 ---- */
  .bar-top {
    flex: 0 0 36px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
    padding: 0 12px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
  }
  .mode-btn {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .5px;
    color: var(--txt2);
    background: var(--panel2);
    border: 1px solid var(--line2);
    border-radius: 4px;
    padding: 4px 14px;
  }
  .mode-btn.on        { color: #11111b; background: var(--blue); border-color: var(--blue); }
  .mode-btn.on.ops    { background: var(--teal); border-color: var(--teal); }

  /* ---- 在线状态点 → 屏幕 01（SIM 行）、屏幕 02（链路卡） ---- */
  .dot { display: block; width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 6px rgba(166, 227, 161, .85); }
  .dot.bad { background: var(--red); box-shadow: 0 0 6px rgba(243, 139, 168, .85); }

  /* ---- 页签栏 → 屏幕 01~09 ---- */
  .bar-nav {
    flex: 0 0 46px;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 12px;
    background: #16161f;
    border-bottom: 1px solid var(--scr);
  }
  .nav-label { font-size: 11px; color: var(--muted); }
  .nav-sep { width: 1px; height: 18px; background: var(--line2); margin: 0 6px; }
  .tab {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    padding: 4px 12px;
    border-radius: 5px;
    border: 1px solid var(--line);
    background: var(--panel2);
    color: var(--txt2);
    white-space: nowrap;
  }
  .tab.on { color: #11111b; background: var(--blue); border-color: var(--blue); font-weight: 600; }
  .tab .sd { width: 6px; height: 6px; border-radius: 50%; background: var(--green); }
  .tab .sd.off { background: var(--red); }
  .tab.on .sd { background: #11111b; }

  /* ---- 内容区 → 屏幕 01~09 ---- */
  .body { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; padding: 12px; }
  .row { display: flex; gap: 12px; min-height: 0; }
  .col { display: flex; flex-direction: column; gap: 12px; min-width: 0; }

  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-width: 0;
    min-height: 0;
  }
  .panel-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    font-weight: 600;
    color: #ffffff;
    letter-spacing: .4px;
  }
  .tag { font-size: 10px; color: var(--muted); border: 1px solid var(--line); border-radius: 3px; padding: 1px 6px; }
  .tag.blue  { color: var(--blue);   border-color: rgba(137, 180, 250, .4); }
  .tag.yellow{ color: var(--yellow); border-color: rgba(249, 226, 175, .4); }
  .tag.teal  { color: var(--teal);   border-color: rgba(148, 226, 213, .4); }

  .field { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; }
  .field .k { color: var(--muted); }
  .hr { height: 1px; background: var(--line); }

  /* ---- 环形仪表 → 屏幕 03、04~07 ---- */
  .gauge-wrap { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; gap: 16px; }
  .gauge { display: flex; align-items: center; gap: 12px; }
  .ring-num { font-family: monospace; font-size: 22px; font-weight: 700; }
  .ring-unit { font-size: 10px; font-family: monospace; }
  .big-hint { font-size: 13px; font-weight: 600; color: var(--teal); }

  /* ---- 信号格 → 屏幕 01、02、04~07 ---- */
  .bars { display: flex; align-items: flex-end; gap: 2px; height: 22px; position: relative; }
  .bars i { display: block; width: 5px; border-radius: 1px; background: var(--line); }
  .bars i:nth-child(1) { height: 6px; }
  .bars i:nth-child(2) { height: 9px; }
  .bars i:nth-child(3) { height: 12px; }
  .bars i:nth-child(4) { height: 15px; }
  .bars i:nth-child(5) { height: 18px; }
  .bars i.on { background: var(--green); }
  .bars.warn i.on { background: var(--yellow); }
  .bars.bad  i.on { background: var(--red); }
  /* 无信号（0 格）：灰格表示强度归零，左上角再叠一个红色 ✕ 表示链路不可用 */
  .bars .bars-x { position: absolute; left: -2px; top: 6px; width: 9px; height: 9px; color: var(--red); }

  /* ---- 大数值 → 屏幕 02、03、08、09，以及 04~07 的速率面板 ---- */
  .kpi { display: flex; align-items: baseline; gap: 6px; }
  .kpi .num { font-family: monospace; font-size: 36px; font-weight: 700; line-height: 1.05; color: var(--green); }
  .kpi .u { font-size: 11px; color: var(--muted); }
  .kpi .of { font-size: 18px; color: var(--muted); }
  .kpi.sm .num { font-size: 24px; }

  /* ---- 速率趋势 → 屏幕 03 ---- */
  .trend { flex: 1 1 auto; min-height: 26px; display: flex; align-items: flex-end; gap: 2px; }
  .trend i { display: block; width: 5px; border-radius: 1px; }

  /* ---- 键值列表 → 屏幕 03 ---- */
  .kv { display: flex; align-items: center; justify-content: space-between; font-size: 12px; padding: 5px 0; border-bottom: 1px dashed rgba(69, 71, 90, .45); }
  .kv:last-child { border-bottom: none; }
  .kv .k { color: var(--muted); }
  .kv .v { font-family: monospace; color: var(--txt); }

  /* ---- 分段选择器 → 屏幕 01、03、04~07、08、09 ---- */
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 5px; overflow: hidden; }
  .seg > span { font-size: 11px; line-height: 20px; padding: 0 12px; color: var(--muted); background: var(--panel2); }
  .seg > span.on { color: #11111b; background: var(--green); font-weight: 600; }
  .seg > span.on.bad { background: var(--red); }

  /* ---- 条形仪表 → 屏幕 01、02、04~09 ---- */
  .meter { display: block; width: 100%; height: 7px; border-radius: 4px; background: var(--line); overflow: hidden; }
  .meter i { display: block; height: 100%; border-radius: 4px; }

  /* ---- 指标（时延 / 抖动） → 屏幕 04~07 ---- */
  .metric { display: flex; align-items: baseline; gap: 6px; font-size: 12px; }
  .metric .k { color: var(--muted); min-width: 30px; }
  .metric .v { font-family: monospace; font-size: 22px; font-weight: 700; color: var(--mauve); }
  .metric.jit .v { color: var(--peach); }
  .metric .u { font-size: 11px; color: var(--muted); }

  /* ---- 邻区信息表 → 屏幕 04~07 ---- */
  .thead, .trow { display: grid; grid-template-columns: 1.5fr .7fr 1.3fr 1fr .8fr; gap: 6px; align-items: center; }
  .thead { font-size: 11px; color: var(--txt2); padding: 4px 0; border-bottom: 1px solid var(--line); }
  .tbl { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .trow { flex: 1; font-size: 12px; border-bottom: 1px solid rgba(49, 50, 68, .55); }
  .trow:last-child { border-bottom: none; }
  .lock { font-size: 11px; line-height: 14px; padding: 1px 8px; border-radius: 3px; border: 1px solid var(--line2); color: var(--txt2); }
  .lock.on { color: var(--yellow); border-color: rgba(249, 226, 175, .5); background: rgba(249, 226, 175, .12); }
  .empty { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--muted); }

  /* ---- 速率面板 + 聚合总览（.row-panel / .half） → 屏幕 02、04~07 ---- */
  .row-panel { flex-direction: row; align-items: center; gap: 0; }
  .half { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 6px; padding: 0 12px; border-left: 1px solid var(--line); }
  .half:first-child { border-left: none; padding-left: 0; }
  .half > .k { font-size: 11px; color: var(--muted); }

  /* ---- 聚合链路状态条（连接状态 / 实时上下行速率 / 时延 / 链路数） → 屏幕 02 ----
     五列同构：上 = .k 标签，下 = 值行；
     首列值行 = 聚合连接状态正文（在线 / 离线），与其余四列数值同样靠左起排，用状态色 */
  .agg-bar {
    background-image: linear-gradient(90deg, rgba(137, 180, 250, .12), rgba(148, 226, 213, .05) 58%, transparent);
  }
  .agg-bar .kpi .num { font-size: 30px; }
  .agg-bar .agg-state {
    justify-content: flex-start;         /* 状态正文靠左，与四列数值同一起点 */
    align-items: flex-end;               /* 贴值行底边 */
    min-height: 31.5px;                  /* = .num 30px × 1.05，令五列标题落在同一行 */
  }
  .agg-bar .agg-state .st { font-size: 24px; line-height: 1; }
  .agg-bar .agg-state .st.on  { color: var(--green); }
  .agg-bar .agg-state .st.off { color: var(--red); }

  /* ---- 基站参数字卡片 → 屏幕 08、09 ---- */
  .big-id { font-family: monospace; font-size: 24px; font-weight: 700; color: var(--blue); letter-spacing: 1px; }
  .cells { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .cell {
    background: var(--panel2);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 6px 10px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 3px;
    min-height: 0;
  }
  .cell.span2 { grid-column: span 2; }
  .cell .k { font-size: 11px; color: var(--muted); }
  .cell .v { font-family: monospace; font-size: 19px; font-weight: 700; color: var(--txt); }
  .cell .v small { font-size: 11px; font-weight: 400; color: var(--muted); margin-left: 4px; }
  .cell-hint { font-size: 11px; color: var(--muted); }

  /* ---- 链路状态列表（5 条 SIM 链路） → 屏幕 01、02 ---- */
  .sim-head, .sim-row {
    display: grid;
    grid-template-columns: 56px 72px 58px 100px 1fr 50px;
    gap: 8px;
    align-items: center;
  }
  .sim-head { font-size: 11px; color: var(--txt2); padding-bottom: 5px; border-bottom: 1px solid var(--line); }
  /* 表头与值行同用一套栅格，故纵向天然对齐；「信号强度」「实时带宽」两列的内容
     都是由多个元素拼成的组合（信号格 + 信号值、↑ + ↓），故标题居中于该列，
     下方内容整体居中，标题正落在组合内容的正中 */
  .sim-head > span:nth-child(4),
  .sim-head > span:nth-child(5) { text-align: center; }
  .sim-head > span:last-child { text-align: right; }
  .sim-list { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .sim-row { flex: 1; font-size: 12px; border-bottom: 1px solid rgba(49, 50, 68, .55); }
  .sim-row:last-child { border-bottom: none; }
  .sim-name { font-family: monospace; font-size: 13px; font-weight: 700; color: var(--txt); }
  /* 运营商列 = 官方 logo + 运营商名称
     图形一律放进 14×14 的方框内等比缩放（contain）：中国移动 / 中国电信的图形接近正方形、
     中国联通的「中国结」本身更扁宽（约 4:3），若统一按高 14px 放会把联通的图标撑得比另两家
     大一圈、名称也被推后 5px。改用统一的方框后，三家图形的视觉份量与名称的起始位置都对齐了 */
  .sim-op { display: flex; align-items: center; gap: 5px; color: var(--txt2); }
  .sim-op .op-logo { display: block; flex: none; width: 14px; height: 14px; object-fit: contain; }
  /* 在线状态五种：在线（绿）/ 拨号中（黄，链路正在建立）/ 离线（红）/ 未插卡（灰，卡槽为空）/
     已禁用（橙，链路被停用，非故障，不加呼吸辉光） */
  .sim-state { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--muted); }
  .sim-state .dot { width: 6px; height: 6px; background: var(--red); box-shadow: none; }   /* 离线：红点 */
  .sim-state.on { color: var(--green); }
  .sim-state.on .dot { background: var(--green); box-shadow: 0 0 6px rgba(166, 227, 161, .85); }
  .sim-state.dial { color: var(--yellow); }
  .sim-state.dial .dot { background: var(--yellow); box-shadow: 0 0 6px rgba(249, 226, 175, .85); }
  .sim-state.nosim .dot { background: var(--line2); }
  .sim-state.disabled { color: var(--peach); }
  .sim-state.disabled .dot { background: var(--peach); }
  .sim-sig { display: flex; justify-content: center; align-items: center; gap: 7px; }
  .sim-dbm { font-family: monospace; font-size: 11px; color: var(--txt2); }
  .sim-rate { display: flex; justify-content: center; gap: 10px; font-family: monospace; font-size: 12px; font-weight: 600; }
  /* 方向箭头恒为彩色（↑ blue / ↓ yellow），只有数值在无流量时转灰（.idle）：
     箭头与流量无关，做成静态素材即可 —— 串口屏上「上行箭头 / 下行箭头」各一张图，
     不必再为「有流量 / 无流量」各出一张 */
  .sim-rate .up   { color: var(--blue); }
  .sim-rate .down { color: var(--yellow); }
  .sim-rate .idle { color: var(--line2); }
  .sim-rate .arw  { font-style: normal; }
  .sim-ping { font-family: monospace; font-size: 12px; color: var(--mauve); text-align: right; }
  .sim-ping.idle { color: var(--line2); }

  /* 屏幕 02 专属：数值位宽固定 —— 「实时带宽 / 时延」的单位已提到表头（/Mbps、/ms），
     数值列只留数字，小数点与个位在 5 行之间落在同一条竖线上，不再随位数左右跳动。
     位宽固定的代价是带宽列比屏幕 01 宽，因此把横向空间重新分配：
     链路 / 运营商 / 在线状态 / 信号强度四列放宽，带宽列收窄到刚好容下 ↑/↓ 两个数值 */
  .sim-agg .sim-head, .sim-agg .sim-row {
    grid-template-columns: 48px 72px 60px 94px 1fr 50px;
    gap: 8px;
  }
  /* 前导空格 + 右对齐，位宽不足处留白；单位已一律提到表头，故右侧不再留后缀间隙 */
  .fix-fw { display: inline-block; font-style: normal; text-align: right; }
  .fix-fw.f3 { min-width: 3ch; }
  .fix-fw.f4 { min-width: 4ch; }
  .fix-fw.f6 { min-width: 6ch; }

  /* ---- 基站状态卡片（上下两张） → 屏幕 01、02 ---- */
  .bs-card {
    flex: 1;
    min-height: 0;
    background: var(--panel2);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 8px 10px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 10px;
  }
  /* 卡片底色随基站在线状态整体切换：在线淡绿、离线淡红，边框同步偏色 */
  .bs-card.on  { background: rgba(166, 227, 161, .10); border-color: rgba(166, 227, 161, .40); }
  .bs-card.off { background: rgba(243, 139, 168, .10); border-color: rgba(243, 139, 168, .40); }
  .bs-head { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .bs-name { font-size: 13px; font-weight: 700; color: var(--txt); }
  .bs-meta { display: flex; align-items: baseline; gap: 16px; }
  .bs-meta > .bs-kv { flex: 1; min-width: 0; }
  .bs-kv { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; }
  .bs-kv .k { font-size: 11px; color: var(--muted); }
  .bs-id  { font-family: monospace; font-size: 18px; font-weight: 700; color: var(--blue);  letter-spacing: .5px; }
  .bs-num { font-family: monospace; font-size: 18px; font-weight: 700; color: var(--green); }
  .bs-state { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--muted); }
  .bs-state.on  { color: var(--green); }
  .bs-state.off { color: var(--red); }

  /* ---- 底部提示栏 → 屏幕 01~09 ---- */
  .bar-bot {
    flex: 0 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 12px;
    background: var(--panel);
    border-top: 1px solid var(--line);
    font-size: 11px;
    color: var(--muted);
  }

  /* ---- 底部功能页脚（左 2 + 右 2 图标按钮，替代底栏） → 屏幕 01、02 ---- */
  .foot-bar {
    flex: 0 0 36px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 12px;
    background: var(--panel);
    border-top: 1px solid var(--line);
  }
  .foot-group { display: flex; align-items: center; gap: 8px; }
  .foot-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    height: 26px;
    padding: 0 12px;
    border: 1px solid var(--line2);
    border-radius: 5px;
    background: var(--panel2);
    color: var(--muted);                 /* 与 pics/button 下按钮素材的文字色一致，不随正文提亮 */
    font-size: 12px;
    cursor: pointer;                     /* 「版本信息」可点击弹出弹窗 */
  }
  .foot-btn svg { width: 14px; height: 14px; flex: none; }
  .foot-btn.danger { color: var(--red); border-color: rgba(243, 139, 168, .45); }

  /* ---- 弹窗（.modal / .modal-mask） → 屏幕 01、02 ---- */
  /*      版本信息：点击页脚「版本信息」弹出（宽度 410）
          屏幕亮度：点击页脚「屏幕亮度」弹出（.modal.sm 宽度 300，内含水平滑块）
          重启确认：点击页脚「重启设备」弹出（.modal.confirm 宽度 340，二级确认） */
  .modal-mask {
    position: absolute;
    inset: 0;
    z-index: 20;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(17, 17, 27, .68);
  }
  .modal-mask.on { display: flex; }
  .modal {
    width: 410px;
    background: var(--panel);
    border: 1px solid var(--line2);
    border-radius: 10px;
    box-shadow: 0 18px 46px rgba(0, 0, 0, .6);
    overflow: hidden;
  }
  .modal-head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 12px;
    background: var(--panel2);
    border-bottom: 1px solid var(--line);
  }
  .modal-head svg { width: 14px; height: 14px; flex: none; color: var(--blue); }
  .modal-title { font-size: 13px; font-weight: 600; color: var(--txt); letter-spacing: .4px; }
  .modal-close {
    margin-left: auto;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 18px;
    height: 18px;
    border-radius: 4px;
    background: rgba(243, 139, 168, .22);          /* 半透明红底：把「关闭」从常规控件里区分出来 */
    color: var(--red);
    cursor: pointer;
  }
  .modal-close:hover { background: rgba(243, 139, 168, .38); }
  .modal-close svg { width: 12px; height: 12px; color: currentColor; }
  .modal-body { padding: 6px 12px 12px; display: flex; flex-direction: column; }
  .ver-list { display: flex; flex-direction: column; }
  .ver-notes { margin-top: 6px; padding-top: 8px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 5px; }
  .ver-notes > .k { font-size: 11px; color: var(--muted); }
  /* 发布说明由上位机按运行版本下发，屏上是一个文本控件，故设计稿里不排真实条目：
     只画一个与原来四条说明等高的空文本框，边框标出文本控件的落位与大小，内部留空 */
  .ver-box { height: 72px; border: 1px solid var(--line2); border-radius: 5px; }

  /* 屏幕亮度弹窗：一个水平滑块 + 百分比读数 → 屏幕 01、02 */
  .modal.sm { width: 300px; }
  .bright-body { display: flex; align-items: center; gap: 10px; padding: 15px 12px 16px; }
  .slider {
    -webkit-appearance: none;
    appearance: none;
    flex: 1;
    height: 14px;
    background: transparent;
    cursor: pointer;
  }
  /* 轨道：已选段（--p 由拖动时的 JS 同步）用蓝色填充，未选段为分隔线色 */
  .slider::-webkit-slider-runnable-track {
    height: 4px;
    border-radius: 2px;
    background: linear-gradient(90deg, var(--blue) 0 var(--p), var(--line) var(--p) 100%);
  }
  .slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 12px;
    height: 12px;
    margin-top: -4px;                       /* (4 - 12) / 2：把滑块压回轨道中线 */
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 0 2px var(--blue), 0 1px 3px rgba(0, 0, 0, .55);
  }
  .slider::-moz-range-track { height: 4px; border-radius: 2px; background: var(--line); }
  .slider::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--blue); }
  .slider::-moz-range-thumb {
    width: 12px;
    height: 12px;
    border: 0;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 0 2px var(--blue), 0 1px 3px rgba(0, 0, 0, .55);
  }
  .bright-val { flex: none; width: 36px; text-align: right; font-size: 13px; color: var(--txt); }

  /* 重启设备二级确认弹窗 → 屏幕 01、02；由页脚「重启设备」按钮触发
     只有一行按钮，无提示文案；左「确认重启」右「取消」，两个按钮在弹窗内水平居中，
     「取消」比「确认重启」略大，提供一个更顺手的退出位 */
  .modal.confirm { width: 340px; }
  .modal.confirm .modal-head svg { color: var(--red); }      /* 危险操作：标题栏图标走红 */
  .confirm-foot { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 16px 12px 14px; }
  .cbtn {
    display: flex;
    align-items: center;
    height: 26px;
    padding: 0 14px;
    border: 1px solid var(--line2);
    border-radius: 5px;
    background: var(--panel2);
    color: var(--txt2);
    font-size: 12px;
    cursor: pointer;
  }
  .cbtn:hover { border-color: var(--muted); color: var(--txt); }
  .cbtn.cancel { height: 32px; padding: 0 30px; font-size: 13px; }   /* 比「确认重启」宽高都大一档 */
  .cbtn.danger { border-color: rgba(243, 139, 168, .5); background: rgba(243, 139, 168, .16); color: var(--red); font-weight: 600; }
  .cbtn.danger:hover { background: rgba(243, 139, 168, .28); }

  /* ---- 文本 / 颜色工具类 → 全部 9 屏通用 ---- */
  .mono { font-family: monospace; }
  .muted { color: var(--muted); }
  .good { color: var(--green); }
  .warn { color: var(--yellow); }
  .bad  { color: var(--red); }
  .up   { color: var(--blue); }
  .down { color: var(--yellow); }

  /* ======================= 尺寸标注（悬停查看） ======================= */
  .ruler-hl { outline: 1px dashed var(--yellow) !important; outline-offset: -1px; }
  .ruler-tip {
    position: fixed;
    z-index: 999;
    font-family: monospace;
    font-size: 11px;
    line-height: 15px;
    color: #11111b;
    background: var(--yellow);
    border-radius: 4px;
    padding: 4px 8px;
    white-space: nowrap;
    pointer-events: none;
    box-shadow: 0 3px 10px rgba(0, 0, 0, .45);
  }
  .ruler-tip b { font-weight: 700; }
  .ruler-tip .pos { opacity: .75; }
  .ruler-tip[hidden] { display: none; }
</style>

/* ============================================================
   二、工具函数
   ============================================================ */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fmt = (v, d = 1) => (v === null || v === undefined) ? '--' : v.toFixed(d);

/* 信号强度 -115 ~ -60 dBm 映射为 0 ~ 1 */
const signalPct = d => clamp((d + 115) / 55, 0, 1);
const signalBars = d => d >= -60 ? 5 : d >= -70 ? 4 : d >= -80 ? 3 : d >= -90 ? 2 : d >= -100 ? 1 : 0;
const sigColor = d => d >= -70 ? 'var(--green)' : d >= -85 ? 'var(--yellow)' : 'var(--red)';
const sigTone  = d => d >= -70 ? '' : d >= -85 ? 'warn' : 'bad';

/* 信号格 → 屏幕 01、02、04~07；0 格（无信号）时右上角叠一个红色 ✕ */
function barsHtml(n, tone) {
  let h = '<span class="bars ' + (tone || '') + '">';
  for (let i = 1; i <= 5; i++) h += '<i class="' + (i <= n ? 'on' : '') + '"></i>';
  if (!n) h += '<svg class="bars-x" viewBox="0 0 10 10" fill="none" stroke="currentColor" ' +
    'stroke-width="1.8" stroke-linecap="round"><path d="M1.7 1.7 8.3 8.3M8.3 1.7 1.7 8.3"/></svg>';
  return h + '</span>';
}

/* 速率趋势柱（用固定种子生成，保证每次渲染一致）→ 屏幕 03 */
function trend(seed, color, n) {
  n = n || 26;
  let h = '';
  for (let i = 0; i < n; i++) {
    const r = Math.abs(Math.sin(seed * 12.9898 + i * 78.233)) % 1;
    const v = .22 + r * .78;
    h += '<i style="height:' + (v * 100).toFixed(0) + '%;background:' + color +
         ';opacity:' + (.28 + v * .55).toFixed(2) + '"></i>';
  }
  return '<span class="trend">' + h + '</span>';
}

/* 环形仪表 → 屏幕 03、04~07 */
function ring(o) {
  const r = 34, c = 2 * Math.PI * r;
  const off = (c * (1 - clamp(o.pct, 0, 1))).toFixed(1);
  const size = o.size || 100;
  return '<span class="gauge"><svg width="' + size + '" height="' + size + '" viewBox="0 0 80 80">' +
    '<circle cx="40" cy="40" r="' + r + '" fill="none" stroke="#313244" stroke-width="8"/>' +
    '<circle cx="40" cy="40" r="' + r + '" fill="none" stroke-width="8" stroke-linecap="round"' +
      ' style="stroke:' + o.color + '" stroke-dasharray="' + c.toFixed(1) + '" stroke-dashoffset="' + off + '"' +
      ' transform="rotate(-90 40 40)"/>' +
    '<text class="ring-num" x="40" y="38" text-anchor="middle" style="fill:' + o.color + '">' + o.value + '</text>' +
    '<text class="ring-unit" x="40" y="54" text-anchor="middle" style="fill:#6c7086">' + o.unit + '</text>' +
    '</svg></span>';
}

/* 键值行 → 屏幕 03 */
const kv = (k, v) => '<div class="kv"><span class="k">' + k + '</span><span class="v">' + v + '</span></div>';

/* 分段选择器：[[文案, 是否选中, 色调]] → 屏幕 01、03、04~09 */
const seg = opts => '<span class="seg">' + opts.map(o =>
  '<span class="' + (o[1] ? 'on ' + (o[2] || '') : '') + '">' + o[0] + '</span>').join('') + '</span>';

/* 条形仪表 → 屏幕 01、02、04~09 */
const meter = (pct, color) =>
  '<span class="meter"><i style="width:' + (clamp(pct, 0, 1) * 100).toFixed(0) + '%;background:' + color + '"></i></span>';

/* 参数字卡片 → 屏幕 08、09 */
const cell = c => '<div class="cell' + (c[3] ? ' span2' : '') + '">' +
  '<span class="k">' + c[0] + '</span>' +
  '<span class="v">' + c[1] + (c[2] ? '<small>' + c[2] + '</small>' : '') + '</span></div>';

/* ============================================================
   三、页面骨架（9 屏共用的外壳与公共组件）
   ============================================================ */
/* 工程模式页签栏 → 屏幕 01、02、03 */
function engNav(active) {
  return ['直连模式', '聚合模式', '卫星传输'].map(t =>
      '<span class="tab' + (t === active ? ' on' : '') + '">' + t + '</span>').join('');
}

/* 运维模式页签栏 → 屏幕 04~09 */
function opsNav(active) {
  const links = OPS.map(o =>
    '<span class="tab' + (o.name === active ? ' on' : '') + '">' +
      '<i class="sd' + (o.online ? '' : ' off') + '"></i>' + o.name + '</span>').join('');
  const bts = ['4G基站', '5G基站'].map(t =>
    '<span class="tab' + (t === active ? ' on' : '') + '">' + t + '</span>').join('');
  return '<span class="nav-label">链路状态</span>' + links +
         '<span class="nav-sep"></span><span class="nav-label">基站状态</span>' + bts;
}

/* 线性图标（24×24 viewBox，颜色随所在按钮文字） */
const ico = d => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" ' +
  'stroke-linecap="round" stroke-linejoin="round">' + d + '</svg>';

/* 齿轮：8 齿，每齿 45° = 齿顶弧 20° + 斜边 5° + 齿根弧 15° + 斜边 5°；
   齿顶半径 9.4 / 齿根半径 7.1，中心孔 r3。与 pics/button/系统设置按键-*.png 的图形同源 */
const ICO_SETTINGS = ico('<path d="M21.26 10.37A9.4 9.4 0 0 1 21.26 13.63L18.86 13.84A7.1 7.1 0 0 1 18.15 15.55' +
  'L19.7 17.39A9.4 9.4 0 0 1 17.39 19.7L15.55 18.15A7.1 7.1 0 0 1 13.84 18.86' +
  'L13.63 21.26A9.4 9.4 0 0 1 10.37 21.26L10.16 18.86A7.1 7.1 0 0 1 8.45 18.15' +
  'L6.61 19.7A9.4 9.4 0 0 1 4.3 17.39L5.85 15.55A7.1 7.1 0 0 1 5.14 13.84' +
  'L2.74 13.63A9.4 9.4 0 0 1 2.74 10.37L5.14 10.16A7.1 7.1 0 0 1 5.85 8.45' +
  'L4.3 6.61A9.4 9.4 0 0 1 6.61 4.3L8.45 5.85A7.1 7.1 0 0 1 10.16 5.14' +
  'L10.37 2.74A9.4 9.4 0 0 1 13.63 2.74L13.84 5.14A7.1 7.1 0 0 1 15.55 5.85' +
  'L17.39 4.3A9.4 9.4 0 0 1 19.7 6.61L18.15 8.45A7.1 7.1 0 0 1 18.86 10.16Z"/>' +
  '<circle cx="12" cy="12" r="3"/>');
const ICO_INFO     = ico('<circle cx="12" cy="12" r="9"/><path d="M12 16.5v-5"/><path d="M12 8h.01"/>');
const ICO_SUN      = ico('<circle cx="12" cy="12" r="4.2"/>' +
  '<path d="M12 1.8v2.2M12 20v2.2M2.6 12H4.8M19.2 12h2.2M5.6 5.6 7.2 7.2M16.8 16.8l1.6 1.6M5.6 18.4l1.6-1.6M16.8 7.2l1.6-1.6"/>');
const ICO_POWER    = ico('<path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><path d="M12 2.5v9"/>');
const ICO_CLOSE    = ico('<path d="M6 6l12 12M18 6L6 18"/>');

/* 版本信息弹窗：版本号 / 构建时间 / commit id / 发布说明
   数据见「一、样例数据 → VERSION」；默认隐藏，由 .foot-btn[data-modal="ver"] 触发 */
function verModal() {
  const kv = (k, v, color) =>
    '<div class="kv"><span class="k">' + k + '</span>' +
      '<span class="v"' + (color ? ' style="color:' + color + '"' : '') + '>' + v + '</span></div>';
  return '<div class="modal-mask" data-modal="ver">' +
      '<div class="modal">' +
        '<div class="modal-head">' + ICO_INFO +
          '<span class="modal-title">版本信息</span>' +
          '<span class="tag teal">' + VERSION.ver + '</span>' +
          '<span class="modal-close">' + ICO_CLOSE + '</span>' +
        '</div>' +
        '<div class="modal-body">' +
          '<div class="ver-list">' +
            kv('版本号',    VERSION.ver, 'var(--blue)') +
            kv('构建时间',  VERSION.build) +
            kv('commit id', VERSION.commit, 'var(--mauve)') +
          '</div>' +
          '<div class="ver-notes"><span class="k">发布说明</span>' +
            '<div class="ver-box"></div>' +
          '</div>' +
        '</div>' +
      '</div>' +
    '</div>';
}

/* 屏幕亮度弹窗：一个水平滑块调节，读数实时同步
   默认值见 BRIGHT；由 .foot-btn[data-modal="bright"] 触发 */
const BRIGHT = 68;

function brightModal() {
  return '<div class="modal-mask" data-modal="bright">' +
      '<div class="modal sm">' +
        '<div class="modal-head">' + ICO_SUN +
          '<span class="modal-title">屏幕亮度</span>' +
          '<span class="modal-close">' + ICO_CLOSE + '</span>' +
        '</div>' +
        '<div class="bright-body">' +
          '<input class="slider" type="range" min="10" max="100" step="1" value="' + BRIGHT +
            '" style="--p:' + BRIGHT + '%" aria-label="屏幕亮度">' +
          '<span class="bright-val mono">' + BRIGHT + '%</span>' +
        '</div>' +
      '</div>' +
    '</div>';
}

/* 重启设备二级确认弹窗：危险操作不能一步到位，需二次确认
   由 .foot-btn[data-modal="reboot"] 触发；只有两个按钮，都表示「结束本次确认」 */
function confirmModal() {
  return '<div class="modal-mask" data-modal="reboot">' +
      '<div class="modal confirm">' +
        '<div class="modal-head">' + ICO_POWER +
          '<span class="modal-title">重启设备</span>' +
          '<span class="modal-close">' + ICO_CLOSE + '</span>' +
        '</div>' +
        '<div class="confirm-foot">' +
          '<span class="cbtn danger">确认重启</span>' +
          '<span class="cbtn cancel">取消</span>' +
        '</div>' +
      '</div>' +
    '</div>';
}

/* 底部功能页脚：左「系统设置 / 版本信息」，右「屏幕亮度 / 重启设备」 → 屏幕 01 使用 */
function footBar() {
  const btn = (label, icon, danger, modal) =>
    '<span class="foot-btn' + (danger ? ' danger' : '') + '"' +
      (modal ? ' data-modal="' + modal + '"' : '') + '>' + icon + '<span>' + label + '</span></span>';
  return '<div class="foot-bar">' +
      '<div class="foot-group">' +
        btn('系统设置', ICO_SETTINGS) +
        btn('版本信息', ICO_INFO, false, 'ver') +
      '</div>' +
      '<div class="foot-group">' +
        btn('屏幕亮度', ICO_SUN, false, 'bright') +
        btn('重启设备', ICO_POWER, true, 'reboot') +   /* 危险操作：弹二级确认，不直接执行 */
      '</div>' +
    '</div>' + verModal() + brightModal() + confirmModal();
}

/* 屏幕外壳：页眉 + 页签栏 + 内容区 + 底部（传入 footer 用功能页脚，否则用提示底栏） */
function shell(o) {
  const ops = o.group === '运维模式';
  return '<div class="bar-top">' +
      '<span class="mode-btn' + (ops ? '' : ' on') + '">工程模式</span>' +
      '<span class="mode-btn' + (ops ? ' on ops' : '') + '">运维模式</span>' +
    '</div>' +
    '<div class="bar-nav">' + o.nav + '</div>' +
    '<div class="body">' + o.body + '</div>' +
    (o.footer || '<div class="bar-bot"><span>' + o.foot + '</span><span>854×480 · 设计稿样例数据</span></div>');
}

/* 上下行速率面板（左右两个半区 + 趋势）→ 屏幕 04~07 使用 */
function ratePanel(up, down, seed) {
  return '<section class="panel row-panel">' +
      '<div class="half"><span class="k">上行速率</span>' +
        '<div class="kpi sm"><span class="num" style="color:var(--blue)">' + fmt(up) + '</span><span class="u">Mbps</span></div>' +
        trend(seed, 'var(--blue)', 22) +
      '</div>' +
      '<div class="half"><span class="k">下行速率</span>' +
        '<div class="kpi sm"><span class="num" style="color:var(--yellow)">' + fmt(down) + '</span><span class="u">Mbps</span></div>' +
        trend(seed + 5.7, 'var(--yellow)', 22) +
      '</div>' +
    '</section>';
}

/* 基站状态卡片（4G / 5G 各一张，上下排列）→ 屏幕 01、02 右侧使用
   只显示两项：物理小区 ID（cells[0]）与当前连接的用户个数；
   整卡底色随在线状态切换：在线淡绿（.on）/ 离线淡红（.off） */
function btsCard(b) {
  const pci = b.cells[0][1], on = b.online;
  return '<div class="bs-card ' + (on ? 'on' : 'off') + '">' +
      '<div class="bs-head"><span class="bs-name">' + b.label + '</span>' +
        '<span class="bs-state ' + (on ? 'on' : 'off') + '">' +
          '<i class="dot' + (on ? '' : ' bad') + '"></i>' + (on ? '在线' : '离线') +
        '</span></div>' +
      '<div class="bs-meta">' +
        '<div class="bs-kv"><span class="k">物理小区 ID</span><span class="bs-id">' + pci + '</span></div>' +
        '<div class="bs-kv"><span class="k">连接用户数</span><span class="bs-num">' + b.ue + '</span></div>' +
      '</div>' +
    '</div>';
}

/* 链路状态面板（5 条 SIM 链路）→ 屏幕 01、02 左侧共用
   单位一律提到表头（信号强度/dBm、实时带宽/Mbps、时延/ms），数值列只留数字，左右两屏口径一致；
   fixed = true（屏幕 02）时数值走固定位宽：带宽 000.00 / 时延 000 / 信号 -000，
   不足位宽处补白并右对齐，使小数点与个位在 5 行之间锁死 */
function simPanel(fixed) {
  const dec = fixed ? 2 : 1;                                  /* 屏幕 02 固定两位小数，屏幕 01 维持原样 */
  const fw = (txt, n) => fixed ? '<em class="fix-fw f' + n + '">' + txt + '</em>' : txt;
  const rows = SIMS.map(s => {
    const st = SIM_STATE[s.state];
    return '<div class="sim-row">' +
      '<span class="sim-name">' + s.name + '</span>' +
      '<span class="sim-op">' +
        (OP_LOGO[s.op] ? '<img class="op-logo" src="' + OP_LOGO[s.op] + '" alt="">' : '') +
        s.op + '</span>' +
      '<span class="sim-state ' + st.cls + '"><i class="dot"></i>' + s.state + '</span>' +
      '<span class="sim-sig">' + barsHtml(st.sig ? signalBars(s.signal) : 0, st.sig ? sigTone(s.signal) : '') +
        '<span class="sim-dbm">' + fw(st.sig ? s.signal : '--', 4) + '</span></span>' +
      '<span class="sim-rate">' +
        '<span class="up"><i class="arw">↑</i> <span class="' + (st.data ? 'up' : 'idle') + '">' + fw(st.data ? fmt(s.up, dec) : '--', 6) + '</span></span>' +
        '<span class="down"><i class="arw">↓</i> <span class="' + (st.data ? 'down' : 'idle') + '">' + fw(st.data ? fmt(s.down, dec) : '--', 6) + '</span></span>' +
      '</span>' +
      '<span class="sim-ping' + (st.data ? '' : ' idle') + '">' + fw(st.data ? fmt(s.ping, 0) : '--', 3) + '</span>' +
    '</div>';
  }).join('');

  return '<section class="panel' + (fixed ? ' sim-agg' : '') + '" style="flex:1">' +
      '<div class="panel-title"><span>链路状态</span></div>' +
      '<div class="sim-head">' +
        '<span>链路</span><span>运营商</span><span>在线状态</span>' +
        '<span>信号强度/dBm</span><span>实时带宽/Mbps</span><span>时延/ms</span>' +
      '</div>' +
      '<div class="sim-list">' + rows + '</div>' +
    '</section>';
}

/* 基站状态面板（4G / 5G 各一张卡片）→ 屏幕 01、02 右侧共用 */
function btsPanel() {
  return '<section class="panel" style="flex:1">' +
      '<div class="panel-title"><span>基站状态</span></div>' +
      btsCard(BTS4) +
      btsCard(BTS5) +
    '</section>';
}

/* ============================================================
   四、九个页面（每个函数就是界面上的一个屏幕，序号即页面序号）
   ============================================================ */

/* ========== 屏幕 01 · 工程模式 · 直连模式（首页默认） → renderDirect() ==========
   左：链路状态——5 条 SIM 链路，每行显示 运营商 / 在线状态 / 信号强度 / 实时带宽 / 时延
       （带宽与时延的单位统一写在表头，数值列只留数字）
   右：基站状态——上下两张卡片，分别为 4G 基站（在线·淡绿）与 5G 基站（离线·淡红）
   底：功能页脚——左「系统设置 / 版本信息」，右「屏幕亮度 / 重启设备」（替代提示底栏）
   ============================================================================== */
function renderDirect() {
  const body =
    '<div class="row" style="flex:1">' +
      '<div class="col" style="flex:0 0 552px">' + simPanel() + '</div>' +
      '<div class="col" style="flex:1">' + btsPanel() + '</div>' +
    '</div>';
  return shell({ group: '工程模式', nav: engNav('直连模式'), body: body, footer: footBar() });
}

/* ========== 屏幕 02 · 工程模式 · 聚合模式 → renderAgg() ==========
   与屏幕 01 直连模式同构：左「链路状态」+ 右「基站状态」+ 功能页脚，
   仅在其上方增加一条「聚合链路状态」卡片：连接状态 / 实时上下行速率 / 时延 / 聚合链路数量。
   ============================================================================== */
function renderAgg() {
  const on = SIMS.filter(s => s.state === '在线');
  const aggOn = on.length > 0;                 // 聚合链路：只要还有一条在线即为在线
  const sumUp = on.reduce((s, x) => s + x.up, 0);
  const sumDown = on.reduce((s, x) => s + x.down, 0);
  const avgPing = on.length ? on.reduce((s, x) => s + x.ping, 0) / on.length : 0;

  /* 数值按固定位宽输出：速率 000.00、时延 000。
     不足位宽处补白并右对齐，Mbps / ms 的起点便不随数字位数左右跳动，做法与链路状态表一致 */
  const fw = (txt, n) => '<em class="fix-fw f' + n + '">' + txt + '</em>';

  const aggBar =
    '<div class="row" style="flex:0 0 96px">' +
      '<section class="panel row-panel agg-bar" style="flex:1">' +
        '<div class="half"><span class="k">聚合链路状态</span>' +
          '<div class="kpi agg-state">' +
            '<span class="st ' + (aggOn ? 'on' : 'off') + '">' + (aggOn ? '在线' : '离线') + '</span>' +
          '</div></div>' +
        '<div class="half"><span class="k">实时上行速率</span>' +
          '<div class="kpi"><span class="num" style="color:var(--blue)">' + fw(sumUp.toFixed(2), 6) +
            '</span><span class="u">Mbps</span></div></div>' +
        '<div class="half"><span class="k">实时下行速率</span>' +
          '<div class="kpi"><span class="num" style="color:var(--yellow)">' + fw(sumDown.toFixed(2), 6) +
            '</span><span class="u">Mbps</span></div></div>' +
        '<div class="half"><span class="k">时延</span>' +
          '<div class="kpi"><span class="num" style="color:var(--mauve)">' + fw(avgPing.toFixed(0), 3) +
            '</span><span class="u">ms</span></div></div>' +
        '<div class="half"><span class="k">聚合链路数量</span>' +
          '<div class="kpi"><span class="num" style="color:var(--green)">' + on.length +
            '<span class="of">/' + SIMS.length + '</span></span><span class="u">在线</span></div></div>' +
      '</section>' +
    '</div>';

  const body = aggBar +
    '<div class="row" style="flex:1">' +
      '<div class="col" style="flex:0 0 552px">' + simPanel(true) + '</div>' +
      '<div class="col" style="flex:1">' + btsPanel() + '</div>' +
    '</div>';

  return shell({ group: '工程模式', nav: engNav('聚合模式'), body: body, footer: footBar() });
}

/* ========== 屏幕 03 · 工程模式 · 卫星传输 → renderSat() ========== */
function renderSat() {
  const body =
    '<div class="row" style="flex:1">' +
      '<div class="col" style="flex:0 0 288px">' +
        '<section class="panel">' +
          '<div class="panel-title"><span>卫星信号（载噪比）</span><span class="tag teal">Ku 频段</span></div>' +
          '<div class="gauge-wrap">' +
            ring({ pct: .78, color: 'var(--teal)', value: SAT.cn0, unit: 'dBHz', size: 116 }) +
            '<span class="big-hint">良好</span>' +
          '</div>' +
          '<div class="field"><span class="k">链路状态</span>' + seg([['已锁定', true], ['搜索中', false]]) + '</div>' +
        '</section>' +
      '</div>' +
      '<div class="col" style="flex:1">' +
        '<section class="panel"><div class="panel-title"><span>上行速率</span><span class="tag teal">实时</span></div>' +
          '<div class="kpi"><span class="num" style="color:var(--blue)">' + fmt(SAT.up) + '</span><span class="u">Mbps</span></div>' +
          trend(2.9, 'var(--blue)') + '</section>' +
        '<section class="panel"><div class="panel-title"><span>下行速率</span><span class="tag teal">实时</span></div>' +
          '<div class="kpi"><span class="num" style="color:var(--yellow)">' + fmt(SAT.down) + '</span><span class="u">Mbps</span></div>' +
          trend(6.1, 'var(--yellow)') + '</section>' +
      '</div>' +
      '<div class="col" style="flex:0 0 288px">' +
        '<section class="panel" style="flex:1">' +
          '<div class="panel-title"><span>卫星参数</span></div>' +
          kv('卫星标识', 'SAT-KU-03') +
          kv('波束', '亚太6D · 东波束') +
          kv('仰角', '45.2°') +
          kv('方位角', '182.4°') +
          kv('频段', 'Ku · 12.5GHz') +
          kv('时延', SAT.ping + ' ms') +
          kv('抖动', SAT.jitter + ' ms') +
        '</section>' +
      '</div>' +
    '</div>';
  return shell({ group: '工程模式', nav: engNav('卫星传输'), body: body, foot: '工程模式 · 卫星链路传输' });
}

/* ========== 屏幕 04~07 · 运维模式 · 运营商链路详情（共用本模板） ==========
   调用方式见「五、页面清单」SCREENS：
     SCREENS[3] → renderOperator(OPS[0], 1.3)  屏幕 04 首页默认 · 中国移动1
     SCREENS[4] → renderOperator(OPS[1], 2.7)  屏幕 05 中国移动2
     SCREENS[5] → renderOperator(OPS[2], 3.9)  屏幕 06 中国电信
     SCREENS[6] → renderOperator(OPS[3], 5.1)  屏幕 07 中国联通（离线）
   四屏结构完全相同，差异只来自传入的 op 数据（改数据见「一、样例数据 → OPS」）。
   ========================================================================== */
function renderOperator(op, seed) {
  const rows = op.neighbors.length
    ? op.neighbors.map(n =>
        '<div class="trow">' +
          '<span class="mono">' + n.cell + '</span>' +
          '<span class="mono">' + n.pci + '</span>' +
          '<span class="mono muted">' + n.freq + '</span>' +
          '<span class="mono ' + (n.rsrp >= -80 ? 'good' : n.rsrp >= -95 ? 'warn' : 'bad') + '">' + n.rsrp + ' dBm</span>' +
          '<span><span class="lock' + (n.lock ? ' on' : '') + '">' + (n.lock ? '已锁定' : '锁定') + '</span></span>' +
        '</div>').join('')
    : '<div class="empty">无邻区信息（当前链路已离线）</div>';

  const pingPct = op.ping === null ? 0 : clamp(op.ping / 200, 0, 1);
  const jitPct  = op.jitter === null ? 0 : clamp(op.jitter / 50, 0, 1);

  const body =
    '<div class="row" style="flex:0 0 194px">' +
      '<section class="panel" style="flex:0 0 280px">' +
        '<div class="field"><span class="k">在线状态</span>' +
          seg([['在线', op.online], ['离线', !op.online, 'bad']]) + '</div>' +
        '<div class="field"><span class="k">入网制式</span>' +
          seg([['SA', op.net === 'SA'], ['LTE', op.net === 'LTE']]) + '</div>' +
        '<div class="gauge-wrap">' +
          ring({ pct: op.online ? signalPct(op.signal) : 0, color: sigColor(op.signal),
                 value: op.signal, unit: 'dBm', size: 96 }) +
          barsHtml(op.online ? signalBars(op.signal) : 0, sigTone(op.signal)) +
        '</div>' +
      '</section>' +
      ratePanel(op.up, op.down, seed) +
      '<section class="panel" style="flex:0 0 280px">' +
        '<div class="panel-title"><span>时延 / 抖动</span></div>' +
        '<div class="metric"><span class="k">时延</span><span class="v">' + fmt(op.ping, 0) + '</span><span class="u">ms</span></div>' +
        meter(pingPct, 'var(--mauve)') +
        '<div class="metric jit"><span class="k">抖动</span><span class="v">' + fmt(op.jitter, 0) + '</span><span class="u">ms</span></div>' +
        meter(jitPct, 'var(--peach)') +
      '</section>' +
    '</div>' +
    '<div class="row" style="flex:1">' +
      '<section class="panel" style="flex:1">' +
        '<div class="panel-title"><span>邻区信息</span><span class="tag yellow">支持锁定</span></div>' +
        '<div class="thead"><span>小区标识</span><span>PCI</span><span>频点</span><span>参考信号</span><span>锁定</span></div>' +
        '<div class="tbl">' + rows + '</div>' +
      '</section>' +
    '</div>';

  return shell({
    group: '运维模式',
    nav: opsNav(op.name),
    body: body,
    foot: '运维模式' + (op === OPS[0] ? '首页（默认）· 点击中国移动1 进入' : ' · ' + op.name + '链路详情')
  });
}

/* ========== 屏幕 08~09 · 运维模式 · 基站状态（共用本模板） ==========
   SCREENS[7] → renderBase(BTS4)  屏幕 08 4G基站
   SCREENS[8] → renderBase(BTS5)  屏幕 09 5G基站
   两屏结构相同，差异只来自传入的 b 数据（改数据见「一、样例数据 → BTS4 / BTS5」）。
   ================================================================== */
function renderBase(b) {
  const body =
    '<div class="row" style="flex:1">' +
      '<section class="panel" style="flex:0 0 320px">' +
        '<div class="panel-title"><span>' + b.idName + '</span></div>' +
        '<div class="big-id">' + b.id + '</div>' +
        '<div class="field"><span class="k">小区状态</span>' +
          seg([['激活', b.status === '激活'], ['未激活', b.status !== '激活', 'bad']]) + '</div>' +
        '<div class="hr"></div>' +
        '<span class="k muted" style="font-size:11px">UE 个数</span>' +
        '<div class="kpi"><span class="num" style="color:var(--green)">' + b.ue + '</span><span class="u">个</span></div>' +
        meter(b.ue / b.ueMax, 'var(--green)') +
        '<div class="cell-hint">小区容量 ' + b.ueMax + ' · 负载 ' + (b.ue / b.ueMax * 100).toFixed(0) + '%</div>' +
      '</section>' +
      '<section class="panel" style="flex:1">' +
        '<div class="panel-title"><span>小区参数</span><span class="tag">' + b.label + '</span></div>' +
        '<div class="cells">' + b.cells.map(cell).join('') + '</div>' +
      '</section>' +
    '</div>';

  return shell({ group: '运维模式', nav: opsNav(b.label), body: body, foot: '运维模式 · ' + b.label + '状态' });
}

/* ============================================================
   五、页面清单（9 屏）
   数组第 N 项 = 页面第 N 屏，渲染顺序即界面上的纵向排列顺序。
   末尾再追加 PLACEHOLDERS 个空白页面（屏幕 10~14）作为预留区域。
   ============================================================ */
const SCREENS = [
  /* 屏幕 01 */ { g: '工程模式', n: '直连模式（首页默认）', h: renderDirect },
  /* 屏幕 02 */ { g: '工程模式', n: '聚合模式',             h: renderAgg },
  /* 屏幕 03 */ { g: '工程模式', n: '卫星传输',             h: renderSat },
  /* 屏幕 04 */ { g: '运维模式', n: '首页默认 · 中国移动1',  h: () => renderOperator(OPS[0], 1.3) },
  /* 屏幕 05 */ { g: '运维模式', n: '中国移动2',            h: () => renderOperator(OPS[1], 2.7) },
  /* 屏幕 06 */ { g: '运维模式', n: '中国电信',             h: () => renderOperator(OPS[2], 3.9) },
  /* 屏幕 07 */ { g: '运维模式', n: '中国联通（离线）',      h: () => renderOperator(OPS[3], 5.1) },
  /* 屏幕 08 */ { g: '运维模式', n: '4G基站',               h: () => renderBase(BTS4) },
  /* 屏幕 09 */ { g: '运维模式', n: '5G基站',               h: () => renderBase(BTS5) }
];

/* 预留空白区域数量（追加在 09 屏之后，只有空白画面，不含任何内容） */
const PLACEHOLDERS = 5;

/* 画布上的单屏外壳：头部信息 + 854×480 视口 */
const frameHtml = (i, o) =>
  '<section class="frame" id="frame-' + i + '">' +
    '<header class="frame-head">' +
      '<span class="idx">' + String(i + 1).padStart(2, '0') + '</span>' +
      '<span class="fgroup' + (o.gcls || '') + '">' + o.group + '</span>' +
      '<span class="fname">' + o.name + '</span>' +
      '<span class="fsize">854×480</span>' +
    '</header>' +
    '<div class="viewport"><div class="screen">' + o.body + '</div></div>' +
  '</section>';

/* 渲染画布 + 页签（画布上的 01~09 编号即页面序号，与 SCREENS 下标 +1 一致） */
function build() {
  const frames = SCREENS.map((s, i) => frameHtml(i, {
    group: s.g, gcls: s.g === '运维模式' ? ' ops' : '', name: s.n, body: s.h()
  }));
  /* 末尾追加预留空白区域：无标题、无内容的空画面 */
  for (let k = 0; k < PLACEHOLDERS; k++) {
    frames.push('<section class="frame" id="frame-' + (SCREENS.length + k) + '">' +
        '<div class="viewport"><div class="screen"></div></div>' +
      '</section>');
  }
  document.getElementById('grid').innerHTML = frames.join('');

  document.getElementById('tabs').innerHTML = SCREENS.map((s, i) =>
    '<button class="ttab' + (s.g === '运维模式' ? ' ops' : '') + '" data-go="' + i + '">' +
      '<i>' + (i + 1) + '</i>' + s.n + '</button>').join('');
}

/* 页签：滚动定位到对应屏幕并高亮 */
let activeTab = null, flashTimer = null;
document.getElementById('tabs').addEventListener('click', e => {
  const btn = e.target.closest('.ttab');
  if (!btn) return;
  const i = +btn.dataset.go;
  const frame = document.getElementById('frame-' + i);
  frame.scrollIntoView({ behavior: 'smooth', block: 'center' });

  if (activeTab) activeTab.classList.remove('active');
  btn.classList.add('active');
  activeTab = btn;

  clearTimeout(flashTimer);
  document.querySelectorAll('.frame.flash').forEach(f => f.classList.remove('flash'));
  frame.classList.add('flash');
  flashTimer = setTimeout(() => frame.classList.remove('flash'), 900);
});

/* ============================================================
   六、弹窗交互：点击页脚「版本信息 / 屏幕亮度 / 重启设备」弹出，
       点遮罩 / 关闭按钮 / 确认弹窗的任一按钮 / Esc 关闭
   ============================================================ */
document.getElementById('grid').addEventListener('click', e => {
  const btn = e.target.closest('.foot-btn[data-modal]');
  if (btn) {                                          /* 打开弹窗（再次点击则收起） */
    const mask = btn.closest('.screen')
      .querySelector('.modal-mask[data-modal="' + btn.dataset.modal + '"]');
    if (mask) mask.classList.toggle('on');
    return;
  }
  const mask = e.target.closest('.modal-mask');
  if (!mask) return;
  /* 确认弹窗的两个按钮只是设计样例，均表示「结束本次确认」 */
  if (e.target.closest('.modal-close') || e.target.closest('.cbtn') || e.target === mask) {
    mask.classList.remove('on');
  }
});

/* 亮度滑块：拖动时同步已选段填充（--p）与百分比读数 */
document.getElementById('grid').addEventListener('input', e => {
  if (!e.target.classList.contains('slider')) return;
  const s = e.target;
  s.style.setProperty('--p', s.value + '%');
  s.parentElement.querySelector('.bright-val').textContent = s.value + '%';
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') document.querySelectorAll('.modal-mask.on').forEach(m => m.classList.remove('on'));
});

/* ============================================================
   七、缩放：默认按视口宽度自适应，单列下尽量接近 1:1
   ============================================================ */
const STAGE_PAD = 44;   /* 舞台左右内边距 */
let manual = false, scale = 1;

function fitScale() {
  /* 用舞台自身的 clientWidth，已排除竖向滚动条占位 */
  const avail = document.querySelector('.stage').clientWidth - STAGE_PAD;
  return Math.min(1, Math.max(0.3, avail / 854));
}
function applyZoom() {
  document.documentElement.style.setProperty('--s', scale);
  document.getElementById('zoomLabel').textContent = Math.round(scale * 100) + '%';
}
document.getElementById('zoomIn').onclick  = () => { manual = true; scale = Math.min(scale + 0.08, 1); applyZoom(); };
document.getElementById('zoomOut').onclick = () => { manual = true; scale = Math.max(scale - 0.08, 0.2); applyZoom(); };
document.getElementById('reset').onclick   = () => { manual = false; scale = fitScale(); applyZoom(); };
window.addEventListener('resize', () => { if (!manual) { scale = fitScale(); applyZoom(); } });

/* ============================================================
   八、尺寸标注（悬停查看真实设计像素）
   ============================================================ */
const RULER_SEL = [
  '.bar-top', '.mode-btn', '.bar-nav', '.tab', '.body', '.row', '.col', '.panel', '.panel-title',
  '.gauge-wrap', '.kpi', '.trend', '.kv', '.seg', '.meter', '.thead', '.trow', '.tbl',
  '.cell', '.bars', '.bar-bot',
  '.sim-head', '.sim-list', '.sim-row', '.sim-name', '.sim-op', '.sim-state', '.sim-sig',
  '.sim-dbm', '.sim-rate', '.sim-ping', '.fix-fw',
  '.bs-card', '.bs-head', '.bs-name', '.bs-meta', '.bs-id', '.bs-state',
  '.foot-bar', '.foot-group', '.foot-btn',
  '.modal-mask', '.modal', '.modal-head', '.modal-title', '.modal-close', '.modal-body', '.ver-notes', '.ver-box',
  '.bright-body', '.slider', '.bright-val',
  '.confirm-foot', '.cbtn',
  '.big-id', '.field', '.half', '.metric', '.big-hint', '.cell-hint', '.empty',
  '.agg-bar', '.lock', '.tag'
].join(', ');

const RULER_NAMES = {
  'screen': '屏幕', 'bar-top': '页眉', 'mode-btn': '模式按钮', 'bar-nav': '页签栏', 'tab': '页签', 'body': '内容区',
  'row': '行容器', 'col': '列容器', 'panel': '面板', 'panel-title': '面板标题', 'gauge-wrap': '仪表区',
  'kpi': '大数值', 'num': '数值', 'trend': '速率趋势', 'kv': '键值行', 'seg': '选择器',
  'meter': '条形仪表', 'thead': '表头', 'trow': '表格行', 'tbl': '表格体', 'cell': '参数字',
  'bars': '信号格', 'bar-bot': '底栏', 'agg-bar': '聚合状态条',
  'big-id': '设备标识', 'field': '字段行', 'half': '半区', 'metric': '指标',
  'big-hint': '状态文字', 'cell-hint': '容量说明', 'empty': '空状态',
  'tag': '标签', 'lock': '锁定徽章', 'k': '字段名', 'v': '值', 'u': '单位', 'mono': '文本',
  'sd': '状态点', 'dot': '状态点',
  'sim-head': '链路表头', 'sim-list': '链路列表', 'sim-row': 'SIM 链路行', 'sim-name': 'SIM 名', 'sim-op': '运营商',
  'sim-state': '在线状态', 'sim-sig': '信号强度', 'sim-dbm': '信号值', 'sim-rate': '实时带宽',
  'sim-ping': '时延', 'fix-fw': '等宽数值域', 'bs-card': '基站卡', 'bs-head': '基站卡头', 'bs-name': '基站名',
  'bs-id': '物理小区 ID', 'bs-num': '连接用户数', 'bs-meta': '基站指标行', 'bs-kv': '基站指标', 'bs-state': '基站状态',
  'foot-bar': '功能页脚', 'foot-group': '页脚按钮组', 'foot-btn': '页脚按钮',
  'modal-mask': '弹窗遮罩', 'modal': '弹窗', 'modal-head': '弹窗标题栏',
  'modal-title': '弹窗标题', 'modal-close': '关闭按钮', 'modal-body': '弹窗内容', 'ver-notes': '发布说明',
  'ver-box': '发布说明文本框',
  'bright-body': '亮度调节区', 'slider': '亮度滑块', 'bright-val': '亮度读数',
  'confirm-foot': '确认按钮组', 'cbtn': '确认按钮'
};

const tip = document.getElementById('rulerTip');
let rulerOn = true;                       /* 默认开启：悬浮即显示坐标与尺寸 */
const clearHl = () => document.querySelectorAll('.ruler-hl').forEach(x => x.classList.remove('ruler-hl'));

const RULER_GROUPS = '.bars, .meter, .seg, .trend, svg';   /* 组合图标：内部小块统一标注整体 */

/* 标注对象：优先鼠标下的最小元素（文本 / 状态点 / 图标），否则回溯到最近的语义容器 */
function rulerTarget(el, scr) {
  if (!el || el === scr) return scr;
  if (el.tagName.toLowerCase() === 'svg') return el;   /* 图标本体 */
  const grp = el.closest(RULER_GROUPS);
  if (grp) return grp;                                 /* 组合图标内部 → 回到整体 */
  if (el.children.length === 0) return el;             /* 无子元素的文本 / 小块 → 逐个标注 */
  return el.closest(RULER_SEL) || el;
}

/* 元素命名：优先查名称表，其次 id，再次元素自身文本，最后标签.类名 */
function rulerName(el) {
  if (el.tagName.toLowerCase() === 'svg') return '图标';
  const cls = (el.getAttribute('class') || '').split(' ').filter(Boolean);
  for (let i = 0; i < cls.length; i++) if (RULER_NAMES[cls[i]]) return RULER_NAMES[cls[i]];
  if (el.id) return '#' + el.id;
  const txt = el.children.length === 0 ? el.textContent.trim() : '';
  if (txt) return '“' + (txt.length > 16 ? txt.slice(0, 16) + '…' : txt) + '”';
  return el.tagName.toLowerCase() + (cls[0] ? '.' + cls[0] : '');
}

document.addEventListener('mouseover', e => {
  if (!rulerOn) return;
  const scr = e.target.closest('.screen');
  if (!scr) { clearHl(); tip.hidden = true; return; }

  const t = rulerTarget(e.target, scr);
  clearHl();
  t.classList.add('ruler-hl');

  /* 换算成 854×480 设计稿坐标（除以当前缩放比例），并给出区域范围 */
  const sr = scr.getBoundingClientRect(), tr = t.getBoundingClientRect();
  const x = Math.round((tr.left - sr.left) / scale);
  const y = Math.round((tr.top  - sr.top ) / scale);
  const w = Math.round(tr.width  / scale);
  const h = Math.round(tr.height / scale);
  const font = t.children.length === 0 ? ' · 字号 ' + getComputedStyle(t).fontSize : '';

  tip.innerHTML = '<b>' + rulerName(t) + '</b> · 尺寸 ' + w + ' × ' + h +
                  '<br><span class="pos">位置 x ' + x + ' · y ' + y +
                  ' · 范围 ' + x + '~' + (x + w) + ' , ' + y + '~' + (y + h) + font + '</span>';
  tip.hidden = false;
});

document.addEventListener('mousemove', e => {
  if (tip.hidden) return;
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let x = e.clientX + 14, y = e.clientY + 16;
  if (x + w > window.innerWidth - 8) x = e.clientX - w - 14;
  if (y + h > window.innerHeight - 8) y = e.clientY - h - 16;
  tip.style.left = x + 'px';
  tip.style.top = y + 'px';
});

document.getElementById('toggleRuler').onclick = function () {
  rulerOn = !rulerOn;
  clearHl();
  tip.hidden = true;
  this.textContent = rulerOn ? '隐藏尺寸' : '显示尺寸';
  this.style.background = rulerOn ? 'var(--yellow)' : '';
  this.style.color = rulerOn ? '#11111b' : '';
};

/* 启动 */
build();
scale = fitScale();
applyZoom();
</script>

</body>
